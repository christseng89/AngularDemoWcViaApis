openapi: 3.0.3
info:
  title: Balance Component Service API
  description: >
    OpenAPI contract for the Balance Component microservice — the
    contingent / off-balance-sheet exposure ledger for LC-related trade
    finance instruments (LC Balance, Acceptance, Shipping Guarantee, Export
    Confirmation). Originally extracted from
    analysis/COMMON-BalanceComponent-Design-zh.md and
    analysis/COMMON-BalanceComponent-Cross-Reference.md; from v1.0.0 onward
    this file is re-grounded directly against the real, currently-running
    implementation under microservices/balance-component/src/ — where an
    earlier draft version of this file described an endpoint or field that
    was never actually built, it has been removed here rather than left as
    aspirational documentation. Where the design documents and the shipped
    implementation disagree, this file follows the implementation and notes
    the discrepancy inline.


    Explicitly OUT OF SCOPE: IBL/EBL and any actual funded/discounted
    exposure (Loan Component's domain, fronting the external eLoan system —
    see Design doc §1 and Cross-Reference Finding 3b), interest/accrual
    calculation (also Loan Component's domain), and GL account mapping
    (Balance Component only carries caller-supplied accountEntries through
    to a downstream accounting component — see §2/§3.3 "GL Ownership").


    Core model (Design doc §3): a `BalanceContract` is one immutable
    version-snapshot of a `logicalContractId` (the stable business identity
    of one LC, one Acceptance, one Shipping Guarantee, or one Export
    Confirmation). At most one version per logicalContractId is ever
    `ACTIVE`. A `BalanceMovement` is an append-only, never-deleted record
    of one exposure-amount change against one specific contract version.


    API design principle — ONE MOVEMENT, ONE LEG, ONE CALL: every mutating
    endpoint in this contract creates or transitions exactly one
    `BalanceMovement`. There is no batch or compound endpoint anywhere in
    this service, even for the several named business functions (see the
    companion Web/Mobile Channel API, balance-component-channel-api.yaml)
    that are business-approved to require more than one linked movement in
    sequence (e.g. Document Arrival w/ Shipping Guarantee's SG redemption +
    LC utilization, or Confirmation Honour/Accept's multi-leg compound).
    Linking related movements across separate calls is done with the
    caller-supplied `businessEventId` (correlation only, never a
    transaction boundary — this service does not offer cross-movement
    atomicity; a caller whose second leg fails after the first succeeded
    gets a partial result and must decide how to compensate, exactly as
    every existing linked-movement business function already documents).


    CURRENCY DERIVATION (NEW, v1.0.0, business-requested 2026-08-16): the
    server now derives and validates `currency` server-side instead of
    trusting the caller for any movement that is not the very first,
    root-level creation of a new Logical Contract. Precisely:
      1. If the request resolves (via `balanceContractId`, or via
         `naturalKey` matching an existing ACTIVE `BalanceContract`) to an
         EXISTING contract, `currency` is derived from that contract's own
         stored `currency` — a caller-supplied `currency` that does not
         match is rejected (`409 CURRENCY_MISMATCH`); omitting it entirely
         is fine and recommended.
      2. Else, if the request is creating a brand-new child Logical
         Contract (a creating movementType — ISSUE/CREATE — with no
         existing resolution) AND `parentLogicalContractId` is supplied,
         `currency` is derived the same way from the PARENT's own current
         `currency` (same match-or-omit rule). This covers every "carried
         from the parent LC/Confirmation" function — a new Acceptance,
         Shipping Guarantee, or Present Docs earmark always takes its
         Currency from the LC/Confirmation it is created under, never
         freely typed.
      3. Only when creating a genuinely ROOT new Logical Contract — a
         creating movementType with no existing resolution AND no
         `parentLogicalContractId` (i.e. `IPLC_LC`/`EPLC_CONFIRMATION`
         `ISSUE`) — is `currency` caller-supplied and REQUIRED; it becomes
         this new Logical Contract's own authoritative Currency Code for
         every future movement against it or anything created under it.
    This mirrors, at the data-model level, the channel-facing business
    rule ("A1/B1 Currency Code = User Input; every other function = Carried
    forward + Protected") without this service needing to know about named
    business-function codes at all — it only needs to know whether a
    request resolves to an existing contract, or a parent, or neither.


    v0.1.0 (draft, 2026-08-14): initial extraction from the design
    documents.


    v0.2.0 (draft, 2026-08-14): added the off-balance-sheet exposure
    two-tier WARNING/ERROR check (Design doc §6.1), later hardened to a
    single ERROR tier — see v0.7.0/v1.0.0 below.


    v0.3.0 (draft, 2026-08-14): added Tolerance conversion for
    IPLC_LC/EPLC_LC face-amount movements (Design doc §6.2).
    `BalanceContract.tolerancePct` and `BalanceMovement.ceilingAmount` are
    new; for ISSUE/AMEND_INCREASE/AMEND_DECREASE, `amount` is the
    caller-typed face-level delta and `ceilingAmount = amount ×
    (1+tolerancePct/100)` is what the server actually applies against
    Confirmed Balance and checks AMEND_DECREASE sufficiency against.


    v0.4.0 (draft, 2026-08-14): SHGT's `REDEEM` movementType is replaced by
    `PARTIAL_REDEEM`/`FULL_REDEEM` (Design doc §5, v0.6) — a redemption may
    now release less than the SG's full outstanding balance. Redemption
    amount is NEVER auto-derived from a UTILIZE/Document-Arrival amount,
    even when they happen to match — the caller must submit the redemption
    explicitly.


    v0.5.0 / v0.6.0 (draft, 2026-08-14): SG `ISSUE` is hard-capped at its
    parent LC's current Tight Available Balance (Available Balance minus
    the LC's own other outstanding SG exposure), checked at Maker
    submission — `409 InsufficientBalanceError`, not merely a warning. The
    original LMTS-Available-Limit-based design is superseded for this
    check (the LMTS integration mechanism itself remains untraced and
    unused — represented only as an opaque `lmtsReservationId` passthrough
    field).


    v0.7.0 (draft, 2026-08-14): the §6.1 off-balance-sheet exposure check
    on a UTILIZE (Document Arrival) is a hard `409 InsufficientBalanceError`,
    same tier as exceeding plain Available Balance — no longer a
    non-blocking warning. A caller deliberately consuming a specific
    outstanding Shipping Guarantee's reserved capacity creates that SG's
    own `FULL_REDEEM`/`PARTIAL_REDEEM` (still PENDING) BEFORE calling
    `POST /balance-movements` for the UTILIZE — the exposure computation
    already counts a PENDING redemption the same as a RELEASED one, so its
    contribution is already netted out by the time the UTILIZE's own check
    runs. Purely a client-side call-ordering pattern (`businessEventId`
    links the two calls for audit/query only, not atomicity).


    v0.8.0 (2026-08-16): catches this contract up to the implemented Export
    Confirmation (保兌) side. `InstrumentType` gains `EPLC_EXAMINATION`
    (Present Docs — MEMO_ONLY, CREATE-only memo earmark that never moves
    the parent Confirmation's own balance, per cs-tf-balance-knowhow Design
    Principle D3), plus the three ON_BALANCE_ASSET instruments a
    Confirmation's own HONOUR/ACCEPT transforms into:
    `EPLC_DUE_FROM_ISSUING_BANK` (Sight), `EPLC_ACCEPTANCE_REIMB_RECEIVABLE`
    (Usance, paired with `EPLC_ACCEPTANCE`'s own DPU liability),
    `EPLC_EXPORT_BILLS_DISCOUNTED` (Nego'd Usance — reclass target only, no
    consuming endpoint). New `POST /balance-movements/{movementId}/acknowledge`
    and `BalanceMovement.acknowledgedBy`/`acknowledgedAt` — a Checker's
    acknowledgment of a still-PENDING `EPLC_EXAMINATION` CREATE, distinct
    from `/release`: sets acknowledgedBy/acknowledgedAt but deliberately
    never transitions `status`, so a later Honour/Accept step can still
    find and consume it. Backs `BalanceSnapshot.presentDocsEarmarkPending`/
    `presentDocsEarmarkApproved` (EPLC_CONFIRMATION only). Scope correction:
    `EPLC_DUE_FROM_ISSUING_BANK` (Sight) is a pure receivable with no
    paired liability and no settling endpoint in this contract — a
    deliberate, permanent scope boundary ("Balance Component 只負責
    Contingent Liability"), not a gap.


    v1.0.0 (2026-08-16) — re-grounded against the real implementation,
    correcting several points where this file had drifted from what was
    actually shipped, and adding the currency-derivation rule above:
      - REMOVED (never implemented, no route/service method exists):
        `GET /balance-contracts/{logicalContractId}/history`,
        `POST /balance-contracts/{logicalContractId}/versions` (contract
        supersession/amendment), `PATCH /balance-movements/{movementId}`
        (edit-in-place — the underlying status-transition table has an
        `EDIT` action defined for exactly this, but no route ever invokes
        it), and `POST /balance-movements/{movementId}/reversal`. All four
        remain legitimate future work per the design docs, but describing
        them here as live was inaccurate; they will be re-added to this
        contract if/when actually built.
      - CORRECTED: `DELETE /balance-movements/{movementId}?reasonCode=`
        never existed — the real, implemented cancel operation is
        `POST /balance-movements/{movementId}/cancel` with a JSON body
        (`cancelledBy` required), not a query-param DELETE.
      - ADDED (real, previously undocumented): `GET /balance-contracts/catalog`
        (paginated/searchable contract listing — backs every picker UI),
        `GET /balance-movements/{movementId}/balance-as-of` (the balance
        snapshot as of a specific movement's own event, distinct from
        the calendar-date `asOf` query param on the contract balance
        endpoint).
      - CORRECTED: `ExposureNature` is missing a real, in-use value —
        `MEMO` (a Present Docs / EPLC_EXAMINATION earmark is `MEMO`, never
        `CONTINGENT`/`ACTUAL`; the server forces `accountEntries: null`
        whenever `exposureNature` is `MEMO`).
      - REMOVED: the §6.1 off-balance-sheet exposure "soft WARNING" tier
        and the `BalanceMovement.warnings`/`MovementWarning` schema —
        superseded by v0.7.0's hardening to a single ERROR tier; nothing
        in the current implementation ever populates a warning, so
        documenting the field as live was misleading.
      - ADDED, movement-creation business rules previously undocumented:
        (a) `409 NATURAL_KEY_ALREADY_EXISTS` — a creating movementType
        (ISSUE/CREATE) against a natural key that already resolves to an
        ACTIVE contract is rejected outright, never silently versioned;
        (b) `400` if an Acceptance (`IPLC_ACCEPTANCE`/`EPLC_ACCEPTANCE`)
        CREATE is attempted under a Sight-tenor parent LC, or if the
        child's own `tenorType` does not match the parent's; (c) SHGT
        `ISSUE` and `EPLC_EXAMINATION` CREATE both require
        `parentLogicalContractId` (`400` if missing) and are checked for
        sufficiency against the parent's own Tight Available /
        earmark-adjusted Available Balance, not an unconstrained figure;
        (d) `sourceTransactionRef` must be unique per contract — reusing
        one against the same `balanceContractId` is `400`.
      - ADDED to `BalanceMovementCreateRequest`: `parentLogicalContractId`,
        `tenorType`, `tenorDays`, `maturityDate`, `exposureNature`,
        `tolerancePct` — all real, already-accepted fields this file had
        never documented.
      - REMOVED `GET /balance-contracts/{balanceContractId}/movements`'s
        query filters (`status`/`legRef`/`businessEventId`/`businessDate`)
        — the real endpoint takes none; every filter currently happens
        client-side on the full result set.


    v1.1.0 (2026-08-16, business-requested — "implement the related
    contingent liability account entries across A1-A9/B1-B5... persist the
    generated Dr/Cr account entries as part of that event/movement"): ADDED
    `BalanceMovement.contingentAccountEntry` (new `ContingentAccountEntry`
    schema) — a single, server-derived Dr/Cr contingent-liability account
    pair (`drAccount`/`crAccount`/`currency`/`amount`), computed once at
    movement creation from `(instrumentType, movementType, amount's own
    sign, the resolved contract's tenorType)` per
    analysis/contingent-liability-ledger.html, and persisted immutably with
    the movement — never recalculated from the current balance, including
    when the same movement is later fetched via the Event Timeline
    (`GET .../movements`). Null for the three ON_BALANCE_ASSET instruments
    (`EPLC_DUE_FROM_ISSUING_BANK`/`EPLC_ACCEPTANCE_REIMB_RECEIVABLE`/
    `EPLC_EXPORT_BILLS_DISCOUNTED`) and for any unrecognized movementType —
    on-balance-sheet liability stays out of scope for this field, same
    boundary as the rest of this contract. Deliberately a DIFFERENT concept
    from the pre-existing `accountEntries`/`AccountEntry` array (a
    caller-supplied, downstream-accounting-owned Dr/Cr leg list this
    service only stores/passes through, per §3.3 "GL Ownership") —
    `contingentAccountEntry` is server-derived, contingent-ledger-specific,
    and always exactly zero-or-one pair, never caller-supplied and never an
    array.


    v1.2.0 (2026-08-16, bug fixed, reviewer-reported — "A1 -> A8 -> A3S -> A4, the related SG entries
    was not shown"): ADDED `GET /balance-movements?businessEventId=`. Root cause: the reference Angular
    Transaction Builder client's own Checker Release for a linked-movement submission (A3S's SG
    redemption + LC UTILIZE, B5's Acceptance settle + Reimbursement Receivable REIMBURSE) used to
    resolve the linked leg's own movementId purely from the Maker's own in-memory client state —
    correct only when the SAME browser session that submitted also performs the release, never true
    for a genuinely separate Checker session (the whole point of Maker/Checker 4-eyes separation). This
    endpoint gives any caller a server-side way to resolve that correlation independently, via the
    businessEventId every linked-movement submission already shared but was never queryable by. No
    change to `POST /balance-movements` itself — `businessEventId` was already an accepted request
    field (this document's own "ONE MOVEMENT, ONE LEG, ONE CALL" principle above already describes it
    as "correlation only, never a transaction boundary"); this only adds a way to query BY it afterward.


    v1.3.0 (2026-08-16, bug fixed, reviewer-directed — "A6/B4 也修一下" i.e. "fix A6/B4 too", extending
    v1.2.0's fix to the two named business functions it explicitly left out of scope): ADDED
    `BalanceMovementCreateRequest.referencedTransactionId` / `BalanceMovement.referencedTransactionId`.
    v1.2.0's `businessEventId` lookup only resolves movements CREATED TOGETHER in one submission — A6
    (Acceptance, Usance) and B4 (Honour/Acceptance) instead convert a PRE-EXISTING record (A3's own
    Document Arrival, or B3's own Present Docs) picked at submission time from an EARLIER, separate
    submission, which never shares a businessEventId with the new one at all. `referencedTransactionId`
    is the direct, unambiguous correlation businessEventId can't provide for this shape — the new
    movement simply carries the source record's own movementId. Same passthrough posture as
    businessEventId/sourceTransactionRef: accepted and persisted, never validated to resolve to a real
    movement. `A6`/`B4`'s downstream legs CREATED alongside the new primary (B4's own Acceptance
    liability + Reimbursement Receivable, or the Due from Issuing Bank asset) still resolve via v1.2.0's
    `businessEventId` lookup — only the "source record predates this submission" correlation needed a
    new mechanism.


    v1.4.0 (2026-08-16, business-directed — "Add real Maker Submit, then have Checker to Release it.
    Exactly the same as A1."): ADDED `POST /balance-movements/{movementId}/maker-submit` and
    `BalanceMovement.makerSubmittedBy`/`makerSubmittedAt`. A4 (Sight Settlement) has no movement of its
    own to create at Submit time — it settles the PRE-EXISTING UTILIZE A3/A3S already earmarked (and
    already gave its own contingentAccountEntry at that earlier stage) — so there was no
    `createMovement()` call to stand in as "the Maker submitted," leaving A4 as the only function where
    a Checker could act before any Maker had done anything at all. This endpoint is that missing,
    genuinely backend-persisted Maker action: same shape as v0.8.0's own `/acknowledge` (IPLC_LC/UTILIZE
    only here rather than EPLC_EXAMINATION/CREATE; 400 otherwise), and — same posture as `/acknowledge`
    — deliberately does NOT transition status; the movement stays PENDING throughout (`/release` is
    still the real PENDING -> RELEASED transition). Deliberately NOT enforced as a precondition inside
    `/release` itself — the reference Business Case Runner client releases a UTILIZE directly with no
    separate maker-submit call (an already-working, separately-tested orchestrated flow this feature was
    never meant to constrain); the reference Angular Transaction Builder client enforces the gate itself,
    client-side, before ever calling `/release` for an unsubmitted A4 item.


    v1.5.0 (2026-08-17, Quality-report-balance.md BAL-123, reviewer-found): the v1.4.0 gate above is now
    ALSO enforced server-side, inside `POST /balance-movements/{id}/release` itself — see that
    endpoint's own updated description for the exact scoping (Sight-tenor IPLC_LC/UTILIZE only, checked
    via the movement's own parent contract `tenorType`, never just instrumentType/movementType) and why
    it cannot affect a Usance LC's own UTILIZE (A6's own compound release, which never calls
    `/maker-submit`). Closes the gap the v1.4.0 changelog entry above explicitly named as a deliberate,
    disclosed trade-off ("the reference Angular Transaction Builder client enforces the gate itself,
    client-side") — any caller can now be relied upon to hit this same 409 if it skips
    `/maker-submit`, not just the one reference UI.
  version: "1.5.0"
servers:
  - url: https://api.bank.example/balance-component/v1
    description: Production-style contract root. This prototype's own dev proxy (lc-balance-wc/proxy.conf.json) strips the /balance-component prefix entirely and forwards bare paths to the service's actual :4100 listener — there is no live /v1 segment in dev today; this server URL documents the intended production shape.
tags:
  - name: BalanceContracts
    description: Logical contract resolution, catalog search, and balance/movement queries.
  - name: BalanceMovements
    description: Exposure-amount changes — Earmark (PENDING), Maker/Checker release lifecycle.
  - name: Balances
    description: Confirmed/Available balance and movement queries, including as-of historical queries.

paths:

  /balance-contracts:
    get:
      tags: [BalanceContracts]
      summary: Resolve a Logical Contract by natural key, returning its current ACTIVE version
      description: >
        Design doc §3.1/§3.3 "呼叫端的實際使用方式" — callers never manage
        logicalContractId/balanceContractId directly; they always resolve
        through the natural key (lcNumber, plus ibNumber/sgNumber
        depending on instrumentType — see the natural-key table in §3.1).
        Returns 404 if no Logical Contract exists yet for this natural key
        (the caller should then submit an ISSUE/CREATE movement instead).
      parameters:
        - name: instrumentType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/InstrumentType' }
        - name: lcNumber
          in: query
          required: true
          schema: { type: string }
        - name: ibNumber
          in: query
          schema: { type: string }
          description: Required when instrumentType is IPLC_ACCEPTANCE/EPLC_ACCEPTANCE/EPLC_EXAMINATION/EPLC_DUE_FROM_ISSUING_BANK/EPLC_ACCEPTANCE_REIMB_RECEIVABLE/EPLC_EXPORT_BILLS_DISCOUNTED.
        - name: sgNumber
          in: query
          schema: { type: string }
          description: Required when instrumentType is SHGT.
      responses:
        '200':
          description: Logical Contract found — its current ACTIVE version is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceContract' }
        '404':
          description: No Logical Contract exists yet for this natural key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /balance-contracts/catalog:
    get:
      tags: [BalanceContracts]
      summary: Paginated, searchable listing of contracts — backs every "pick an existing LC/Acceptance/SG/Confirmation" UI
      description: >
        v1.0.0 — real, previously-undocumented endpoint. Every picker in the
        channel-facing UI (flat Catalog / LC Index, Parent LC picker, IB/EB
        Index) is backed by this one listing endpoint, parameterized
        differently per picker. Results are ordered by natural-key
        reference ascending (business instruction: "pickup 時 Order by
        Reference").
      parameters:
        - name: instrumentType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/InstrumentType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ContractStatus' }
        - name: q
          in: query
          description: Free-text substring filter against lcNumber (and ibNumber/sgNumber where applicable).
          schema: { type: string }
        - name: lcNumber
          in: query
          description: Exact lcNumber filter — used by a Parent-picked-first cascading picker (Step 2's IB/EB Index) to scope to exactly one LC.
          schema: { type: string }
        - name: tenorFamily
          in: query
          description: Restricts to contracts whose own declared tenorType matches this family — SIGHT means tenorType=SIGHT exactly; USANCE means any Usance-family tenorType. Contracts with no recorded tenorType are never filtered out.
          schema: { type: string, enum: [SIGHT, USANCE] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: One page of matching contracts.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BalanceContract' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /balance-contracts/{balanceContractId}/balance:
    get:
      tags: [Balances]
      summary: Confirmed / Available balance for one contract version
      description: >
        Design doc §3.3 "查詢用的兩個衍生數字" — Confirmed Balance = sum of
        RELEASED movements; Available Balance = Confirmed Balance minus/plus
        the net of currently-PENDING earmarks. Design doc §11 (query API
        requirements, item c) — the `asOf` parameter answers "what was the
        balance as of a given COB business date", filtering on
        BalanceMovement.businessDate rather than the system createdAt
        timestamp. For "what was the balance immediately after one specific
        movement's own event" instead of a calendar date, use
        `GET /balance-movements/{movementId}/balance-as-of`.
      parameters:
        - name: balanceContractId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: asOf
          in: query
          description: Business date (COB) to compute the historical balance as of. Omit for the live balance.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Balance snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceSnapshot' }
        '404':
          description: Contract version not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /balance-contracts/{balanceContractId}/movements:
    get:
      tags: [Balances]
      summary: List every movement against one contract version (Event Timeline)
      description: >
        Design doc §11 (query API requirements, item a/d) — required so
        that REJECTED/PENDING records can be manually investigated instead
        of relying on an automatic timeout (business decision, §11 —
        REJECTED timeout was explicitly rejected in favor of always-
        available query capability). Returns the full movement history for
        this contract version, newest first; there are no server-side
        filters — a caller wanting a subset (by status, by businessEventId,
        etc.) filters the returned array itself.
      parameters:
        - name: balanceContractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Every movement against this contract version, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BalanceMovement' }

  /balance-movements:
    post:
      tags: [BalanceMovements]
      summary: Create a movement (Earmark) — PENDING, pending Checker Release
      description: >
        Design doc §6 — single atomic operation, lock scoped to the
        resolved balanceContractId only (different contracts never block
        each other): compute Available Balance, reject immediately with 409
        if insufficient for a balance-decreasing movementType (no PENDING
        record created), otherwise create the PENDING record and earmark
        the amount out of Available Balance. ISSUE/CREATE-type movements
        against a natural key that does not yet resolve to a Logical
        Contract implicitly create the Logical Contract (version 1, ACTIVE)
        as part of this same call — but see the `NATURAL_KEY_ALREADY_EXISTS`
        rule below: this only happens when no ACTIVE contract already
        exists for that natural key.


        See CURRENCY DERIVATION in this document's top-level description
        for the full rule — in short, `currency` is required only for a
        genuinely root new Logical Contract (no existing resolution, no
        `parentLogicalContractId`); every other case derives it server-side
        and rejects a mismatching caller-supplied value with
        `409 CURRENCY_MISMATCH`.


        Idempotent on (balanceContractId, eventSeq) — Design doc §8:
        resubmitting the same pair returns the existing record (200)
        instead of erroring or double-counting; `eventSeq` is caller-
        supplied specifically to make retries safe.


        `409 NATURAL_KEY_ALREADY_EXISTS` — a creating movementType
        (ISSUE/CREATE) whose natural key already resolves to an ACTIVE
        contract is rejected outright; the caller should submit a
        non-creating movementType against the existing contract instead
        (or, for a genuine contractual term change, that is out of scope
        for this endpoint entirely — see the v1.0.0 changelog note on the
        removed contract-versioning endpoint).


        `400` — creating an `IPLC_ACCEPTANCE`/`EPLC_ACCEPTANCE` under a
        Sight-tenor parent LC, or where the child's own `tenorType` does
        not match the parent's own declared tenor, is rejected as a
        request validation failure, not a balance-sufficiency one.


        `parentLogicalContractId` is REQUIRED (400 if missing) for SHGT
        `ISSUE` and `EPLC_EXAMINATION` `CREATE` — both are checked for
        sufficiency against the PARENT's own Tight Available Balance /
        earmark-adjusted Available Balance (Design doc §6.1/§6.8), not an
        unconstrained figure. For a UTILIZE movement against IPLC_LC/
        EPLC_LC specifically, the same §6.1 off-balance-sheet check is a
        hard `409 InsufficientBalanceError` if the amount exceeds Available
        Balance minus the LC's own outstanding SHGT exposure (v0.7.0 —
        superseded the earlier non-blocking warning tier entirely).


        `400 sourceTransactionRef already used` — this natural-language
        reference must be unique per `balanceContractId`; resubmitting the
        same one against the same contract (with a genuinely new
        eventSeq — a same-eventSeq resubmission is the idempotent-replay
        case above, not this one) is rejected.


        For IPLC_LC/EPLC_LC ISSUE/AMEND_INCREASE/AMEND_DECREASE, `amount`
        is the caller-typed face-level delta; the server derives
        `ceilingAmount = amount × (1+tolerancePct/100)` and — for
        AMEND_DECREASE specifically — checks *that* derived figure against
        Available Balance, not the raw `amount` (Design doc §6.2, v0.3.0).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceMovementCreateRequest' }
      responses:
        '201':
          description: New PENDING movement created (new eventSeq).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceMovement' }
        '200':
          description: Already exists — resubmission of the same (balanceContractId, eventSeq) returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceMovement' }
        '400':
          description: Request validation failed — includes malformed fields, the Acceptance/parent-tenor consistency check, a missing required parentLogicalContractId, and a reused sourceTransactionRef.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Available Balance insufficient for this movementType (INSUFFICIENT_AVAILABLE_BALANCE), the natural key already resolves to an ACTIVE contract for a creating movementType (NATURAL_KEY_ALREADY_EXISTS), or the caller-supplied currency does not match the derived one (CURRENCY_MISMATCH). No record is created in any case.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    get:
      tags: [BalanceMovements]
      summary: Every movement sharing a businessEventId, across contracts
      description: >
        v1.2.0 — bug fixed 2026-08-16, reviewer-reported ("A1 -> A8 -> A3S -> A4, the related SG
        entries was not shown"): lets a caller independently resolve the linked leg(s) of a compound
        submission (A3S's SG redemption + LC UTILIZE, B5's Acceptance settle + Reimbursement
        Receivable REIMBURSE) by their shared businessEventId, without needing to have been the same
        caller/session that originally submitted them — the whole point of Maker/Checker 4-eyes
        separation being genuinely two different actors. Cross-contract by design (the SG's own
        balanceContractId differs from the LC's) — businessEventId is the only correlation the two
        linked legs actually share server-side. Returns every movement carrying this businessEventId,
        oldest first (creation order), or an empty array if none do — never 404.
      parameters:
        - name: businessEventId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Every movement sharing this businessEventId, oldest first (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BalanceMovement' }
        '400':
          description: businessEventId query parameter is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /balance-movements/{movementId}/balance-as-of:
    get:
      tags: [Balances]
      summary: Balance snapshot as of one specific movement's own event
      description: >
        v1.0.0 — real, previously-undocumented endpoint. Distinct from the
        calendar-date `asOf` query parameter on
        `GET /balance-contracts/{balanceContractId}/balance`: this answers
        "what did the balance look like immediately after (or including)
        this specific movement's own event", independent of business date.
      parameters:
        - name: movementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Balance snapshot as of this movement's event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceSnapshot' }
        '404':
          description: Movement not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /balance-movements/{movementId}/release:
    post:
      tags: [BalanceMovements]
      summary: Checker releases a PENDING movement (4-eyes)
      description: >
        Design doc §4/§9. On success: PENDING → RELEASED, the earmark
        becomes a permanent Confirmed Balance change, and accountEntries
        (if present on the movement) become available for a downstream
        accounting component to consume (§2/§3.3 — this service never
        posts GL itself). One call releases exactly one movement — a
        business function whose approved design requires releasing several
        linked movements together (e.g. "one Release click does BOTH...")
        is the caller's own responsibility to sequence as that many
        separate calls to this endpoint, sharing the linked movements'
        common `businessEventId` for audit/query correlation only (see the
        companion Web/Mobile Channel API for how a named business function
        maps onto this).


        v1.5.0 (2026-08-17, Quality-report-balance.md BAL-123, reviewer-found):
        for a Sight-tenor IPLC_LC's own UTILIZE movement specifically (A4 —
        Sight Settlement — the only function that plain-releases this
        combination), this call now requires
        `makerSubmittedAt` to already be set — i.e.
        `POST /balance-movements/{id}/maker-submit` must be called first —
        returning 409 otherwise. This closes a real 4-eyes integrity gap:
        the Maker/Checker separation for A4 used to be enforced only by the
        reference Transaction Builder client, never here, so any other
        caller could release an A4-type UTILIZE that was never
        Maker-submitted. Scoped narrowly by the movement's own parent
        contract `tenorType === 'SIGHT'`, not just
        instrumentType/movementType, so a Usance LC's own UTILIZE (released
        through this exact same endpoint via A6's compound
        `referencedTransactionId` flow, which never calls `/maker-submit`
        by design) is completely unaffected — and a movement whose parent
        contract never declared an explicit `tenorType` at all (e.g. an
        older caller that predates `tenorType` being required) is likewise
        unaffected, so this is purely additive for genuine Sight LCs, never
        a behavior change for anything that isn't one.
      parameters:
        - name: movementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releasedBy]
              properties:
                releasedBy: { type: string }
      responses:
        '200':
          description: Movement released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceMovement' }
        '404':
          description: Movement not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            Movement is not PENDING — illegal state transition, rejected
            explicitly rather than silently accepted (Design doc §8). Also
            returned (v1.5.0) for a Sight-tenor IPLC_LC's own UTILIZE that
            has not yet been Maker-submitted via
            `POST /balance-movements/{id}/maker-submit` — see this
            endpoint's own description above.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /balance-movements/{movementId}/acknowledge:
    post:
      tags: [BalanceMovements]
      summary: Checker acknowledges a still-PENDING Present Docs earmark (EPLC_EXAMINATION only)
      description: >
        v0.8.0 — a Checker's own acknowledgment of a Present Docs
        (EPLC_EXAMINATION CREATE) earmark, distinct from /release:
        deliberately does NOT transition status — the movement stays
        PENDING throughout, so a later Honour/Accept step can still find
        and consume it. Moves the amount from
        BalanceSnapshot.presentDocsEarmarkPending to
        presentDocsEarmarkApproved on the parent Confirmation.


        400 if the movement's instrumentType is not EPLC_EXAMINATION or its
        movementType is not CREATE — this endpoint is specifically the
        Present Docs earmark acknowledgment, not a generic "acknowledge
        anything" action. 409 if the movement is not currently PENDING, or
        if it was already acknowledged (acknowledgedAt already set).
      parameters:
        - name: movementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledgedBy]
              properties:
                acknowledgedBy: { type: string }
      responses:
        '200':
          description: Movement acknowledged; status unchanged (still PENDING).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceMovement' }
        '400':
          description: Not an EPLC_EXAMINATION CREATE movement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Movement not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Movement is not PENDING, or was already acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /balance-movements/{movementId}/maker-submit:
    post:
      tags: [BalanceMovements]
      summary: A4 (Sight Settlement)'s own real Maker Submit on a pre-existing IPLC_LC UTILIZE
      description: >
        v1.4.0 — A4 has no movement of its own to create at Submit time; it
        settles the PRE-EXISTING UTILIZE A3/A3S already earmarked. This is
        the genuine, backend-persisted Maker action standing in for the
        createMovement()-as-Submit step every other function has, gating
        the Checker's own /release the same way. Deliberately does NOT
        transition status — the movement stays PENDING throughout (same
        posture as /acknowledge above, on the Maker side instead of the
        Checker side).


        400 if the movement's instrumentType is not IPLC_LC or its
        movementType is not UTILIZE. 409 if the movement is not currently
        PENDING, or if it was already submitted (makerSubmittedAt already
        set).
      parameters:
        - name: movementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [makerSubmittedBy]
              properties:
                makerSubmittedBy: { type: string }
      responses:
        '200':
          description: Movement submitted by Maker; status unchanged (still PENDING).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceMovement' }
        '400':
          description: Not an IPLC_LC UTILIZE movement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Movement not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Movement is not PENDING, or was already submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /balance-movements/{movementId}/reject:
    post:
      tags: [BalanceMovements]
      summary: Checker rejects a PENDING movement (4-eyes)
      description: >
        Design doc §4 — the earmark is released immediately on reject, not
        deferred to whatever the Maker does next. reasonCode is required so
        the Maker's subsequent Cancel-or-resubmit decision has something to
        act on. One call rejects exactly one movement — same "caller
        sequences linked calls itself" principle as /release above.
      parameters:
        - name: movementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releasedBy, reasonCode]
              properties:
                releasedBy: { type: string, description: "The Checker performing the reject — field name kept as releasedBy for symmetry with /release's own body, not a copy/paste error." }
                reasonCode: { type: string }
                remarks: { type: string }
      responses:
        '200':
          description: Movement rejected; earmark released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceMovement' }
        '404':
          description: Movement not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Movement is not PENDING.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /balance-movements/{movementId}/cancel:
    post:
      tags: [BalanceMovements]
      summary: Maker cancels their own still-PENDING (or already-REJECTED) movement
      description: >
        Design doc §4/§6 "Maker Delete Pending" (business instruction
        2026-08-15, "ensure the DB design is working properly for all
        functions") — releases the earmark (a no-op if the movement is
        already REJECTED, since Reject already released it) and transitions
        to CANCELLED. Never a physical delete — CANCELLED rows are retained
        for audit. v1.0.0 correction: this is a `POST .../cancel` with a
        JSON body, not the `DELETE .../{movementId}?reasonCode=` shape an
        earlier draft of this file described — that shape was never
        implemented.
      parameters:
        - name: movementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceMovementCancelRequest' }
      responses:
        '200':
          description: Movement cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceMovement' }
        '404':
          description: Movement not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Movement is not in a cancellable state (already RELEASED/CANCELLED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:

    InstrumentType:
      type: string
      description: >
        Design doc §1/§3.1. IBL/EBL are deliberately absent — out of scope,
        Loan Component's domain (Cross-Reference Finding 3b).


        `EPLC_EXAMINATION` is Present Docs' own MEMO_ONLY earmark — CREATE
        only, never moves EPLC_CONFIRMATION's own balance. `EPLC_DUE_FROM_
        ISSUING_BANK`/`EPLC_ACCEPTANCE_REIMB_RECEIVABLE`/`EPLC_EXPORT_BILLS_
        DISCOUNTED` are the ON_BALANCE_ASSET instruments a Confirmation's own
        HONOUR/ACCEPT transforms into (Sight/Usance/Nego'd respectively) —
        `EPLC_DUE_FROM_ISSUING_BANK` is created but deliberately has no
        settling endpoint in this contract; `EPLC_ACCEPTANCE_REIMB_RECEIVABLE`
        settles paired with `EPLC_ACCEPTANCE`'s own FULL_SETTLE/PARTIAL_SETTLE;
        `EPLC_EXPORT_BILLS_DISCOUNTED` is a reclass target only, no consuming
        endpoint yet.
      enum: [IPLC_LC, EPLC_LC, IPLC_ACCEPTANCE, EPLC_ACCEPTANCE, SHGT, EPLC_CONFIRMATION, EPLC_EXAMINATION, EPLC_DUE_FROM_ISSUING_BANK, EPLC_ACCEPTANCE_REIMB_RECEIVABLE, EPLC_EXPORT_BILLS_DISCOUNTED]

    ContractStatus:
      type: string
      description: >
        Design doc §3.1 — a completely separate state machine from
        MovementStatus. A Contract being SUPERSEDED does not retroactively
        change the status of movements recorded against it while it was
        ACTIVE. SUPERSEDED/CLOSED are carried in the schema for the state
        machine's own completeness and future contract-versioning work
        (see the v1.0.0 changelog note on the removed versioning endpoint);
        no current endpoint transitions a contract into either.
      enum: [ACTIVE, SUPERSEDED, CLOSED, CANCELLED]

    MovementStatus:
      type: string
      description: Design doc §4 — Maker/Checker lifecycle. Every transition into these is a deliberate design decision. SUPERSEDED is carried in the schema for the status-transition table's own completeness (an EDIT action legally targets it) but is not reachable through any endpoint in this v1.0.0 contract — see the changelog note on the removed PATCH edit endpoint.
      enum: [PENDING, RELEASED, REJECTED, CANCELLED, SUPERSEDED]

    ExposureNature:
      type: string
      description: >
        Design doc §1 — CONTINGENT (undrawn LC/Shipping Guarantee) vs.
        ACTUAL (Acceptance, Export Confirmation liability once it exists).
        v1.0.0 correction: `MEMO` was missing from earlier drafts of this
        file despite being real and in use — a Present Docs
        (EPLC_EXAMINATION CREATE) earmark is always `MEMO`, per
        cs-tf-balance-knowhow Design Principle D3 ("documents arriving is a
        physical event... only legal events move balances"); the server
        forces `BalanceMovement.accountEntries` to null whenever
        `exposureNature` is `MEMO`, since a memo earmark never posts GL.
        Never ACTUAL-funded/discounted exposure — that's Loan Component's
        ACTUAL, a different concept, out of this service's scope.
      enum: [CONTINGENT, ACTUAL, MEMO]

    TenorType:
      type: string
      description: Design doc §7 — corresponds to legacy CPYT_C_SDA_FLAG. Only meaningful on leg-level and Acceptance contracts.
      enum: [SIGHT, BUYERS_USANCE, SELLERS_USANCE, DP, DA]

    MonetaryAmount:
      type: string
      pattern: '^-?\d{1,18}(\.\d{1,3})?$'
      description: >
        Decimal-string only, never a binary float/JSON number; server-side
        arithmetic MUST use decimal/BigDecimal. Scale (max fractional
        digits actually accepted) is currency-driven — the server validates
        `amount` against the resolved/derived currency's own configured
        decimal-place count (e.g. JPY allows none, most currencies allow
        two, BHD/KWD/OMR allow three) and rejects a request whose amount
        has more fractional digits than that currency allows with `400`.
      example: "300000.00"

    NaturalKey:
      type: object
      description: Design doc §3.1 natural-key table. Which fields are required depends on instrumentType — see the per-endpoint parameter descriptions.
      required: [lcNumber]
      properties:
        lcNumber: { type: string, description: "C_MAIN_REF of the underlying LC." }
        ibNumber: { type: string, description: "Required for IPLC_ACCEPTANCE/EPLC_ACCEPTANCE/EPLC_EXAMINATION/EPLC_DUE_FROM_ISSUING_BANK/EPLC_ACCEPTANCE_REIMB_RECEIVABLE/EPLC_EXPORT_BILLS_DISCOUNTED — the presentation/bill reference." }
        sgNumber: { type: string, description: "Required for SHGT." }

    AccountEntry:
      type: object
      description: >
        Design doc §3.3 "GL Ownership" — one leg of a Dr/Cr pair. Balance
        Component stores and passes these through on RELEASE; it never
        interprets accountRef or decides drCr itself (config-driven,
        downstream-owned). Always null on a `MEMO`-exposureNature movement
        (server-enforced) — a memo earmark never posts GL.
      required: [accountRef, drCr, amount]
      properties:
        accountRef: { type: string }
        drCr: { type: string, enum: [D, C] }
        amount: { $ref: '#/components/schemas/MonetaryAmount' }

    ContingentAccountEntry:
      type: object
      description: >
        v1.1.0 — analysis/contingent-liability-ledger.html's Dr/Cr
        contingent-liability account pair, derived server-side once at
        movement creation (domain/contingentAccountEntry.ts) and persisted
        immutably on the movement. Exactly one Dr/Cr pair per movement
        (never a caller-supplied array like `AccountEntry`/`accountEntries`
        above) — `drAccount`/`crAccount` already carry any applicable tenor
        suffix (e.g. "Documentary Credits Outstanding — Sight") baked in,
        so no separate tenor field is needed on this schema.
      required: [drAccount, crAccount, currency, amount]
      properties:
        drAccount: { type: string }
        crAccount: { type: string }
        currency: { type: string }
        amount: { $ref: '#/components/schemas/MonetaryAmount' }

    BalanceContract:
      type: object
      description: Design doc §3.1 — one immutable version snapshot of a Logical Contract.
      properties:
        balanceContractId: { type: string, format: uuid }
        logicalContractId: { type: string, format: uuid }
        contractVersion: { type: integer }
        instrumentType: { $ref: '#/components/schemas/InstrumentType' }
        naturalKey: { $ref: '#/components/schemas/NaturalKey' }
        parentLogicalContractId:
          type: string
          format: uuid
          nullable: true
          description: SHGT/Acceptance/Examination's underlying LC-or-Confirmation's logicalContractId. Set at creation via BalanceMovementCreateRequest.parentLogicalContractId — required for SHGT ISSUE and EPLC_EXAMINATION CREATE, and used both for the parent-sufficiency check at creation time AND as the CURRENCY DERIVATION source (see this document's top-level description).
        status: { $ref: '#/components/schemas/ContractStatus' }
        currency:
          type: string
          description: This contract version's own authoritative Currency Code — set once, either caller-supplied (root ISSUE/CREATE with no parent) or derived from the parent at creation time (see CURRENCY DERIVATION). Every subsequent movement against this contract, and every child contract created under it, derives its own currency from this field; it is never re-typed.
        tolerancePct:
          type: string
          nullable: true
          description: >
            Design doc §6.2 (v0.3.0) — positive tolerance percentage (e.g.
            UCP600 "about"/"approximately" terms), IPLC_LC/EPLC_LC only.
            Used to derive BalanceMovement.ceilingAmount from a caller-typed
            face-level amount. Treated as fixed within a contract version;
            not expected to change via ordinary movements.
        tenorType: { allOf: [{ $ref: '#/components/schemas/TenorType' }], nullable: true }
        tenorDays: { type: integer, nullable: true }
        maturityDate: { type: string, format: date, nullable: true }
        openingBalance: { $ref: '#/components/schemas/MonetaryAmount' }
        sourceAmendmentNo: { type: integer, nullable: true }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    BalanceMovement:
      type: object
      description: Design doc §3.2/§3.3 — append-only, never physically deleted.
      properties:
        movementId: { type: string, format: uuid }
        balanceContractId: { type: string, format: uuid }
        eventSeq: { type: integer }
        businessEventId: { type: string, format: uuid, nullable: true }
        movementType: { type: string, description: "Legal values depend on instrumentType (Design doc §5) — this service does not itself enforce a per-instrumentType allowlist server-side; that legality mapping is owned by the caller (see the companion Web/Mobile Channel API, which derives instrumentType+movementType from a named business function rather than accepting either as free caller input). The server does group every accepted movementType into one of a small number of behavioral buckets for its own balance-direction/sufficiency math — see Design doc §5's direction table." }
        exposureNature: { $ref: '#/components/schemas/ExposureNature' }
        amount:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          description: >
            For IPLC_LC/EPLC_LC ISSUE/AMEND_INCREASE/AMEND_DECREASE, this is
            the caller-typed face-level delta — see ceilingAmount (Design
            doc §6.2, v0.3.0) for the tolerance-adjusted figure actually
            applied against Confirmed Balance. For every other
            movementType/instrumentType, amount and ceilingAmount are
            identical.
        ceilingAmount:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          nullable: true
          description: >
            Design doc §6.2 (v0.3.0) — amount × (1 + tolerancePct/100) for
            IPLC_LC/EPLC_LC ISSUE/AMEND_INCREASE/AMEND_DECREASE; equal to
            amount for every other case. AMEND_DECREASE sufficiency
            (compared against Available Balance) always uses this field,
            never the raw amount.
        currency:
          type: string
          description: Always equal to the resolved/derived contract's own currency at the time this movement was created — see CURRENCY DERIVATION.
        legRef: { type: string, nullable: true, description: "Mixed Tenor LC leg's logicalContractId — Design doc §7.1. Reserved for future leg-level LC support; not currently populated by any implemented flow." }
        accountEntries:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/AccountEntry' }
        contingentAccountEntry:
          allOf: [{ $ref: '#/components/schemas/ContingentAccountEntry' }]
          nullable: true
          description: >
            v1.1.0 — see this document's top-level v1.1.0 changelog entry.
            Server-derived at creation, persisted immutably; null for the
            three ON_BALANCE_ASSET instruments and for any unrecognized
            movementType.
        lmtsReservationId:
          type: string
          nullable: true
          description: >
            SHGT only (Design doc §5/§10) — opaque reference to the LMTS-side
            reservation, required for the Reserve/Confirm/Release
            compensation pattern across the Balance Component / LMTS system
            boundary. The actual LMTS call mechanism is not yet traced
            against source — this field is a placeholder passthrough.
        status: { $ref: '#/components/schemas/MovementStatus' }
        supersededMovementId: { type: string, format: uuid, nullable: true, description: Reserved for the not-yet-implemented edit-in-place flow — see the v1.0.0 changelog note. Never populated by any endpoint in this contract today. }
        reversalOfMovementId: { type: string, format: uuid, nullable: true, description: Reserved for the not-yet-implemented reversal flow — see the v1.0.0 changelog note. Never populated by any endpoint in this contract today. }
        reasonCode: { type: string, nullable: true }
        remarks: { type: string, nullable: true }
        transactionDate: { type: string, format: date, nullable: true }
        businessDate: { type: string, format: date, nullable: true }
        valueDate: { type: string, format: date, nullable: true }
        sourceModule: { type: string, nullable: true }
        sourceFunction: { type: string, nullable: true }
        sourceTransactionRef: { type: string, nullable: true, description: "Unique per balanceContractId (server-enforced, 400 on reuse against the same contract with a new eventSeq)." }
        referencedTransactionId:
          type: string
          format: uuid
          nullable: true
          description: >
            v1.3.0 — the movementId of a pre-existing record (created by an earlier, separate
            submission) this movement converts/finalizes — A6/B4's own "still-PENDING source Document
            Arrival/Present Docs" picked at submission time. Distinct from businessEventId (which only
            ever links movements created TOGETHER in the same submission): the source record here
            predates this one and never shares a businessEventId with it, so this field is the only
            server-side correlation between them. Passthrough only, same posture as
            sourceTransactionRef/businessEventId — never validated to resolve to a real movement.
        balanceBefore: { allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }], nullable: true }
        balanceAfter: { allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }], nullable: true }
        createdBy: { type: string }
        releasedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time, nullable: true }
        acknowledgedBy:
          type: string
          nullable: true
          description: >
            v0.8.0, EPLC_EXAMINATION only — set by
            POST /balance-movements/{id}/acknowledge, a Checker's
            acknowledgment of a still-PENDING Present Docs earmark. Distinct
            from releasedBy/releasedAt: acknowledging never transitions
            status — the movement stays PENDING so a later Honour/Accept
            step can still find and consume it.
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        makerSubmittedBy:
          type: string
          nullable: true
          description: >
            v1.4.0, IPLC_LC/UTILIZE only — set by
            POST /balance-movements/{id}/maker-submit, A4 (Sight
            Settlement)'s own real Maker action on the PRE-EXISTING UTILIZE
            A3/A3S already earmarked (A4 creates no movement of its own).
            Distinct from createdBy (the ORIGINAL A3/A3S submission) and
            from releasedBy/releasedAt: submitting never transitions status
            — the movement stays PENDING until the Checker's own /release.
        makerSubmittedAt: { type: string, format: date-time, nullable: true }

    BalanceMovementCreateRequest:
      type: object
      description: >
        Body for POST /balance-movements. Either `naturalKey` (resolves or,
        for a creating movementType, creates the Logical Contract) or an
        explicit `balanceContractId` must be supplied — not both. See
        CURRENCY DERIVATION (this document's top-level description) for
        exactly when `currency` is required vs. derived/validated
        server-side.
      required: [instrumentType, movementType, eventSeq, amount, createdBy]
      properties:
        instrumentType: { $ref: '#/components/schemas/InstrumentType' }
        naturalKey: { $ref: '#/components/schemas/NaturalKey' }
        balanceContractId: { type: string, format: uuid, nullable: true }
        parentLogicalContractId:
          type: string
          format: uuid
          nullable: true
          description: >
            Required for SHGT ISSUE and EPLC_EXAMINATION CREATE (400 if
            missing) — the parent LC/Confirmation this new child contract
            hangs off of. Used both for the parent-sufficiency check at
            creation time and, per CURRENCY DERIVATION, as the source of
            this new child contract's own currency.
        movementType: { type: string }
        eventSeq:
          type: integer
          description: Caller-supplied, scoped to the resolved balanceContractId. Design doc §8 — the idempotency key is (balanceContractId, eventSeq); resubmitting the same pair is safe.
        amount: { $ref: '#/components/schemas/MonetaryAmount' }
        currency:
          type: string
          nullable: true
          description: >
            REQUIRED only when creating a genuinely root new Logical
            Contract (a creating movementType with no existing resolution
            and no parentLogicalContractId — e.g. IPLC_LC/EPLC_CONFIRMATION
            ISSUE). Omit it in every other case — the server derives it
            from the resolved existing contract or from the parent, and
            rejects a caller-supplied value that conflicts with the
            derived one (409 CURRENCY_MISMATCH). See CURRENCY DERIVATION
            above for the full rule.
        exposureNature:
          allOf: [{ $ref: '#/components/schemas/ExposureNature' }]
          nullable: true
          description: Defaults per instrumentType/movementType when omitted (CONTINGENT for LC/SHGT earmarks, ACTUAL for Acceptance/Confirmation liabilities, MEMO for EPLC_EXAMINATION) — only needs to be supplied explicitly to override that default.
        tolerancePct:
          type: string
          nullable: true
          description: IPLC_LC/EPLC_LC ISSUE only (Design doc §6.2) — becomes the new contract's own BalanceContract.tolerancePct.
        tenorType: { allOf: [{ $ref: '#/components/schemas/TenorType' }], nullable: true, description: IPLC_LC/EPLC_CONFIRMATION ISSUE, or IPLC_ACCEPTANCE/EPLC_ACCEPTANCE CREATE (checked for consistency against the parent's own tenorType — 400 on mismatch, and 400 if the parent is Sight). }
        tenorDays: { type: integer, nullable: true }
        maturityDate: { type: string, format: date, nullable: true }
        legRef: { type: string, nullable: true }
        accountEntries:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/AccountEntry' }
        businessEventId: { type: string, format: uuid, nullable: true, description: Correlates this movement with any sibling leg movements from the same named business function (see the companion Web/Mobile Channel API) — not a transaction boundary. }
        transactionDate: { type: string, format: date, nullable: true }
        businessDate: { type: string, format: date, nullable: true }
        valueDate: { type: string, format: date, nullable: true }
        sourceModule: { type: string, nullable: true }
        sourceFunction: { type: string, nullable: true }
        sourceTransactionRef: { type: string, nullable: true, description: Must be unique per resolved balanceContractId (400 on reuse). }
        referencedTransactionId: { type: string, format: uuid, nullable: true, description: "v1.3.0 — A6/B4 only: the movementId of the pre-existing source Document Arrival/Present Docs record this movement converts/finalizes. See BalanceMovement.referencedTransactionId's own description for the full rule." }
        createdBy: { type: string }

    BalanceMovementCancelRequest:
      type: object
      description: Body for POST /balance-movements/{movementId}/cancel (v1.0.0 — real shape, corrects an earlier draft's DELETE+query-param description).
      required: [cancelledBy]
      properties:
        cancelledBy: { type: string }
        reasonCode: { type: string, nullable: true }
        remarks: { type: string, nullable: true }

    BalanceSnapshot:
      type: object
      description: >
        Design doc §3.3 — the derived balance numbers, never stored
        directly. offBalanceExposure/tightAvailableBalance (Design doc
        §6.1) apply only to IPLC_LC/EPLC_LC contracts that may have an
        SHGT issued against them — both are null for any other
        instrumentType. presentDocsEarmarkPending/presentDocsEarmarkApproved
        (v0.8.0, EPLC_CONFIRMATION only) are null for any other
        instrumentType.
      properties:
        balanceContractId: { type: string, format: uuid }
        logicalContractId: { type: string, format: uuid }
        currency: { type: string }
        confirmedBalance: { $ref: '#/components/schemas/MonetaryAmount' }
        availableBalance: { $ref: '#/components/schemas/MonetaryAmount' }
        pendingEarmarkTotal: { $ref: '#/components/schemas/MonetaryAmount' }
        offBalanceExposure:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          nullable: true
          description: Design doc §6.1 — sum of PENDING+RELEASED SHGT ISSUE net of PARTIAL_REDEEM/FULL_REDEEM, for SHGT contracts whose parentLogicalContractId matches this LC. Null for instrumentTypes other than IPLC_LC/EPLC_LC.
        tightAvailableBalance:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          nullable: true
          description: availableBalance minus offBalanceExposure — the threshold a UTILIZE amount (and, at creation time, an SHGT ISSUE against this LC as parent) is checked against. v1.0.0 — this check is now a hard 409 on both sides, not a soft warning (see the removed MovementWarning schema note below). Null where offBalanceExposure is null.
        presentDocsEarmarkPending:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          nullable: true
          description: >
            v0.8.0, EPLC_CONFIRMATION only — sum of still-PENDING,
            not-yet-Checker-acknowledged EPLC_EXAMINATION CREATE amounts
            under this Confirmation. Null for every other instrumentType.
        presentDocsEarmarkApproved:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          nullable: true
          description: >
            v0.8.0, EPLC_CONFIRMATION only — sum of Checker-acknowledged
            (acknowledgedAt set) but not-yet-consumed EPLC_EXAMINATION
            CREATE amounts under this Confirmation. A Present Docs
            submission's own sufficiency check nets Pending and Approved
            together against availableBalance. Null for every other
            instrumentType.
        asOf: { type: string, format: date, nullable: true, description: Echoes the request's asOf parameter (GET .../balance only); null means this is the live balance or a balance-as-of-movement query. }

    Error:
      type: object
      required: [code, message]
      description: >
        `code` is one of: `REQUEST_VALIDATION_FAILED` (400),
        `INSUFFICIENT_AVAILABLE_BALANCE` (409),
        `NATURAL_KEY_ALREADY_EXISTS` (409, v1.0.0),
        `CURRENCY_MISMATCH` (409, v1.0.0 — new, see CURRENCY DERIVATION),
        `ILLEGAL_STATE_TRANSITION` (409),
        `NOT_FOUND` (404),
        `INTERNAL_ERROR` (500 — the response body always carries a fixed,
        generic message; the real error detail is logged server-side only,
        never echoed to the client).
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
