<section class="balance-element" [attr.aria-busy]="loading">
  <nav class="balance-element__navigation" aria-label="Balance Component views">
    <button
      type="button"
      [class.active]="isActive('transaction-builder')"
      [attr.aria-current]="isActive('transaction-builder') ? 'page' : null"
      (click)="navigateTo('transaction-builder')"
    >
      Transaction Builder
    </button>
    <button
      type="button"
      [class.active]="isActive('business-cases')"
      [attr.aria-current]="isActive('business-cases') ? 'page' : null"
      (click)="navigateTo('business-cases')"
    >
      Business Case Runner
    </button>
  </nav>

  @if (loading) {
    <p class="balance-element__status" aria-live="polite">Loading Balance Component…</p>
  } @else if (activeComponent) {
    <ng-container *ngComponentOutlet="activeComponent" />
  }
</section>
