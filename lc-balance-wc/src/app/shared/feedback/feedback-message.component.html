<section
  class="tb-feedback"
  [class.tb-feedback--info]="message.severity === 'INFO'"
  [class.tb-feedback--success]="message.severity === 'SUCCESS'"
  [class.tb-feedback--warning]="message.severity === 'WARNING'"
  [class.tb-feedback--error]="message.severity === 'ERROR'"
  [attr.role]="ariaRole"
  [attr.aria-live]="ariaLive"
  tabindex="-1"
>
  <span class="tb-feedback__marker" aria-hidden="true"></span>
  <div class="tb-feedback__content">
    <h3 class="tb-feedback__title">{{ message.title }}</h3>
    <p class="tb-feedback__message">{{ message.message }}</p>
    <p class="tb-feedback__next" *ngIf="message.nextAction">{{ message.nextAction }}</p>
    <div class="tb-feedback__actions" *ngIf="message.retryable || message.supportCode">
      <button type="button" class="tb-feedback__retry" *ngIf="message.retryable" (click)="retry.emit()">Try again</button>
      <span class="tb-feedback__support" *ngIf="message.supportCode">Support code: {{ message.supportCode }}</span>
    </div>
  </div>
</section>
