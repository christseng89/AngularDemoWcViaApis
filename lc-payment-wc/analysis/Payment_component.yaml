openapi: 3.0.3
info:
  title: Payment Component Service API
  description: >
    Cross-module payment settlement microservice extracted from the Trade
    Finance baseline system's shared PaymentDebit/PaymentCredit Data
    Objects. Consumed by IPLC, EPLC, IMCO, EXCO, GTEE, IWGT (and, after
    remediation, RPFM/PYMT/REIM/CFNC/SBLC) via a single atomic
    POST /payment-instructions call that classifies, posts, and confirms
    the debit/credit legs of a trade finance transaction in one request —
    mirroring how every verified ConfirmBusinessCall equivalent invokes
    this logic today: once, with the full leg set already assembled, not
    as a sequence of incremental resource-building calls. Also triggers
    downstream Account Entry (GL) and SWIFT/ISO 20022 message generation,
    returned embedded in the same response.


    This is the FULLER draft this service's OpenAPI spec was originally
    authored as — broader in scope than analysis/payment-instructions-post.yaml
    (which narrowly extracts just POST /payment-instructions for standalone
    Swagger Editor verification): it additionally documents the read-only
    GET endpoints (all four are implemented in
    microservices/payment-component/src/routes/paymentInstructions.ts) and
    a /payment-routing endpoint that is NOT implemented anywhere in current
    src/ — see that path's own description below. Component schemas below
    are kept in lockstep with payment-instructions-post.yaml's; that file
    is the one to treat as authoritative for anything both files define,
    since it is regenerated whenever the service's request/response shapes
    change and this broader draft is not.


    v1.1.0 changelog (Payment_Mapping_Functions.docx verification pass):
    added RTGS to AccountType (RPFM), split the single exchangeRate
    property into 4 distinct rate fields matching the source DO schema,
    and added payInstrFlag to the header schemas.


    v1.2.0 changelog (review-comment pass): amounts/rates converted to
    decimal-string value objects (MonetaryAmount / ExchangeRate) to
    remove binary-float precision risk; sequence made a required
    idempotency-key field; corrected the AccountType.RTGS description
    (confirmed via source re-check to be a genuine settlement-account
    classification used on BOTH debit and credit legs, not a
    credit-leg-only or message-routing-only marker as an earlier draft
    of this description stated); recorded AML/sanctions screening and
    authN/authZ as explicitly out-of-scope (FSD §8.2).


    v1.3.0 changelog (design decision, 2026-08-07): removed RTGS as a
    distinct AccountType value. It never behaved like a separate
    settlement category — no legacy code branches on RTGS differently
    from NOSTRO for Dr/Cr classification (there is no such logic in
    legacy source at all — §2.3 is a business rule recap, not a trace),
    and no legacy code routes an RTGS leg to a different outbound
    message type than NOSTRO (message type is selected purely from
    payAdviceMsgType/payCoverMsgType, never from accountType — and RPFM,
    the only RTGS user, never reaches message generation regardless).
    RTGS is now represented as accountType=NOSTRO plus the new
    PaymentLegInput.rtgsIndicator flag, so it participates in nostroXor
    like any other Nostro leg by construction while remaining
    distinguishable for voucher-description purposes (still selects
    TypeChar 'R', not NOSTRO's 'N' — see the AccountType description
    below). This is a service-level modeling decision, not a claim about
    the literal source field value.


    v1.4.0 changelog (Charge Component integration, 2026-08-08): added
    the optional suspenseBridge request field (SuspenseBridge /
    SuspenseEntry schemas below) — see
    payment-instructions-post.yaml's own v1.4.0 changelog entry for the
    full rationale; kept in lockstep here per this file's own scope note
    above.


    v1.5.0 changelog (architecture decision, 2026-08-08, NOT legacy-traced):
    added SuspenseEntry.sourceComponent/.balanceModule and the
    SUSPENSE_CONTEXT_CONFLICT (409) validation rule — see
    payment-instructions-post.yaml's own v1.5.0 changelog entry for the
    full rationale; kept in lockstep here per this file's own scope note
    above.


    v1.6.0 changelog (architecture decision, 2026-08-08, NOT legacy-traced):
    removed the §6.2 Charge Voucher and §6.3 Liability Voucher generation
    paths (chargeContext/liabilityContext) entirely, along with the v1.5.0
    SUSPENSE_CONTEXT_CONFLICT rule that guarded against them coexisting with
    a suspenseBridge entry — see payment-instructions-post.yaml's own
    v1.6.0 changelog entry for the full rationale; kept in lockstep here per
    this file's own scope note above.


    v1.7.0 changelog (feature request, 2026-08-08, NOT legacy-traced):
    suspenseBridge FX Exchange pairs now combine with the caller's own
    same-currency, same-side Payment Legs instead of always converting the
    full gross Suspense amount alone — see payment-instructions-post.yaml's
    own v1.7.0 changelog entry for the full rationale; kept in lockstep
    here per this file's own scope note above.


    v1.7.1 changelog (correctness fix, 2026-08-09): debitEntries/debitLegs
    genuinely NET (subtraction, opposite polarity from the always-credit
    Suspense bridge leg); creditEntries/creditLegs only ever COMBINE
    (addition, same polarity — cannot net to zero) — v1.7.0's initial
    implementation wrongly treated both sides the same way — see
    payment-instructions-post.yaml's own v1.7.1 changelog entry for the
    full rationale and worked example; kept in lockstep here per this
    file's own scope note above.


    v1.7.2 changelog (accounting-review best practice, 2026-08-09): the
    generated FX Exchange pair now reads as one adjacent Dr/Cr block —
    Normal Debit(s) -> FX Debit -> FX Credit -> Normal Credit(s) ->
    Suspense Credit — see payment-instructions-post.yaml's own v1.7.2
    changelog entry for the full rationale; kept in lockstep here per
    this file's own scope note above.


    v1.7.3 (client-only, this service and contract UNCHANGED — SUPERSEDED
    by v1.7.4, kept here for the record): briefly attempted to combine a
    foreign-currency Suspense bucket with any same-currency real Payment
    Leg before converting it for the Business Case Simulator's client-side
    seed formula — reverted; see v1.7.4 below.


    v1.7.4 changelog (correctness fix, 2026-08-09, client-only — this
    service and contract are UNCHANGED): reverts v1.7.3. The combined
    seed broke aggregate V8 (the check this service actually enforces) in
    exactly the scenario it targeted — a caller's own leg-amount trx-
    equivalent and this service's combined-magnitude trx-equivalent are
    independently rounded via different rate directions and do not
    exactly cancel. The seed formula stays gross-only, converting each
    Suspense entry alone, per entry (not bucket-summed) — see
    payment-instructions-post.yaml's own v1.7.4 changelog entry for the
    full counter-example; kept in lockstep here per this file's own scope
    note above.


    v1.7.5 changelog (correctness fix, 2026-08-09, client-only — this
    service and contract are UNCHANGED): the Simulator's seed formula
    now accumulates in Decimal end-to-end (one final rounding pass)
    instead of summing already-rounded values as plain IEEE-754
    doubles, which could drift a ULP off the exact decimal sum — see
    payment-instructions-post.yaml's own v1.7.5 changelog entry for the
    reproducible counter-example; kept in lockstep here per this file's
    own scope note above.


    v1.8.0 changelog (correctness fix + response-shape change, 2026-08-09,
    SERVER-side — domain/suspenseBridge.ts only, request contract
    unchanged): a foreign-currency Suspense bucket that also has a
    matching real Payment Leg now generates TWO independent, self-
    balancing FX Exchange pairs (one Suspense-suffixed, one plain) instead
    of one combined pair — closes the per-currency display gap v1.7.3/
    v1.7.4/v1.7.5 left as "real but unfixable at the seed level," from the
    server side instead — see payment-instructions-post.yaml's own v1.8.0
    changelog entry for the full derivation and worked example; kept in
    lockstep here per this file's own scope note above.
  version: "1.8.0"
servers:
  - url: https://api.bank.example/payment-component/v1
tags:
  - name: PaymentInstructions
  - name: AccountEntries
  - name: SwiftMessages
  - name: Routing

paths:
  /payment-instructions:
    post:
      tags: [PaymentInstructions]
      summary: Create and confirm a payment instruction in one atomic call
      description: >
        Single entry point replacing the header-create / per-leg-add /
        classify-preview / confirm sequence of an earlier draft design.
        Callers (IPLC/EPLC/IMCO/EXCO/GTEE/IWGT ConfirmBusinessCall
        equivalents) submit the complete header plus the fully assembled
        debitLegs[] and creditLegs[] arrays in one request. The service
        performs, synchronously, within this single request: (1) Dr/Cr
        balance validation, (2) Payment Component Identification Rule
        Rev. 2 classification (Dr_has(t)/Cr_has(t) across all legs),
        (3) voucher description code assembly per leg
        (SYF_*_CAL_PAYMENT_AC_DESC / SYM_IMCO_SetPaymentVchDesc
        equivalent), (4) Account Entry generation for the settlement,
        charge, and liability voucher streams (SYT_CHG_VOUCHER /
        SYT_LIAB_VOUCHER equivalent) — unconditional, independent of the
        classification result, and (5) SWIFT/ISO 20022 message record
        creation when a credit leg's payAdviceMsgType/payCoverMsgType
        resolves to a non-None value. All five results are returned
        embedded in the single response body — no follow-up call is
        required to retrieve them.


        Idempotent on the natural key (originModule, mainRef, sequence):
        a resubmission that matches an existing payment instruction
        returns the existing result (200) without re-triggering GL/SWIFT
        output; a new natural key creates a new instruction (201).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInstructionConfirmRequest'
      responses:
        '201':
          description: Created and confirmed (new natural key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstruction'
        '200':
          description: Already confirmed — existing result returned for a repeated (originModule, mainRef, sequence)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstruction'
        '400':
          description: Request validation failed (e.g. missing required leg fields)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Business validation failed (e.g. legs unbalanced, missing mandatory account type)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [PaymentInstructions]
      summary: Search confirmed payment instructions by origin module and reference
      description: >
        Read-only inquiry/audit lookup — not part of the confirm flow
        itself (§6.1). Implemented — routes/paymentInstructions.ts's
        GET /payment-instructions, backed by PaymentInstructionStore.search().
      parameters:
        - in: query
          name: originModule
          schema:
            $ref: '#/components/schemas/OriginModule'
        - in: query
          name: mainRef
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentInstruction' }

  /payment-instructions/{instructionId}:
    get:
      tags: [PaymentInstructions]
      summary: Retrieve a confirmed payment instruction (header + legs + classification + outputs)
      description: >
        Read-only inquiry/audit lookup — not part of the confirm flow
        itself (§6.1). Implemented — routes/paymentInstructions.ts's
        GET /payment-instructions/:instructionId.
      parameters:
        - $ref: '#/components/parameters/InstructionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInstruction' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payment-instructions/{instructionId}/account-entries:
    get:
      tags: [AccountEntries]
      summary: List Account Entry (GL voucher) lines produced for this instruction
      description: >
        Same entries already returned embedded in the POST /payment-instructions
        response's accountEntries[] — this endpoint exists for later
        reconciliation/reprint access, not as a step of the confirm flow.
        Implemented — routes/paymentInstructions.ts's
        GET /payment-instructions/:instructionId/account-entries.
      parameters: [ { $ref: '#/components/parameters/InstructionId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountEntry' }

  /payment-instructions/{instructionId}/swift-messages:
    get:
      tags: [SwiftMessages]
      summary: List SWIFT/ISO 20022 messages generated for this instruction, with current transmission status
      description: >
        Message records are created synchronously during POST
        /payment-instructions and returned embedded in swiftMessages[];
        this endpoint is for polling status after that point, since
        actual transmission to the SWIFT network is asynchronous
        (status transitions PENDING -> GENERATED -> TRANSMITTED/FAILED).
        Implemented — routes/paymentInstructions.ts's
        GET /payment-instructions/:instructionId/swift-messages. NOTE: the
        service never actually transitions a SwiftMessage's status past
        PENDING today (no transmission integration exists in src/) — the
        GENERATED/TRANSMITTED/FAILED values are reserved for that future
        integration, not currently reachable.
      parameters: [ { $ref: '#/components/parameters/InstructionId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SwiftMessage' }

  /payment-routing:
    get:
      tags: [Routing]
      summary: Correspondent-bank routing and country-block lookup
      description: >
        Equivalent of getPaymentRouting() / SYST_PaymentRouting.jsp.
        NOT IMPLEMENTED — draft/aspirational scope only. There is no
        routes/payment-routing.ts (or equivalent) anywhere in
        microservices/payment-component/src/, no PaymentRoutingResult
        consumer, and domain/swiftMessages.ts's message-type selection
        (payAdviceMsgType/payCoverMsgType) does not call this or anything
        like it. Kept here as a citation of the legacy source function
        this endpoint would wrap if it were ever built — do not assume it
        is reachable.
      parameters:
        - in: query
          name: mtType
          required: true
          schema: { type: string, enum: [MT103, MT202] }
        - in: query
          name: accountBankBic
          required: true
          schema: { type: string }
        - in: query
          name: trxCcy
          required: true
          schema: { type: string }
        - in: query
          name: blockCheck
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRoutingResult' }

components:
  parameters:
    InstructionId:
      name: instructionId
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    OriginModule:
      type: string
      enum: [IPLC, EPLC, IMCO, EXCO, PYMT, GTEE, RPFM, CFNC, SBLC, REIM, IWGT]

    AccountType:
      type: string
      description: >
        Source: CPYT_DR_AC_TYPE / CPYT_CR_AC_TYPE. CUSTOMER/NOSTRO/VOSTRO/
        SUSPENSE/INTERNAL are verified in use across IPLC/EPLC/IMCO/EXCO/
        GTEE/IWGT.


        v1.1.0 added RTGS as a sixth, RPFM-only value (source literally
        writes 'RTGS' into this field for RPFM's 4 functions — Process
        Grantor, Repay Grantor, Settle Participant, Process Participant;
        SSSS_PaymentCredit.js:1392,1396,1409,1413,1424,1438,1443;
        SYF_RPFM_ProcessGrantor.js:419,456; SYF_RPFM_RepayGrantor.js:326;
        SYF_RPFM_SettleParticipant.js:325,429; SYF_RPFM_ProcessParticipant.js:469).
        v1.2.0 corrected an earlier draft that mis-described it as a
        credit-leg-only / SWIFT-message-routing-only marker: it is a
        genuine settlement-account classification used on BOTH debit and
        credit legs, selecting a distinct GL account number (19511609 for
        RTGS vs. 12011101 for NOSTRO in the same currency-driven branch)
        for Indonesian domestic RTGS clearing chosen over correspondent
        NOSTRO settlement based on currency (IDR vs. other).


        v1.3.0 removed RTGS as a value here. Re-verified against source:
        RTGS never drove any classification or message-routing branch
        differently from NOSTRO (no such branching exists in legacy
        source at all — see ClassificationResult and PaymentLegInput.
        rtgsIndicator below). It is now represented as accountType=NOSTRO
        plus rtgsIndicator=true, scoped to originModule "RPFM" only.
        Account Entry generation is unaffected either way, since it is
        unconditional per leg regardless of AccountType (§4.1).
      enum: [CUSTOMER, NOSTRO, VOSTRO, SUSPENSE, INTERNAL]

    AccountCategory:
      type: string
      readOnly: true
      description: >
        Server-derived grouping of AccountType. CUSTOMER -> [CUSTOMER];
        NOSTRO_FAMILY -> [NOSTRO, VOSTRO]; INTERNAL_SUSPENSE ->
        [SUSPENSE, INTERNAL]. These three buckets are never mixed in any
        conditional branch found in SSSS_PaymentDebit.js /
        SSSS_PaymentCredit.js — verified across every occurrence of
        NOSTRO/VOSTRO and SUSPENSE/INTERNAL in both files.
      enum: [CUSTOMER, NOSTRO_FAMILY, INTERNAL_SUSPENSE]

    MonetaryAmount:
      type: string
      pattern: '^-?\d{1,18}(\.\d{1,3})?$'
      description: >
        Added in v1.2.0, replacing type: number on every monetary field.
        Exact decimal amount as a STRING — never a binary float / JSON
        number. Scale is currency-driven (2 for EUR/USD, 0 for JPY, 3 for
        BHD/KWD). Server-side arithmetic and the Dr/Cr balance check
        (§5.4 step 1) MUST use decimal/BigDecimal, never IEEE-754 double.
      example: "800000.20"

    ExchangeRate:
      type: string
      pattern: '^\d{1,12}(\.\d{1,10})?$'
      description: >
        Added in v1.2.0, replacing type: number on every rate field.
        Exact decimal FX rate as a STRING (up to 10 dp). Decimal
        arithmetic only.
      example: "7.802350"

    PaymentInstructionConfirmRequest:
      type: object
      description: >
        Single input body for POST /payment-instructions — header fields
        plus the complete debitLegs[]/creditLegs[] arrays, submitted in
        one call. Replaces the earlier draft's separate header-create
        request followed by individual per-leg add calls.
      required: [originModule, mainRef, sequence, unitCode, debitLegs, creditLegs]
      properties:
        originModule: { $ref: '#/components/schemas/OriginModule' }
        mainRef: { type: string, description: "Source CPYT_C_REF / C_MAIN_REF" }
        sequence:
          type: integer
          description: >
            CPYT_I_SEQUENCE — combined with originModule+mainRef as the
            idempotency natural key. Required (v1.2.0): omitting it
            degrades the key to (originModule, mainRef), which would
            cause a second (partial) payment against the same
            transaction to be misidentified as a resubmission and
            silently skipped.
        unitCode: { type: string }
        tenorType: { type: string, description: "CPYT_C_TENOR_TYPE" }
        tenorStartDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        payInstrFlag:
          type: string
          enum: [F, A]
          description: >
            CPYT_PAY_INSTR_FLAG — added in v1.1.0. Source:
            SSSS_PaymentInstruction.js:72-77 — F when CPYT_C_SDA_FLAG ==
            "Sight", else A (Acceptance/deferred). CAUTION: the only
            setter for this flag is gated on
            SYS_ORG_FUNCTION_SHORT_NAME == "PayAccp", a short-name value
            not found configured anywhere else in this codebase (module.xml
            or elsewhere) — its reachability in the current baseline could
            not be confirmed this session. Treat as optional until that is
            resolved; do not assume every Pay/Accept-named function
            actually populates it today.
        debitLegs:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PaymentLegInput' }
        creditLegs:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PaymentLegInput' }
        suspenseBridge:
          allOf: [ { $ref: '#/components/schemas/SuspenseBridge' } ]
          description: >
            Added v1.4.0. Optional Balance/Charge Component <-> Payment
            Component accounting bridge — see SuspenseBridge's own
            description. Omit entirely for callers that don't integrate
            with a Balance or Charge Component; debitLegs/creditLegs above
            are unaffected either way.

    SourceComponent:
      type: string
      enum: [BALANCE, CHARGE]
      description: >
        Added v1.5.0 — NOT legacy-traced. Identifies which upstream
        component already booked the OTHER leg of a SuspenseEntry on its
        own books. Pure provenance/audit metadata — this service only ever
        produces SETTLEMENT Account Entries (§6.2 Charge Voucher / §6.3
        Liability Voucher generation were removed entirely v1.6.0), so this
        field has no server-side validation or processing consequence; it
        exists purely for the caller's own audit trail.

    BalanceModule:
      type: string
      enum: [IBL, EBL]
      description: >
        Added v1.5.0. Only meaningful when the owning SuspenseEntry's
        sourceComponent is 'BALANCE' — which Balance Component sub-module
        booked the other leg (IBL = Import Bill Liability, EBL = Export Bill
        Liability). Purely descriptive; not cross-validated against
        originModule.

    SuspenseEntry:
      type: object
      required: [amount, currency]
      description: >
        Added v1.4.0. One raw amount to bridge through Suspense — e.g. one
        Charge Component commission line, or one Balance Component
        liability leg — in its own currency. A SuspenseBridge list may hold
        several of these (one per upstream line item); each becomes its own
        bridge leg, not merged into a single combined leg, so a
        mixed-currency set of entries stays itemized in the resulting
        Settlement Vouchers.
      properties:
        amount: { $ref: '#/components/schemas/MonetaryAmount' }
        currency: { type: string }
        crossRate:
          allOf: [ { $ref: '#/components/schemas/ExchangeRate' } ]
          description: >
            Required when currency differs from the instruction's
            transaction currency (debitLegs[0].currency); ignored
            otherwise. The rate converting this entry's own currency INTO
            the transaction currency. This service does not resolve FX
            rates itself — same posture as PaymentLegInput's own rate
            fields — so the caller must supply an already-resolved rate.
        sourceComponent:
          allOf: [ { $ref: '#/components/schemas/SourceComponent' } ]
          description: "Added v1.5.0. See SourceComponent's own description."
        balanceModule:
          allOf: [ { $ref: '#/components/schemas/BalanceModule' } ]
          description: "Added v1.5.0. Only meaningful when sourceComponent is 'BALANCE'."

    SuspenseBridge:
      type: object
      description: >
        Added v1.4.0 — NOT part of the legacy trace. An external Balance or
        Charge Component posts Dr Suspense - Debit / Dr Suspense - Credit
        against its own contra account (e.g. Cr IBL/EBL, Cr Commission) for
        a transaction; submitting the matching raw amounts here makes this
        service generate the offsetting Cr Suspense - Debit / Cr Suspense - Credit legs (both
        land on the CREDIT side — see debitEntries/creditEntries below),
        plus FX Exchange pair legs for any entry whose currency differs
        from the transaction currency (so Dr = Cr holds BY CURRENCY, not
        just in transaction-currency aggregate). All generated legs are
        appended to debitLegs/creditLegs before step 1 (balance
        validation) and therefore also appear in the response's
        SETTLEMENT accountEntries like any other submitted leg — no
        separate response field is added for them.


        This service does NOT adjust any of the caller's own
        debitLegs/creditLegs amounts — it only ADDS the bridge/FX-pair
        legs above. Because both debitEntries and creditEntries land
        entirely on the credit side, debitEntries additions by
        themselves make the submitted debitLegs/creditLegs unbalanced —
        the caller is still responsible for increasing its own debit
        total by the same transaction-currency-equivalent amount before
        submitting ("Debit Leg #1 = Total + Σ debitEntries" — the seeding
        step the Business Case Simulator does client-side), or step 1
        will return 409 LEGS_UNBALANCED. creditEntries, by contrast, are
        meant to be paired with a caller-side REDUCTION of an existing
        credit leg by the same amount ("Credit Leg #1 = Total - Σ
        creditEntries"), which is what makes that side self-cancelling in
        the caller's own total — again not something this service
        verifies or performs, only something the resulting request must
        already reflect for step 1 to pass. IMPORTANT (v1.7.4): each
        Suspense entry must still convert ALONE, never combined with a
        matching real leg's own amount — see payment-instructions-post.yaml's
        own SuspenseBridge description for the full counter-example; kept
        in lockstep here per this file's own scope note above.


        Every generated bridge leg is an ORDINARY Settlement leg (§6.1)
        regardless of any entry's sourceComponent tag — this service never
        generates a Charge or Liability Voucher entry at all (§6.2/§6.3
        generation was removed entirely v1.6.0), on the premise that the
        upstream Balance/Charge Component that tagged an entry already
        booked the corresponding leg on its own books (see
        SourceComponent's description).


        v1.7.0/v1.7.1 (SUPERSEDED by v1.8.0): first attempt combined a
        foreign-currency Suspense bucket with any matching real Payment Leg
        into ONE netted/combined FX Exchange pair — aggregate-V8-safe but
        not guaranteed to balance BY CURRENCY.


        v1.8.0: generates up to TWO independent, self-balancing FX Exchange
        pairs per foreign-currency bucket instead — one Suspense-suffixed
        (`FX Exchange {ccy} - Suspense`, always CREDIT-anchored, sized to
        the bucket's own bridge legs' amountTxCcy reused verbatim) and one
        plain (`FX Exchange {ccy}`, direction matches the list, sized to
        the matching real legs' own amountTxCcy reused verbatim, skipped
        when no real leg exists). See payment-instructions-post.yaml's own
        v1.8.0 changelog entry for the full derivation and worked example.
        The Suspense leg(s) themselves are unaffected by any of this —
        still always posted gross, per entry, always credit-direction.
      properties:
        debitEntries:
          type: array
          items: { $ref: '#/components/schemas/SuspenseEntry' }
          description: >
            The "collect more" case (buyer pays more). See this schema's
            top-level description for the caller-side debit-total
            adjustment step 1 (balance validation) still requires.
        creditEntries:
          type: array
          items: { $ref: '#/components/schemas/SuspenseEntry' }
          description: >
            The "pay less" case (money redirected into Suspense instead
            of paid out). See this schema's top-level description for the
            caller-side credit-total adjustment step 1 (balance
            validation) still requires.

    PaymentInstruction:
      type: object
      description: >
        Output of POST /payment-instructions and GET .../{instructionId}.
        Embeds every result of the confirm flow in one object — legs
        (enriched with server-derived fields), classification, and the
        two downstream outputs — so no follow-up call is needed to
        assemble a complete picture of what was confirmed.
      properties:
        instructionId: { type: string }
        sequence: { type: integer, description: "CPYT_I_SEQUENCE" }
        originModule: { $ref: '#/components/schemas/OriginModule' }
        mainRef: { type: string }
        tenorType: { type: string }
        tenorDays: { type: integer }
        maturityDate: { type: string, format: date }
        payInstrFlag: { type: string, enum: [F, A], description: "CPYT_PAY_INSTR_FLAG — see PaymentInstructionConfirmRequest.payInstrFlag for source and reachability caveat" }
        unpaidAmountTxCcy: { $ref: '#/components/schemas/MonetaryAmount' }
        unpaidFlag: { type: boolean }
        debitLegs:
          type: array
          items: { $ref: '#/components/schemas/PaymentLeg' }
        creditLegs:
          type: array
          items: { $ref: '#/components/schemas/PaymentLeg' }
        classification:
          allOf: [ { $ref: '#/components/schemas/ClassificationResult' } ]
          readOnly: true
        accountEntries:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/AccountEntry' }
        swiftMessages:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/SwiftMessage' }

    PaymentLegInput:
      type: object
      required: [accountNo, accountType, currency, amountTxCcy]
      properties:
        accountNo: { type: string, description: "CPYT_DR_AC / CPYT_CR_AC" }
        accountType: { $ref: '#/components/schemas/AccountType' }
        rtgsIndicator:
          type: boolean
          description: >
            Added v1.3.0. Only meaningful when accountType=NOSTRO; scoped
            to originModule "RPFM". Replaces the old standalone RTGS
            AccountType value (source: CPYT_DR_AC_TYPE/CPYT_CR_AC_TYPE
            literal 'RTGS') — see AccountType description for why. Marks
            a Nostro leg as clearing via the domestic RTGS rail rather
            than SWIFT correspondent messaging; drives voucher-description
            TypeChar 'R' instead of NOSTRO's 'N', but does not change
            AccountCategory (still NOSTRO_FAMILY) or add a new
            classification term (still folds into nostroXor).
        partyId: { type: string, description: "CPYT_DR_ID / CPYT_CR_ID" }
        partyName: { type: string }
        currency: { type: string, description: "CPYT_DR_CCY / CPYT_CR_CCY" }
        amountAccountCcy:
          allOf: [ { $ref: '#/components/schemas/MonetaryAmount' } ]
          description: "CPYT_DR_AMT_DRCCY / CPYT_CR_AMT_CRCCY"
        amountTxCcy:
          allOf: [ { $ref: '#/components/schemas/MonetaryAmount' } ]
          description: "CPYT_DR_AMT_TXCCY / CPYT_CR_AMT_TXCCY"
        drRate:
          allOf: [ { $ref: '#/components/schemas/ExchangeRate' } ]
          description: >
            CPYT_DR_RATE — added in v1.1.0, replacing the single
            exchangeRate property. form_schema_PaymentDebit.xsd:61 /
            form_schema_PaymentCredit.xsd:64. Exact usage vs. drBuyRate
            not fully resolved this pass — see the mapping doc §10 R2.
        drBuyRate:
          allOf: [ { $ref: '#/components/schemas/ExchangeRate' } ]
          description: >
            CPYT_DR_BUY_RATE. Confirmed as the applicable buy-or-sell rate
            selected by an amount threshold in Debit_ExchangingRate()
            (SSSS_PaymentDebit.js:417-421) for IMCO — both the "Buying
            Rate" and "Selling Rate" lookups write to this one field.
            form_schema_PaymentDebit.xsd:51 / form_schema_PaymentCredit.xsd:54.
        crBuyRate:
          allOf: [ { $ref: '#/components/schemas/ExchangeRate' } ]
          description: >
            CPYT_CR_BUY_RATE — added in v1.1.0. form_schema_PaymentDebit.xsd:20
            / form_schema_PaymentCredit.xsd:26. Credit-side counterpart of
            drBuyRate; specific selection logic not traced this pass.
        sellRate:
          allOf: [ { $ref: '#/components/schemas/ExchangeRate' } ]
          description: >
            CPYT_SELL_RATE — added in v1.1.0. form_schema_PaymentDebit.xsd:83
            / form_schema_PaymentCredit.xsd:85. Distinct from drBuyRate in
            the source schema; relationship between the two not fully
            resolved this pass — see the mapping doc §10 R2 before treating
            this schema as final.
        valueDate: { type: string, format: date, description: "CPYT_DR_VAL_DATE / CPYT_CR_VAL_DATE" }
        sdaFlag: { type: string, description: "CPYT_C_SDA_FLAG (Sight/Usance/D-P/D-A)" }
        payAdviceMsgType:
          type: string
          enum: [MT103, PACS008, None]
          description: >
            CPYT_PAY_ADV_MSG (credit legs only). Scope rule: Payment
            Component covers SWIFT Category 1 (MT1xx) + Category 2
            (MT2xx) + pacs.008.*/pacs.009.* — MT103/PACS008 are the only
            Category-1/pacs.008 values currently selectable in this DO's
            dropdown, but any other MT1xx value encountered elsewhere is
            in-scope by the same rule. Source field also allows MT400/MT756
            (Category 4/7) — those are out of scope and owned by the main
            transaction (IPLC/EPLC/IMCO/EXCO), never accepted here.
        payCoverMsgType:
          type: string
          enum: [MT202, MT202COV, PACS009COV, None]
          description: >
            CPYT_PAY_COV_MSG (credit legs only). All current values are
            Category 2 (MT2xx) / pacs.009.* — in scope. MT200 (also
            Category 2) is separately handled today by
            SYF_PYMT_ProcessMT200.js and is in-scope by the same category
            rule if/when integrated with PaymentDebit/PaymentCredit.

    PaymentLeg:
      allOf:
        - { $ref: '#/components/schemas/PaymentLegInput' }
        - type: object
          properties:
            legId: { type: string, readOnly: true }
            legSide: { type: string, enum: [DEBIT, CREDIT], readOnly: true }
            accountDesc:
              type: string
              readOnly: true
              description: "CPYT_DR_AC_DESC / CPYT_CR_AC_DESC — voucher description code, {MODULE}{FuncCode}NULLNULLNULL{TypeChar}"
            accountCategory:
              allOf: [ { $ref: '#/components/schemas/AccountCategory' } ]
              readOnly: true

    ClassificationResult:
      type: object
      description: >
        Rev. 2 — CUSTOMER/NOSTRO/VOSTRO evaluated as three fully
        independent terms (superseded a merged NOSTRO+VOSTRO version
        that incorrectly excluded genuine Nostro-vs-Vostro postings).
        Read-only, embedded in PaymentInstruction.classification. Does
        not gate account entry generation — all legs post as Account
        Entries regardless of paymentComponentRelated.
      properties:
        instructionId: { type: string }
        debitTypes:
          type: array
          items: { $ref: '#/components/schemas/AccountType' }
          description: "Distinct accountType values across all debit legs (Dr_has(t) support set)"
        creditTypes:
          type: array
          items: { $ref: '#/components/schemas/AccountType' }
          description: "Distinct accountType values across all credit legs (Cr_has(t) support set)"
        customerXor:
          type: boolean
          description: "Dr_has(CUSTOMER) XOR Cr_has(CUSTOMER)"
        nostroXor:
          type: boolean
          description: "Dr_has(NOSTRO) XOR Cr_has(NOSTRO)"
        vostroXor:
          type: boolean
          description: "Dr_has(VOSTRO) XOR Cr_has(VOSTRO)"
        paymentComponentRelated:
          type: boolean
          description: "customerXor OR nostroXor OR vostroXor"

    AccountEntry:
      type: object
      description: >
        One GL posting line — derived from the vch_*.xml ENTRY template
        plus the Charge/Liability/Settlement voucher streams. Generated
        unconditionally for every debit and credit leg regardless of
        ClassificationResult.paymentComponentRelated.
      properties:
        entryId: { type: string }
        instructionId: { type: string }
        voucherType: { type: string, enum: [SETTLEMENT, CHARGE, LIABILITY] }
        custId: { type: string, description: "C_CUST_ID" }
        description: { type: string, description: "C_TRX_DESC / C_VOUCHER_DESC" }
        drCrIndicator: { type: string, enum: [D, C], description: "C_DBT_CRDT" }
        glAccount: { type: string, description: "C_GL" }
        subLedger: { type: string, description: "C_SL" }
        currency: { type: string, description: "C_CURRENCY" }
        amount: { allOf: [ { $ref: '#/components/schemas/MonetaryAmount' } ], description: "N_AMT" }
        bookingDate: { type: string, format: date, description: "D_BOOKING_DATE" }
        valueDate: { type: string, format: date, description: "D_VALUE_DATE" }
        transactionCode: { type: string, description: "C_TRANS_CODE" }
        exchangeRate1: { $ref: '#/components/schemas/ExchangeRate' }
        exchangeRate2: { $ref: '#/components/schemas/ExchangeRate' }
        referenceNumber: { type: string, description: "C_REF_NUMBER" }

    SwiftMessage:
      type: object
      properties:
        messageId: { type: string }
        instructionId: { type: string }
        legId: { type: string }
        messageType:
          type: string
          enum: [MT103, MT202, MT202COV, PACS008, PACS009, PACS009COV]
          description: >
            All values are SWIFT Category 1/2 or pacs.008.*/pacs.009.* —
            the Payment Component's in-scope message families. MT200 is
            Category 2 and in-scope by the same rule, but is not
            currently produced through this endpoint (handled separately
            by SYF_PYMT_ProcessMT200.js) — add to this enum if/when that
            flow is integrated.
        status: { type: string, enum: [PENDING, GENERATED, TRANSMITTED, FAILED] }
        correspondentBic: { type: string }
        settlementCurrency: { type: string, description: "field 32A / CPYT_CR_CCY" }
        settlementAmount: { allOf: [ { $ref: '#/components/schemas/MonetaryAmount' } ], description: "field 32A / CPYT_CR_AMT_CRCCY" }
        instructedAmount: { allOf: [ { $ref: '#/components/schemas/MonetaryAmount' } ], description: "field 33B" }
        valueDate: { type: string, format: date }
        uetr: { type: string, description: "UETR_GPI_121 — SWIFT gpi tracking reference" }
        serviceTypeId: { type: string, description: "SERVICE_TYPE_ID_GPI_111" }
        isGpiMember: { type: boolean, description: "IS_GPI_MEMBER" }

    PaymentRoutingResult:
      type: object
      description: >
        NOT IMPLEMENTED — see the /payment-routing path's own description.
        Kept only because the path is kept, as a citation of the legacy
        response shape a future implementation would need to match.
      properties:
        routingBic: { type: string }
        countryCode: { type: string }
        blockStatus: { type: string, description: "gPR_blockStatus — sanctions/country block result" }
        noteInterface: { type: string }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
