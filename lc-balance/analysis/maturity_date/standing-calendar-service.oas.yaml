openapi: 3.0.3
info:
  title: Standing Data & Business Day Calculation Service
  description: >
    Provides Currency, Country, and Calendar (Holiday/Weekend) reference data,
    and a stateless calculation capability for business-day adjustment and
    business-day arithmetic. Consuming domains (Trade Finance, Loans, Treasury,
    Payments) own their own domain logic (Tenor Basis resolution, Base Date
    determination, Contractual Maturity Date calculation) and call this
    service only for calendar-aware date math, so every consumer applies
    identical business-day rules.


    ## Scope boundary (hard rule)

    This service does NOT know about LC, Bill, Obligation, Balance, or
    Settlement. It receives a source date plus an explicit list of applicable
    calendars and returns an adjusted date plus full per-calendar evidence.

    This service MUST NOT, directly or indirectly:
    - create, modify, or close a Trade Finance Obligation
    - modify a Contractual Maturity Date
    - update a Balance
    - create or modify a Settlement / Settlement Instruction
    - determine or declare formal Overdue status

    Every response to /business-days/adjust echoes `contractualDateChanged:
    false` for this reason -- this endpoint only ever produces an
    Operational/derived date, never a revised contractual one. A future
    product need to legitimately amend a Contractual Maturity Date must go
    through a separate, explicitly-controlled Trade Finance workflow (e.g.
    LC Amendment / Rescheduling), not this endpoint.


    ## Fail-closed policy (hard rule)

    Missing required calendar data, an unapproved calendar version, coverage
    that does not reach the requested date, a conflicting ad hoc closure, or
    a force-majeure closure affecting the calculation are REJECTED (4xx/5xx,
    see error table) -- they are never silently treated as "date is a
    business day". Only genuinely informational observations (e.g. calendar
    data will expire soon, non-blocking) are returned as `warnings`
    alongside a 200 response.


    ## v2.1.0 hardening notes (contract-enforcement pass)

    v2.0.0 introduced the business rules above as request/response fields
    with description text. This revision makes as many of those rules as
    JSON Schema (OpenAPI 3.0.3 / Draft-4-compatible subset) can express into
    actual schema constraints, so a client cannot construct a request or a
    server cannot emit a response that merely LOOKS compliant on paper:
    - `contractualDateChanged` is now `enum: [false]`, not just `boolean`.
    - Response schemas now declare `required:` for every field that is
      always returned, so `{}` or a partial response is schema-invalid.
    - `sourceDateType` / `calculationPurpose` legal pairings are enforced via
      `oneOf`, not prose.
    - `calendarSnapshotId` / `asOfDateTime` mutual exclusivity is enforced
      via `not: {required: [...]}`, not prose.
    - `CalendarReference.role` is now required.
    - One rule remains OUT OF REACH of OpenAPI 3.0.3 Schema Object
      constructs: "ANY_ELIGIBLE_OPEN requires at least one complete
      pathGroup among `calendars[]`" needs an array-level existential
      constraint (JSON Schema `contains`, draft-06+) that the OAS 3.0.3
      Schema Object does not support and that a Draft-4 validator does not
      enforce even if present in the document. This rule is therefore
      explicitly called out as ENFORCED BY THE SERVER, not by the schema --
      see `CombinationRule` and the `INCOMPLETE_PAYMENT_PATH_GROUP` /
      `INVALID_PAYMENT_PATH_GROUP` error codes below. A future migration to
      OpenAPI 3.1 (full JSON Schema 2020-12) would allow this to become a
      real schema constraint too.
    - The `standing.calendars.institution.read` scope differentiation is
      likewise a rule OpenAPI's static `security:` block cannot express
      conditionally on request-body content; it is now explicitly documented
      as a Gateway/middleware-enforced rule, with dedicated 401/403 responses
      and an `INSUFFICIENT_CALENDAR_SCOPE` error code so the contract at
      least documents the failure mode precisely.


    ## v2.2.0 hardening notes (round 3)

    - `FORCE_MAJEURE_EVENT` is no longer just an enum value with two boolean
      flags defaulting the wrong way: `CalendarAssessment` now uses a nested
      `oneOf` so that reasonCode=FORCE_MAJEURE_EVENT schema-REQUIRES
      `manualReviewRequired: true` and `automaticAdjustmentAllowed: false`
      -- a response claiming force majeure without both flags set correctly
      is itself schema-invalid. On top of that, `/business-days/adjust` and
      `/business-days/add` fail closed: if any calendar assessment for
      sourceDate OR adjustedDate/resultDate carries
      reasonCode=FORCE_MAJEURE_EVENT, the service does not return 200 with a
      computed date at all -- it rejects with `422 MANUAL_REVIEW_REQUIRED`,
      so a force-majeure-affected date can never silently reach an
      automatic payment flow.
    - `calendarVersions`, `calendarAssessments`, and `adjustedDateAssessments`
      now declare `minItems: 1`: a 200 response with an empty evidence array
      is schema-invalid, matching the fact that every request already
      requires `calendars: {minItems: 1}`.
    - Added `AUTHENTICATION_REQUIRED` to the error vocabulary so every 401
      response has a schema-legal errorCode distinct from the 403
      `INSUFFICIENT_CALENDAR_SCOPE` case.
    - `X-Correlation-ID` is now declared as a response header on every
      response of every operation, success AND error alike (previously only
      on 200s), so the "returned on every response" claim in this document
      is actually true of the schema, not just of the error body's
      `correlationId` field.


    ## v2.3.0 hardening notes (round 4)

    - The `MANUAL_REVIEW_REQUIRED` fail-closed trigger is broadened from
      "sourceDate OR adjustedDate only" to the full evaluated window: any
      date that would otherwise appear in `skippedDates` between them is
      checked too, so a force-majeure closure hidden in the middle of a
      multi-day roll cannot slip through undetected.
    - Added `calculationWindowStartDate` / `calculationWindowEndDate` to
      both response schemas (always min/max of the two boundary dates),
      specifically so Impact Report generation can test date-range overlap
      against a calendar update instead of comparing only against
      sourceDate -- see the design document's Impact Report section for why
      sourceDate alone under-detects affected transactions.
    - `GET /currencies/{code}` and `GET /countries/{code}` now declare `401`
      (they sit under the same global `security:` block as every other
      operation, but had never declared what an auth failure looks like).
    - `GET /calendars/{calendarType}/{code}/is-business-day` now declares
      `404` (calendar not configured) distinct from `422` (calendar
      configured, but no data for the requested date), matching the other
      two Calendars GET endpoints and fixing a mismatch versus the design
      document, which already described a 404 here.
    - `includeStartDate`'s description no longer uses the internally
      inconsistent "day zero" framing (flagged in round-3 review: under
      that framing includeStartDate would not change the result at all).
      Re-worded in terms of which business day, #1 or later, absorbs
      startDate.


    ## v2.4.0 hardening notes (round 5)

    - `calculationWindowStartDate`/`calculationWindowEndDate` were defined
      in round 4 as always min/max(sourceDate, adjustedDate). Round-5 review
      correctly pointed out this under-counts for MODIFIED_FOLLOWING /
      MODIFIED_PRECEDING / NEAREST, which can probe dates in a direction
      that is ultimately abandoned. Redefined as the min/max over EVERY date
      actually evaluated, not just the two boundary dates.
    - Split `CALENDAR_NOT_CONFIGURED` into two codes: `CALENDAR_NOT_FOUND`
      (404, always -- the Calendars GET endpoints, "this calendar doesn't
      exist") and `CALENDAR_NOT_CONFIGURED` (422, always -- the calculation
      POST endpoints, "a calculation needs a calendar that isn't set up").
      The single code at two different statuses directly violated this
      document's own "same code, same status" rule.
    - Added `ClosureStatus` (ACTIVE/RESOLVED/CANCELLED) to
      `skippedDates[].closureStatus` and `CalendarAssessment.closureStatus`
      (+ `resolvedAt`), so a FORCE_MAJEURE_EVENT entry can be marked as
      historical rather than live. The `MANUAL_REVIEW_REQUIRED` fail-closed
      trigger now explicitly requires closureStatus=ACTIVE (or omitted);
      RESOLVED/CANCELLED entries may appear in a 200 response as audit
      trail. Cross-field enforcement (a 200 response must never contain an
      ACTIVE force-majeure entry) remains SERVICE-enforced, not
      schema-enforced, for the same `contains`-keyword reason as
      `CombinationRule`/`ANY_ELIGIBLE_OPEN` in section 3.16.
    - `components.headers.CorrelationId` now declares `required: true`.
    - `GET /currencies/{code}` and `GET /countries/{code}` success response
      schemas now declare `required[]` (they were the only 2 of the 5 GET
      endpoints still missing it).


    ## v2.5.0 hardening notes (round 6)

    - `CalendarAssessment` restructured from a single top-level `oneOf` into
      `allOf` of two independent `oneOf` groups, so a second, orthogonal
      constraint group could be added without interfering with the first.
      The businessDay=true branch of group 1 is now tightened to forbid
      reasonCode, closureStatus, resolvedAt, manualReviewRequired=true, and
      automaticAdjustmentAllowed=false all being present -- round-6 review
      correctly caught that a businessDay=true entry could previously still
      claim reasonCode=FORCE_MAJEURE_EVENT, a direct self-contradiction
      ("this date was open" and "this date had a force-majeure closure" in
      the same object).
    - New group 2 on `CalendarAssessment`, and a new `oneOf` on
      `skippedDates[]` items: `resolvedAt` is now required if and only if
      `closureStatus` is RESOLVED or CANCELLED (and forbidden otherwise).
      Previously `resolvedAt` was optional regardless of `closureStatus`,
      so an ACTIVE entry could carry a resolution timestamp and a
      RESOLVED entry could omit one.


    ## v2.6.0 hardening notes (round 12)

    - `ErrorResponse.errorCode` enum gains two new members: CURRENCY_NOT_FOUND
      (404, GET /currencies/{code} only) and COUNTRY_NOT_FOUND (404, GET
      /countries/{code} only). Previously these two endpoints' 404 responses
      only referenced (via $ref) the shared ErrorResponse schema with no enum member they
      could legally use other than CALENDAR_NOT_FOUND, which is reserved for
      the three Calendars GET endpoints -- there was no errorCode value that
      was simultaneously schema-legal AND business-accurate for "this
      currency/country code does not exist".
    - Unlike every other errorCode-to-endpoint association in this spec
      (documented in prose only), the 404 responses of the three Calendars
      GET endpoints plus GET /currencies/{code} and GET /countries/{code}
      are now additionally schema-narrowed per-response: each layers an
      `allOf` + `properties.errorCode.enum: [...]` restriction on top of the
      shared ErrorResponse component, so a 404 response claiming the wrong
      errorCode for that specific endpoint (e.g. CALENDAR_NOT_FOUND from GET
      /currencies/{code}) is itself schema-invalid, not merely undocumented.
    - GET /countries/{code}'s `weekendDays` example corrected from
      ["FRI", "SAT"] to ["SAT", "SUN"] for country=AE (United Arab
      Emirates): AE's federal public-sector weekend has been Saturday/
      Sunday since 2022-01-01 (Friday/Saturday before that). The enum
      itself (MON..SUN) already allowed SAT/SUN before this fix -- this is
      a documentation/example accuracy correction, not a new schema
      constraint. See the field's own description for why per-date
      historical weekend determination is a COUNTRY-calendar
      (calendarVersion/asOfDateTime) concern, not something this static
      reference-data endpoint versions itself.


    ## v2.7.0 hardening notes (round 13)

    - `weekendDays` now declares `minItems: 1`, `maxItems: 3`, and
      `uniqueItems: true`. Previously an empty array, a duplicate day
      (["SAT","SAT"]), or all seven days as "weekend" were all schema-legal
      nonsense. `maxItems: 3` accommodates every real-world weekend pattern
      this spec is aware of (1 day, e.g. Nepal Saturday-only; 2 days, e.g.
      Saudi Arabia Friday/Saturday; 3 days, e.g. a Sharjah government
      Friday-Sunday pattern) without permitting an unbounded list.
    - `CalendarReference.pathGroup` now declares `minLength: 1`,
      `maxLength: 50`, and `pattern: '^[A-Za-z0-9._-]+$'`, so an empty or
      whitespace-only pathGroup (which a naive "field is present" server
      check could previously mistake for a real alternate payment path) is
      now itself schema-invalid. The deeper rules -- every pathGroup value
      must resolve to a complete, product-policy-approved path; the same
      calendar must not repeat within one pathGroup; ANY_ELIGIBLE_OPEN
      requires at least one complete group to exist at all -- remain
      SERVER-ENFORCED, not schema-enforced, for the same `contains`-keyword
      reason already documented under `CombinationRule` (OAS 3.0.3's
      Draft-4-compatible subset cannot express "at least one array item
      satisfies X").
    - `GET /calendars/{calendarType}/{code}/is-business-day`'s `422`
      response is now schema-narrowed to `errorCode: enum:
      [CALENDAR_YEAR_NOT_AVAILABLE]` via the same `allOf` + narrowed-`enum`
      pattern already used for this spec's 404 responses (round 12).
      CALENDAR_YEAR_NOT_AVAILABLE was already the errorCode this document's
      own `/business-days/adjust` fail-closed-behavior description reserves
      for "the calculation window reaches into a year/period the calendar
      has not been loaded for" -- the identical condition this 422
      describes ("calendar exists but data is not available for the
      requested date") -- so this reuses an existing, already-scoped code
      rather than minting a new one.
    - `GET /calendars/{calendarType}/{code}/holidays` now documents a
      maximum query range (`to` minus `from` <= 366 days) and declares a
      new `400 INVALID_DATE_RANGE` response, schema-narrowed the same way.
      OpenAPI 3.0.3's Draft-4-compatible Schema Object cannot compare the
      VALUES of two sibling properties (`from`/`to`) to each other -- that
      needs `if`/`then` with date arithmetic, draft-07+ -- so the 366-day
      ceiling itself is SERVER-ENFORCED, not schema-enforced; only the
      shape of the resulting error response is a schema contract. Pagination
      (`page`/`pageSize`/`nextPageToken`) was considered as an alternative
      per the round-13 review but deliberately NOT added here: introducing
      new request/response surface for pagination is a larger API-contract
      decision than this round's fix warrants, and is deferred to a
      follow-up (see design doc section 7) rather than added unprompted.
    - New reusable format-constrained components: `CountryCode` (`^[A-Z]
      {2}$`), `CurrencyCode` (`^[A-Z]{3}$`), and `BicCode` (`^[A-Z0-9]{8}
      ([A-Z0-9]{3})?$`). Applied wherever a field is UNAMBIGUOUSLY one of
      these three (GET /currencies/{code}'s path parameter and its response
      `code`; GET /countries/{code}'s path parameter, its response `code`,
      and `defaultCountryCalendarCode`). NOT applied to `CalendarReference.
      code`, `CalendarVersionRef.code`, `CalendarAssessment.code`, or the
      generic `CalendarCodePath` parameter, because those fields are
      POLYMORPHIC -- the same `code` property holds a currency code, a
      country code, or an institution BIC depending on the sibling
      `calendarType` value, and OAS 3.0.3 (no `if`/`then`, draft-07+) cannot
      express "pattern X when calendarType=CURRENCY, pattern Y when
      calendarType=COUNTRY, pattern Z when calendarType=INSTITUTION" as a
      single declarative constraint. That conditional pattern check remains
      SERVER-ENFORCED and is now called out explicitly on
      `CalendarCodePath` and `CalendarReference.code`.
    - `GET /countries/{code}`'s response schema gains four new REQUIRED
      governance fields: `effectiveFrom` (date), `calendarVersion` (string),
      `lastApprovedAt` (date-time), and `sourceAuthority` (string, pattern-
      constrained). These let a caller of the CURRENT-snapshot endpoint see,
      without a separate call, since when the returned `weekendDays` value
      has applied, which version it corresponds to, when it was last
      approved, and whose authority it is sourced from -- directly
      addressing round-13 P2-1. Historical/versioned re-calculation still
      goes through the COUNTRY calendar's `calendarVersion`/`asOfDateTime`
      mechanism on the `/calendars/...` endpoints, unchanged from round 12;
      these four fields are read-only descriptive metadata on the CURRENT
      snapshot, not a new way to query history.
    - `AdjustBusinessDayRequest` and `AddBusinessDaysRequest` now declare
      `additionalProperties: false`, so a request body with an unknown
      property (e.g. a caller who meant `sourceDate` but typed
      `sourceData`) is schema-rejected instead of the typo being silently
      ignored. Deliberately NOT applied to any response schema in this
      round (per the review's own caveat): forward-compatibility for
      servers that add new response fields ahead of client updates matters
      more on the response side, and no reviewer finding asked for it there.
    - Fixed a stale cross-reference: `weekendDays`'s own description
      pointed readers to "3.44 in the design doc" for why version-aware
      querying is not added as a new parameter here; the actual discussion
      is in section 3.45 (3.44 covers the CURRENCY_NOT_FOUND/COUNTRY_NOT_FOUND
      404 fix instead). Corrected to 3.45.

    NOTE (round 15, P2-2): three claims in the v2.7.0 notes above are
    SUPERSEDED by later rounds and must not be read as current behavior:
    (a) the `BicCode` pattern quoted above (`^[A-Z0-9]{8}([A-Z0-9]{3})?$`)
    had a structural bug, corrected in the v2.8.0 notes below; (b)
    `defaultCountryCalendarCode` was walked back off `CountryCode` in the
    v2.8.0 notes below, onto the new, more permissive `CalendarCode`
    component; (c) the claim that `CalendarReference.code` could not be
    format-constrained because OAS 3.0.3 "cannot express a single
    declarative constraint" for a polymorphic field was too broad -- true
    for a single `pattern`, but not for a discriminated `oneOf` over whole
    object shapes, which the v2.9.0 notes below use to fix exactly this.
    This note exists because a reader who only reads this v2.7.0 block in
    isolation could otherwise mistake round-13's now-outdated positions for
    the spec's current behavior -- see design doc 3.59 for the full
    discussion of why point-in-time hardening notes are kept (not
    rewritten) but cross-annotated like this instead.


    ## v2.8.0 hardening notes (round 14)

    - Fixed `BicCode`'s pattern: the round-13 version
      (`^[A-Z0-9]{8}([A-Z0-9]{3})?$`) treated all 8 core characters as
      generic alphanumeric, wrongly accepting values like "12345678" or
      "BANK12XX" whose positions 5-6 (the ISO 3166-1 country-code segment
      of a real BIC) were digits -- structurally impossible for an actual
      Business Identifier Code. Corrected to
      `^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$`, matching SWIFT's
      own BIC structure (4-char party prefix, 2-LETTER country code,
      2-char location code, optional 3-char branch code). A regex still
      cannot confirm positions 5-6 form a country code that actually
      exists in ISO 3166-1 -- that remains SERVER-ENFORCED, called out
      explicitly in `BicCode`'s own description.
    - `defaultCountryCalendarCode` no longer references (via `$ref`)
      `CountryCode` directly. Round-13 silently assumed a country's default COUNTRY
      calendar identifier always equals its own 2-letter country code;
      round-14 review correctly flagged this as an unconfirmed
      product-policy assumption, since a real deployment might need
      calendar identifiers like "AE_FEDERAL" or "MY_KEDAH" that a strict
      `^[A-Z]{2}$` pattern would reject. Introduced a new, more general
      `CalendarCode` component (`^[A-Z0-9._-]+$`, 2-50 chars) and switched
      `defaultCountryCalendarCode` to reference it instead -- still rejects
      lower-case/malformed values, but no longer over-constrains the
      field's length/shape ahead of an actual product-policy decision.


    ## v2.9.0 hardening notes (round 15)

    - `CalendarReference.code`'s format is now schema-enforced via a
      discriminated `oneOf` keyed on the sibling `calendarType` property:
      `CountryCode` for COUNTRY/FINANCIAL_CENTER, `BicCode` for
      INSTITUTION. This corrects the v2.7.0 notes' over-broad claim (see
      the round-15 annotation added there) that OAS 3.0.3 could not
      express this at all -- a single `pattern` genuinely cannot vary by a
      sibling's value, but `calendarType` and `code` live in the SAME
      schema object here (unlike `CalendarCodePath`, a standalone path
      parameter with no sibling to condition on, which remains
      SERVER-ENFORCED regardless of OAS/JSON-Schema version -- see that
      parameter's own, separately-corrected description below). This does
      NOT extend to `CalendarVersionRef.code` or `CalendarAssessment.code`
      in this round -- both have the same theoretically-fixable polymorphic
      shape, but `CalendarAssessment` already carries two independent
      `allOf`-wrapped `oneOf` groups for unrelated cross-field rules
      (round 6), and layering a third there risks real regression for a
      fix nobody has asked for yet; left as a named follow-up instead of
      silently done or silently skipped (see design doc 3.56 and section
      7).
    - Self-caught while building the above (not a reviewer finding):
      `CalendarCodePath`'s description (added round 13) incorrectly
      claimed CURRENCY_CLEARING calendar codes follow `CurrencyCode`'s
      `^[A-Z]{3}$` pattern. This contradicted `CalendarType`'s own
      description and every worked example already in this spec
      (`USD_FEDWIRE`, `EUR_TARGET2`, `defaultClearingCalendarCode`'s own
      example) -- a CURRENCY_CLEARING code names a settlement SYSTEM, not
      a bare ISO 4217 currency. Corrected that parameter's description,
      and the new `CalendarReference.code` oneOf above deliberately leaves
      the CURRENCY_CLEARING branch unconstrained rather than propagating
      the same wrong assumption into an enforced constraint. `CurrencyCode`
      itself is unaffected and remains correct everywhere else it's used
      (e.g. `GET /currencies/{code}`).
    - The five embedded request/response examples that exercise an
      INSTITUTION `CalendarReference` (`/business-days/adjust` and
      `/business-days/add`) previously used the placeholder `"BANK_AE"`,
      which is not BIC-shaped (contains an underscore, 7 characters) and
      would now fail the new oneOf. Replaced with `"BOFAAE2X"`, an
      8-character value already used elsewhere in this document as the
      `BicCode` component's own example, so the worked examples stay
      internally consistent.


    ## v2.10.0 hardening notes (round 16)

    - Fixed a self-inconsistency introduced by the v2.9.0 `oneOf`: it
      constrained `CalendarReference.code` to `CountryCode` (strict
      `^[A-Z]{2}$`) for COUNTRY/FINANCIAL_CENTER, which contradicts this
      document's own v2.8.0 decision (see `CalendarCode`'s description)
      that a COUNTRY calendar identifier is NOT confirmed to always equal
      the 2-letter country code. `GET /countries/{code}` can legally
      return `defaultCountryCalendarCode: "AE_FEDERAL"` (that field
      references `CalendarCode`, not `CountryCode`, precisely to allow
      this) -- but v2.9.0's `CalendarReference.code` would then have
      rejected that same value if a caller fed it into a calculation
      request, contradicting the open-policy stance this document itself
      already committed to. Fixed by using `CalendarCode` (not
      `CountryCode`) for COUNTRY and FINANCIAL_CENTER on
      `CalendarReference.code`. Since `CalendarCode`'s pattern
      (`^[A-Z0-9._-]+$`) already accepts settlement-system identifiers like
      `USD_FEDWIRE`/`EUR_TARGET2` without modification, CURRENCY_CLEARING
      now shares that same branch too, instead of being left with no
      format constraint at all as in v2.9.0. `CalendarCodePath`'s
      description corrected to match. Only INSTITUTION keeps a distinct
      branch (`BicCode`) -- a BIC has an internationally standardized
      structure that the generic `CalendarCode` should not be loosened to
      match. See design doc 3.61.
    - Extended the same two-branch `oneOf` (`CalendarCode` for COUNTRY/
      FINANCIAL_CENTER/CURRENCY_CLEARING, `BicCode` for INSTITUTION) to
      `CalendarVersionRef.code` and `CalendarAssessment.code`, closing the
      v2.9.0 hardening notes' named follow-up (deferred at the time because
      `CalendarAssessment` already carried two independent `allOf`-wrapped
      `oneOf` groups and a third seemed riskier before the design settled).
      Added as a THIRD, fully independent `allOf` member on
      `CalendarAssessment` rather than folded into either existing group,
      since it constrains different properties and therefore cannot
      interfere with them; verified all 5 pre-existing round-6
      `CalendarAssessment` test cases plus this addition's own new cases
      before finalizing. See design doc 3.62.
    - Versioning note (see design doc 3.63): this is a LOOSENING of
      v2.9.0's own COUNTRY/FINANCIAL_CENTER constraint (accepts a superset
      of what v2.9.0 accepted), not a tightening -- any request that
      validated under v2.9.0's `CalendarReference` still validates
      unchanged under v2.10.0. Bumped as a normal minor version per this
      document's existing practice (every round with a real schema change
      bumps the version; none have used a major-version bump so far), on
      the basis that this whole document is still in pre-release design
      review with no external consumers yet -- see design doc 3.63 for the
      full discussion of when a major bump would actually be warranted.
  version: "2.10.0"
servers:
  - url: https://standing.internal.bank/api/v1

tags:
  - name: BusinessDayCalculation
    description: Calendar-aware date adjustment and arithmetic
  - name: Calendars
    description: Holiday/weekend calendar reference data
  - name: ReferenceData
    description: Currency and Country master data

security:
  - oauth2: [standing.calendars.read]

paths:

  /business-days/adjust:
    post:
      tags: [BusinessDayCalculation]
      summary: Adjust a source date to the nearest valid business day
      description: >
        Given a source date already derived by the caller (e.g. a
        Contractual Maturity Date computed from Tenor Basis + Tenor Period),
        applies the specified business day convention across the specified
        set of calendars, combined per combinationRule, and returns the
        adjusted date together with a full per-calendar assessment.


        This endpoint performs ONLY calendar adjustment. It never computes or
        overwrites `sourceDate` itself, and never changes Contractual
        Maturity Date -- see the service-level scope boundary above.


        ### Fail-closed behavior

        The following conditions cause a non-2xx rejection rather than a
        best-effort guess: a required calendar is not configured
        (`CALENDAR_NOT_CONFIGURED`, 422); the calculation window reaches into
        a year/period the calendar has not been loaded for
        (`CALENDAR_YEAR_NOT_AVAILABLE`, 422); the pinned
        `calendarSnapshotId`/`calendarVersions` reference a version that is
        not approved (`CALENDAR_VERSION_NOT_APPROVED`, 422) or does not exist
        (`CALENDAR_VERSION_NOT_AVAILABLE`, 422); an ad hoc closure conflicts
        with the base calendar for the same date
        (`CALENDAR_CONFLICT`, 409); calendar data has exceeded the bank's
        staleness policy threshold (`CALENDAR_DATA_STALE`, 503); **any date
        actually evaluated in the course of this calculation carries
        reasonCode=FORCE_MAJEURE_EVENT AND closureStatus=ACTIVE (or
        closureStatus omitted, which defaults to ACTIVE)**
        (`MANUAL_REVIEW_REQUIRED`, 422) -- round-4 review broadened this
        from "sourceDate OR adjustedDate only" to the full evaluated
        window, i.e. sourceDate, adjustedDate, AND every date that would
        otherwise appear in `skippedDates` between them (a force-majeure
        closure on an intermediate rolled-past date is just as much a
        manual-review trigger as one on the start or end date); round-5
        review added the closureStatus qualifier so a date whose
        force-majeure closure has since been marked RESOLVED or CANCELLED
        does not perpetually block this calculation -- see `ClosureStatus`.
        This endpoint never returns 200 with a computed adjustedDate for an
        ACTIVE force-majeure date, precisely so a force-majeure-affected
        date cannot silently reach an automatic payment flow; the offending
        date and calendar are included in the error's `details`, and the
        actual date must be resolved through a separate, explicitly
        human-reviewed process outside this endpoint's contract.
      operationId: adjustBusinessDay
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ConsumerSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustBusinessDayRequest'
            examples:
              christmasRollover:
                summary: >
                  Worked example (Trade Finance Maturity Date Baseline,
                  Section 7): Contractual Maturity Date falls on Christmas
                  Day; paying bank is open, USD clearing is closed for the
                  following weekend too.
                value:
                  sourceDate: "2026-12-25"
                  sourceDateType: CONTRACTUAL_MATURITY_DATE
                  calculationPurpose: OPERATIONAL_PAYMENT_DATE
                  currency: "USD"
                  calendars:
                    - calendarType: INSTITUTION
                      code: "BOFAAE2X"
                      role: PAYING_BANK
                      required: true
                    - calendarType: CURRENCY_CLEARING
                      code: "USD_FEDWIRE"
                      role: CURRENCY_CLEARING
                      required: true
                  combinationRule: ALL_REQUIRED_OPEN
                  convention: FOLLOWING
                  calendarSnapshotId: "CAL-SNAPSHOT-20261220-001"
      responses:
        '200':
          description: Adjustment computed successfully
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustBusinessDayResponse'
              examples:
                christmasRollover:
                  summary: Response for the worked example above
                  value:
                    calculationId: "CALC-20261220-000145"
                    sourceDate: "2026-12-25"
                    sourceDateType: CONTRACTUAL_MATURITY_DATE
                    calculationPurpose: OPERATIONAL_PAYMENT_DATE
                    adjustedDate: "2026-12-28"
                    wasAdjusted: true
                    adjustmentDays: 3
                    contractualDateChanged: false
                    combinationRuleApplied: ALL_REQUIRED_OPEN
                    conventionApplied: FOLLOWING
                    calendarSnapshotId: "CAL-SNAPSHOT-20261220-001"
                    calendarVersions:
                      - calendarType: INSTITUTION
                        code: "BOFAAE2X"
                        version: "2026.12.10"
                      - calendarType: CURRENCY_CLEARING
                        code: "USD_FEDWIRE"
                        version: "2026.11.20"
                    calendarAssessments:
                      - calendarType: INSTITUTION
                        code: "BOFAAE2X"
                        role: PAYING_BANK
                        date: "2026-12-25"
                        businessDay: true
                        calendarVersion: "2026.12.10"
                      - calendarType: CURRENCY_CLEARING
                        code: "USD_FEDWIRE"
                        role: CURRENCY_CLEARING
                        date: "2026-12-25"
                        businessDay: false
                        reasonCode: PUBLIC_HOLIDAY
                        reasonDescription: "Christmas Day"
                        calendarVersion: "2026.11.20"
                    adjustedDateAssessments:
                      - calendarType: INSTITUTION
                        code: "BOFAAE2X"
                        role: PAYING_BANK
                        date: "2026-12-28"
                        businessDay: true
                        calendarVersion: "2026.12.10"
                      - calendarType: CURRENCY_CLEARING
                        code: "USD_FEDWIRE"
                        role: CURRENCY_CLEARING
                        date: "2026-12-28"
                        businessDay: true
                        calendarVersion: "2026.11.20"
                    skippedDates:
                      - date: "2026-12-25"
                        reasonCode: PUBLIC_HOLIDAY
                        reasonDescription: "USD_FEDWIRE: Christmas Day"
                      - date: "2026-12-26"
                        reasonCode: WEEKEND
                        reasonDescription: "USD_FEDWIRE: Weekend"
                      - date: "2026-12-27"
                        reasonCode: WEEKEND
                        reasonDescription: "USD_FEDWIRE: Weekend"
                    calculationWindowStartDate: "2026-12-25"
                    calculationWindowEndDate: "2026-12-28"
                    warnings: []
        '400':
          description: >
            Invalid request: bad date format, invalid calendar reference,
            invalid combination rule, illegal sourceDateType/
            calculationPurpose pairing (INVALID_DATE_PURPOSE_COMBINATION),
            or both calendarSnapshotId and asOfDateTime supplied
            (MUTUALLY_EXCLUSIVE_CALENDAR_VERSION_INPUTS)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Missing or invalid access token (errorCode AUTHENTICATION_REQUIRED)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: >
            Token lacks a required scope -- specifically
            INSUFFICIENT_CALENDAR_SCOPE when `calendars[]` includes a
            calendarType=INSTITUTION entry but the token does not carry
            `standing.calendars.institution.read`. Enforced by the API
            Gateway/authorization layer against request-body content, since
            OpenAPI's static `security:` declaration cannot condition a
            scope requirement on body content -- see the oauth2
            securityScheme description.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Ad hoc closure conflicts with base calendar data for the same date
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: >
            Required calendar missing, unavailable, or version not
            approved; or an ANY_ELIGIBLE_OPEN request with no pathGroup
            present (INCOMPLETE_PAYMENT_PATH_GROUP) or with pathGroup
            values that do not form a policy-approved path
            (INVALID_PAYMENT_PATH_GROUP); or a force-majeure closure affects
            sourceDate/adjustedDate (startDate/resultDate for
            /business-days/add) (MANUAL_REVIEW_REQUIRED) -- see the
            fail-closed behavior note above
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Calendar data stale beyond policy threshold, or upstream calendar store timeout
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /business-days/add:
    post:
      tags: [BusinessDayCalculation]
      summary: Add (or subtract) N business days to a start date
      description: >
        Computes startDate +/- N business days under the specified
        calendar(s), skipping non-business days. Primary use case: UCP 600
        Article 14(b) examination-period calculations ("5 banking days"),
        which MUST use the calendar of the bank actually responsible for
        examining the presentation -- never the USD clearing calendar or a
        generic country calendar as a substitute.


        `includeStartDate` controls whether startDate itself counts as day
        zero of the count when it is already a business day (default
        `false`: count begins the next business day after startDate).
        `nonBusinessStartDateConvention` controls how a non-business
        startDate is treated before counting begins (default
        `FOLLOWING`: roll startDate forward to the first business day, then
        count from there). `businessDays: 0` returns startDate itself,
        rolled per `nonBusinessStartDateConvention` if it falls on a
        non-business day. Negative `businessDays` counts backward.


        ### Fail-closed behavior

        Same fail-closed policy as /business-days/adjust applies, over the
        same broadened window (round-4 review) and with the same
        closureStatus qualifier (round-5 review): if any date actually
        evaluated -- startDate, resultDate, OR any intermediate date that
        would otherwise appear in `skippedDates` -- carries
        reasonCode=FORCE_MAJEURE_EVENT AND closureStatus=ACTIVE (or
        omitted), this endpoint does not return 200 with a computed
        resultDate -- it rejects with `422 MANUAL_REVIEW_REQUIRED` instead.
      operationId: addBusinessDays
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ConsumerSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBusinessDaysRequest'
            examples:
              examinationPeriod:
                summary: UCP 600 Art.14(b) -- 5 banking days from presentation
                value:
                  startDate: "2026-12-24"
                  businessDays: 5
                  includeStartDate: false
                  nonBusinessStartDateConvention: FOLLOWING
                  calendars:
                    - calendarType: INSTITUTION
                      code: "BOFAAE2X"
                      role: PAYING_BANK
                      required: true
                  combinationRule: ALL_REQUIRED_OPEN
      responses:
        '200':
          description: Result computed successfully
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddBusinessDaysResponse' }
        '400':
          description: >
            Invalid request, including both calendarSnapshotId and
            asOfDateTime supplied
            (MUTUALLY_EXCLUSIVE_CALENDAR_VERSION_INPUTS)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Missing or invalid access token (errorCode AUTHENTICATION_REQUIRED)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: >
            Token lacks the INSTITUTION scope required by an
            INSTITUTION-type calendar in `calendars[]`
            (INSUFFICIENT_CALENDAR_SCOPE) -- see the equivalent response on
            /business-days/adjust for the enforcement mechanism.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Ad hoc closure conflicts with base calendar data for the same date
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: >
            Required calendar missing, unavailable, or version not
            approved; or an ANY_ELIGIBLE_OPEN request with no pathGroup
            present (INCOMPLETE_PAYMENT_PATH_GROUP) or with pathGroup
            values that do not form a policy-approved path
            (INVALID_PAYMENT_PATH_GROUP); or a force-majeure closure affects
            sourceDate/adjustedDate (startDate/resultDate for
            /business-days/add) (MANUAL_REVIEW_REQUIRED) -- see the
            fail-closed behavior note above
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Calendar data stale beyond policy threshold, or upstream calendar store timeout
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /calendars/{calendarType}/{code}/is-business-day:
    get:
      tags: [Calendars]
      summary: Check whether a single date is a business day under one calendar
      operationId: isBusinessDay
      parameters:
        - $ref: '#/components/parameters/CalendarTypePath'
        - $ref: '#/components/parameters/CalendarCodePath'
        - $ref: '#/components/parameters/CorrelationId'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: calendarVersion
          in: query
          required: false
          schema: { type: string }
          description: Pin to a specific approved calendar version (defaults to latest approved)
      responses:
        '200':
          description: Result
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [date, isBusinessDay, calendarVersion]
                properties:
                  date: { type: string, format: date }
                  isBusinessDay: { type: boolean }
                  reasonCode: { $ref: '#/components/schemas/ReasonCode' }
                  reasonDescription: { type: string, example: "National Day" }
                  calendarVersion: { type: string }
        '401':
          description: Missing or invalid access token (errorCode AUTHENTICATION_REQUIRED)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: >
            Token lacks `standing.calendars.institution.read` while
            calendarType=INSTITUTION (INSUFFICIENT_CALENDAR_SCOPE)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: >
            Calendar not configured -- the calendarType/code pair itself is
            unknown (errorCode CALENDAR_NOT_FOUND, round-5 fix: distinct
            from CALENDAR_NOT_CONFIGURED which is reserved for 422 "a
            calculation is missing a required calendar"), as distinct from
            422 below where the calendar exists but lacks data for the
            requested date
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      errorCode:
                        enum: [CALENDAR_NOT_FOUND]
                    description: >
                      Round-12: schema-narrows errorCode for THIS response
                      to CALENDAR_NOT_FOUND only, on top of the full
                      ErrorResponse component -- a 404 here claiming
                      CURRENCY_NOT_FOUND/COUNTRY_NOT_FOUND (or any other
                      enum member) is itself schema-invalid, not just
                      undocumented.
        '422':
          description: >
            Calendar exists but data is not available for the requested
            date (errorCode CALENDAR_YEAR_NOT_AVAILABLE, round-13 fix:
            previously this response only referenced the shared
            ErrorResponse schema with no errorCode narrowed to this one
            condition -- inconsistent with how this spec's 404 responses
            were already narrowed in round 12. CALENDAR_YEAR_NOT_AVAILABLE
            is reused rather than a new code minted, since it is already
            reserved elsewhere in this document for the identical
            condition on /business-days/adjust and /business-days/add)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      errorCode:
                        enum: [CALENDAR_YEAR_NOT_AVAILABLE]
                    description: >
                      Round-13: schema-narrows errorCode for THIS response
                      to CALENDAR_YEAR_NOT_AVAILABLE only, on top of the
                      full ErrorResponse component, matching the round-12
                      narrowing pattern used on this spec's 404 responses.

  /calendars/{calendarType}/{code}/holidays:
    get:
      tags: [Calendars]
      summary: List holidays/non-business days for a calendar within a date range
      description: >
        Used for UI display, Impact Report generation after a calendar
        update, and completeness/gap checks. By default only APPROVED
        calendar entries are returned.
        Round-13 addition: `to` minus `from` MUST NOT exceed 366 days.
        SERVER-ENFORCED, NOT SCHEMA-ENFORCED -- OAS 3.0.3's Draft-4-
        compatible Schema Object cannot compare the VALUES of two sibling
        query parameters to each other (that needs `if`/`then` with date
        arithmetic, draft-07+), so this ceiling cannot be expressed as a
        declarative constraint here; only the shape of the resulting `400`
        error response below is a schema contract. A request exceeding the
        limit is rejected with `400 INVALID_DATE_RANGE` rather than
        silently truncating or timing out. Pagination
        (`page`/`pageSize`/`nextPageToken`) was considered as an
        alternative during round-13 review but is deliberately NOT added
        here -- see the design document's follow-up section for why this
        was deferred rather than added unprompted.
      operationId: listHolidays
      parameters:
        - $ref: '#/components/parameters/CalendarTypePath'
        - $ref: '#/components/parameters/CalendarCodePath'
        - $ref: '#/components/parameters/CorrelationId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: calendarVersion
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: List of holidays/non-business days
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [calendarType, code, calendarVersion, dataCompleteThrough, holidays]
                properties:
                  calendarType: { $ref: '#/components/schemas/CalendarType' }
                  code: { type: string }
                  calendarVersion: { type: string }
                  dataCompleteThrough:
                    type: string
                    format: date
                    description: Latest date this calendar has confirmed (approved) data for
                  holidays:
                    type: array
                    items: { $ref: '#/components/schemas/Holiday' }
        '401':
          description: Missing or invalid access token (errorCode AUTHENTICATION_REQUIRED)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: >
            Token lacks `standing.calendars.institution.read` while
            calendarType=INSTITUTION (INSUFFICIENT_CALENDAR_SCOPE)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: >
            Calendar not configured -- the calendarType/code pair itself is
            unknown (errorCode CALENDAR_NOT_FOUND, round-5 fix: split out
            from CALENDAR_NOT_CONFIGURED, which is reserved for 422 "a
            calculation is missing a required calendar" -- see the
            errorCode enum description for why these needed to be two
            different codes rather than one code at two different statuses)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      errorCode:
                        enum: [CALENDAR_NOT_FOUND]
                    description: >
                      Round-12: schema-narrows errorCode for THIS response
                      to CALENDAR_NOT_FOUND only, on top of the full
                      ErrorResponse component -- a 404 here claiming
                      CURRENCY_NOT_FOUND/COUNTRY_NOT_FOUND (or any other
                      enum member) is itself schema-invalid, not just
                      undocumented.
        '400':
          description: >
            Requested date range (`to` minus `from`) exceeds the documented
            maximum of 366 days (errorCode INVALID_DATE_RANGE, round-13
            addition). The 366-day ceiling itself is SERVER-ENFORCED (see
            this operation's description for why OAS 3.0.3 cannot express
            a cross-parameter date-arithmetic comparison declaratively);
            only this response's shape is a schema contract.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      errorCode:
                        enum: [INVALID_DATE_RANGE]
                    description: >
                      Round-13: schema-narrows errorCode for THIS response
                      to INVALID_DATE_RANGE only, on top of the full
                      ErrorResponse component.

