          description: Country reference data
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - name
                  - defaultCountryCalendarCode
                  - weekendDays
                  - effectiveFrom
                  - calendarVersion
                  - lastApprovedAt
                  - sourceAuthority
                properties:
                  code: { $ref: '#/components/schemas/CountryCode' }
                  name: { type: string, example: "United Arab Emirates" }
                  defaultCountryCalendarCode:
                    allOf:
                      - $ref: '#/components/schemas/CalendarCode'
                    description: >
                      Round-14 fix: previously referenced (via `$ref`)
                      `CountryCode` directly, which assumed a country's default COUNTRY
                      calendar identifier always equals its own 2-letter
                      country code -- an unconfirmed product-policy
                      assumption, not a fact this document can assert.
                      Loosened to the more general `CalendarCode`
                      component (`^[A-Z0-9._-]+$`, 2-50 chars), which still
                      permits "AE" but no longer REQUIRES the value to be
                      exactly 2 letters. If product policy later confirms
                      Country Calendar IDs are always structurally equal
                      to the ISO alpha-2 country code, this can be
                      tightened back to `CountryCode` at that point.
                  weekendDays:
                    type: array
                    minItems: 1
                    maxItems: 3
                    uniqueItems: true
                    items: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] }
                    example: ["SAT", "SUN"]
                    description: >
                      Round-13: added minItems:1/maxItems:3/uniqueItems:true
                      -- previously an empty array, a duplicated day (e.g.
                      ["SAT","SAT"]), or all seven days as "weekend" were
                      all schema-legal nonsense. maxItems:3 accommodates
                      every real-world weekend pattern this spec is aware
                      of (1 day, e.g. Nepal Saturday-only; 2 days, e.g.
                      Saudi Arabia Friday/Saturday; 3 days, e.g. a Sharjah
                      government Friday-Sunday pattern).
                      Round-12 fix: the AE (United Arab Emirates) example
                      above previously showed ["FRI", "SAT"], which was the
                      UAE's federal public-sector weekend before 2022-01-01.
                      Since 2022-01-01 the UAE federal weekend is Saturday/
                      Sunday (Monday-Friday working week) -- the example is
                      corrected to ["SAT", "SUN"] to avoid readers copying a
                      pre-2022 value as if it were current. This field is a
                      per-country CURRENT snapshot returned by this
                      endpoint, not a versioned history: a country's
                      weekendDays can legitimately change over time (as AE's
                      did), and this endpoint always reflects whichever
                      COUNTRY calendar version is presently approved/current
                      -- see calendarVersion elsewhere in this spec for how
                      versioned calendar data is generally modeled, and 3.45
                      in the design doc for why full pre/post-2022
                      version-aware querying of weekendDays specifically is
                      NOT added as a new request parameter here. Distinct
                      INSTITUTION/FINANCIAL_CENTER calendars for the same
                      country are not required to share this same weekend
                      definition and are looked up independently.
                  effectiveFrom:
                    type: string
                    format: date
                    example: "2022-01-01"
                    description: >
                      Round-13 addition (P2-1): the date this CURRENT
                      snapshot's `weekendDays`/governance values took
                      effect. For AE this is "2022-01-01". Read-only
                      descriptive metadata about the current value; it is
                      NOT a request parameter for querying a past value --
                      historical re-calculation still goes through the
                      COUNTRY calendar's `calendarVersion`/`asOfDateTime`
                      mechanism on the `/calendars/...` endpoints.
                  calendarVersion:
                    type: string
                    example: "AE-2022.01"
                    description: >
                      Round-13 addition (P2-1): identifies which underlying
                      COUNTRY calendar version this snapshot's governance
                      fields (weekendDays, effectiveFrom, lastApprovedAt,
                      sourceAuthority) were taken from, so a caller can
                      cross-reference against the same calendarVersion
                      value used elsewhere in this spec (e.g.
                      CalendarVersionRef) without a separate lookup.
                  lastApprovedAt:
                    type: string
                    format: date-time
                    example: "2026-08-01T10:00:00Z"
                    description: >
                      Round-13 addition (P2-1): when this snapshot's
                      governance data was last approved. Same format/intent
                      as `lastApprovedAt` on GET .../completeness.
                  sourceAuthority:
                    type: string
                    pattern: '^[A-Z][A-Z0-9_]{2,49}$'
                    example: "UAE_GOVERNMENT"
                    description: >
                      Round-13 addition (P2-1): identifies whose authority
                      this reference data is sourced from (e.g.
                      "UAE_GOVERNMENT", "UAE_CENTRAL_BANK"). Kept as a
                      pattern-constrained free string rather than a closed
                      `enum` because the full set of source authorities
                      across all countries this endpoint could ever serve
                      is not yet enumerable from this document alone; an
                      `enum` will be considered once that taxonomy is
                      defined by product/ops, per this spec's general
                      practice of not fabricating enum coverage it cannot
                      verify.
        '401':
          description: Missing or invalid access token (errorCode AUTHENTICATION_REQUIRED)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: >
            Country not found -- the country code itself is unknown
            (errorCode COUNTRY_NOT_FOUND, round-12 fix: previously this
            response only referenced (via $ref) the shared ErrorResponse schema with no
            enum member it could legally use other than CALENDAR_NOT_FOUND,
            which is reserved for the three Calendars GET endpoints and
            would misdescribe a missing country as a missing calendar)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      errorCode:
                        enum: [COUNTRY_NOT_FOUND]
                    description: >
                      Round-12: schema-narrows errorCode for THIS response
                      to COUNTRY_NOT_FOUND only, on top of the full
                      ErrorResponse component.

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >
        Client-credentials OAuth2, terminated at the API gateway; mTLS is
        additionally enforced at the network layer for service-to-service
        calls (gateway policy, not modeled in this document).


        MANDATORY GATEWAY/MIDDLEWARE RULE (cannot be expressed as a static
        OpenAPI `security:` declaration, since that cannot condition a scope
        requirement on request-body or path-parameter content): every
        request where calendarType=INSTITUTION appears anywhere relevant to
        the call -- as the `{calendarType}` path parameter on the Calendars
        GET endpoints, or as the `calendarType` of any entry in the
        `calendars[]` array of a /business-days/adjust or
        /business-days/add request body -- MUST additionally carry the
        `standing.calendars.institution.read` scope. The gateway/application
        layer MUST reject a request that touches an INSTITUTION calendar
        without this scope with `403 INSUFFICIENT_CALENDAR_SCOPE` BEFORE the
        request reaches the calculation logic; it must not be treated as
        equivalent to `standing.calendars.read` under any circumstance,
        since institution-level closure data may be commercially sensitive.
        This document declares the 401/403 responses and the
        INSUFFICIENT_CALENDAR_SCOPE error code on every affected operation
        so the contract states the failure mode precisely, but the actual
        scope check is implemented in the gateway/service, not by OpenAPI's
        `security:` mechanism.
      flows:
        clientCredentials:
          tokenUrl: https://auth.internal.bank/oauth2/token
          scopes:
            standing.calendars.read: Read currency/country/calendar reference data and perform business-day calculations
            standing.calendars.institution.read: Read INSTITUTION-type calendar data

  headers:
    CorrelationId:
      description: Echoes the caller's X-Correlation-ID, or the server-generated equivalent if the caller omitted it. Present on every response (success and error) from every endpoint.
      required: true
      schema: { type: string }

  parameters:
    CalendarTypePath:
      name: calendarType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CalendarType' }
    CalendarCodePath:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: >
        Calendar code (country/financial-center calendar identifier,
        settlement-system identifier, or institution BIC, depending on
        calendarType). SERVER-ENFORCED, NOT SCHEMA-ENFORCED: the expected
        shape is conditional on the sibling `calendarType` PATH PARAMETER --
        `CalendarCode`'s permissive `^[A-Z0-9._-]+$` when COUNTRY,
        FINANCIAL_CENTER, or CURRENCY_CLEARING, `BicCode`'s
        `^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$` when INSTITUTION --
        and OAS 3.0.3's Draft-4-compatible subset has no `if`/`then`
        (draft-07+) to express a pattern that depends on another
        parameter's value, let alone across two separate Parameter Objects.
        Unlike `CalendarReference.code` (see `CalendarReference`'s own
        description and design doc 3.56/3.61), this specific
        cross-parameter case genuinely CANNOT be fixed by moving to
        `oneOf` either, no matter the OAS/JSON-Schema version:
        `calendarType` and `code` here are two independent Parameter
        Objects, not two properties of one schema object, and `oneOf`/
        `if`/`then` only ever constrain properties within a single schema.
        This field therefore stays a plain string here; the service is
        expected to validate it against the matching component
        (`CalendarCode`/`BicCode`) once calendarType is known.
        Round-15 correction (self-caught, not a reviewer finding): this
        description previously claimed CURRENCY_CLEARING codes follow
        `CurrencyCode`'s `^[A-Z]{3}$` pattern. That was wrong -- it
        contradicted `CalendarType`'s own description and every worked
        example in this spec, where a CURRENCY_CLEARING code names a
        settlement SYSTEM (e.g. `USD_FEDWIRE`, `EUR_TARGET2`), not a bare
        ISO 4217 currency code. `CurrencyCode` (`^[A-Z]{3}$`) remains
        correctly used elsewhere in this spec for actual currency codes
        (e.g. `GET /currencies/{code}`) -- it was only ever wrong to apply
        it to CURRENCY_CLEARING calendar codes specifically.
        Round-16 correction: this description previously claimed
        `CountryCode`'s strict `^[A-Z]{2}$` for COUNTRY/FINANCIAL_CENTER,
        matching what `CalendarReference.code` did at the time. Both were
        wrong for the same reason -- see `CalendarReference`'s own
        description and design doc 3.61 -- so both were corrected together
        to `CalendarCode` (which also already covers CURRENCY_CLEARING's
        settlement-system identifiers without a separate carve-out).
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string }
      description: Caller-supplied correlation ID, propagated into calculationId-linked audit records and echoed in error responses. Generated server-side if omitted.
    ConsumerSystem:
      name: X-Consumer-System
      in: header
      required: false
      schema: { type: string, example: "TRADE_FINANCE" }
      description: Identifies the calling business system, for audit and per-system rate limiting.

  schemas:
    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      example: "AE"
      description: >
        ISO 3166-1 alpha-2 country code, upper-case. Round-13 addition:
        used only where a field is UNAMBIGUOUSLY a country code (GET
        /countries/{code}'s path parameter and its response `code`) -- not
        for `CalendarReference.code` or `CalendarVersionRef.code`/
        `CalendarAssessment.code`, which are polymorphic across
        calendarType and cannot take a single fixed pattern declaratively
        (see CalendarCodePath). Round-14 fix: also NOT used for
        `defaultCountryCalendarCode` any more -- see `CalendarCode` and
        that field's own description for why a country's default COUNTRY
        calendar identifier is not guaranteed to equal a 2-letter country
        code (e.g. a country needing a country-level default distinct from
        a sub-national one, like a hypothetical "AE_FEDERAL").

    CalendarCode:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[A-Z0-9._-]+$'
      example: "AE"
      description: >
        Round-14 addition. A generic calendar identifier -- deliberately
        NOT constrained to look like an ISO country/currency code, because
        round-14 review correctly pointed out that round 13's choice of
        `defaultCountryCalendarCode: { $ref: CountryCode }` silently
        assumed every country's default COUNTRY calendar is identified by
        its own 2-letter country code, which is only an assumption, not a
        confirmed product policy -- a real deployment might need calendar
        identifiers like "AE_FEDERAL", "MY_KEDAH", or "IL_BANKING" that do
        not fit `CountryCode`'s `^[A-Z]{2}$` pattern at all. Used for
        `defaultCountryCalendarCode` pending an explicit product-policy
        confirmation of whether Country Calendar IDs are always,
        structurally, equal to the ISO alpha-2 country code (see that
        field's own description and the design document's discussion of
        this open question).

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      example: "USD"
      description: >
        ISO 4217 alphabetic currency code, upper-case. Round-13 addition:
        used only where a field is UNAMBIGUOUSLY a currency code (GET
        /currencies/{code}'s path parameter and its response `code`) -- see
        the CountryCode description above for why this is not applied to
        the polymorphic calendar-reference `code` fields.

    BicCode:
      type: string
      pattern: '^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$'
      example: "BOFAAE2X"
      description: >
        ISO 9362 Business Identifier Code, structured per SWIFT's own BIC
        definition: 4-character party/bank prefix (alphanumeric), 2-letter
        ISO 3166-1 alpha-2 country code (letters ONLY), 2-character
        location code (alphanumeric), optionally followed by a
        3-character branch code (alphanumeric). Round-14 fix: the pattern
        previously shipped in round 13 (`^[A-Z0-9]{8}([A-Z0-9]{3})?$`)
        treated all 8 core characters as generic alphanumeric, which
        wrongly ACCEPTED values like "12345678" or "BANK12XX" where the
        country-code positions (5-6) are digits -- structurally impossible
        for a real BIC. Corrected to
        `^[A-Z0-9]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$`, which forces
        positions 5-6 to be letters. NOTE: a regex can only check that
        positions 5-6 are letters, not that they form a country code that
        actually exists in ISO 3166-1 (e.g. "BOFAZZ2X" still matches this
        pattern even though "ZZ" is not a real country) -- verifying the
        country code is a real, currently-assigned ISO 3166-1 value
        remains SERVER-ENFORCED, the same category of gap as everywhere
        else in this document where a regex cannot fully express a
        real-world reference-data constraint.
        Round-13 addition, still true after the round-14 pattern fix: not
        currently applied to any field in this spec's schema, because the
        only place a BIC appears
        (`CalendarReference.code`/`CalendarVersionRef.code`/
        `CalendarAssessment.code` when calendarType=INSTITUTION) is a
        polymorphic `code` property shared with COUNTRY/CURRENCY_CLEARING/
        FINANCIAL_CENTER calendars, whose own code shapes differ -- see
        CalendarCodePath for why OAS 3.0.3 cannot express a
        calendarType-conditional pattern declaratively. This component is
        defined now so that a future INSTITUTION-specific endpoint (were
        one added) has a ready-made, reviewed pattern to reference, and so
        that the service's own SERVER-ENFORCED validation of `code` when
        calendarType=INSTITUTION has one canonical pattern to implement
        against rather than each consumer inventing its own.

    CalendarType:
      type: string
      enum: [COUNTRY, CURRENCY_CLEARING, INSTITUTION, FINANCIAL_CENTER]
      description: >
        COUNTRY = national public holiday calendar.
        CURRENCY_CLEARING = the settlement-system calendar for a currency
        (e.g. USD_FEDWIRE, EUR_TARGET2) -- may differ from the country
        calendar of the currency's issuing country.
        INSTITUTION = a specific bank/branch's observed closures, keyed by BIC.
        FINANCIAL_CENTER = a sub-national or city-level calendar for
        countries where holidays are not uniform nationwide.

    CalendarRole:
      type: string
      enum: [PAYING_BANK, CURRENCY_CLEARING, CORRESPONDENT_BANK, ISSUING_BANK, CONFIRMING_BANK, OTHER]
      description: Business role this calendar plays in the transaction. Informational only -- does not affect the calculation, but is echoed back for audit-trail attribution.

    CalendarReference:
      type: object
      required: [calendarType, code, role]
      description: >
        Round-15 fix: `code`'s format is schema-enforced, conditional on the
        sibling `calendarType` property, via the `oneOf` block below --
        correcting an over-broad claim in this document's own v2.7.0
        hardening notes (round 13), which stated that OAS 3.0.3 could not
        express this conditional pattern "as a single declarative
        constraint" and used that to justify leaving `code` a bare string.
        That reasoning conflated two different things: a single `pattern`
        cannot vary by a sibling field's value (true, needs `if`/`then`,
        draft-07+), but a discriminated UNION of whole-object shapes CAN be
        expressed today with `oneOf`, because `calendarType` and `code` are
        two properties of the SAME schema object here -- unlike the
        genuinely cross-parameter case on `CalendarCodePath` (a standalone
        Parameter Object with no sibling to condition on), which remains
        SERVER-ENFORCED regardless of OAS/JSON-Schema version. See design
        doc 3.56 for the original correction.
        Round-16 fix (see design doc 3.61): the round-15 version of this
        `oneOf` constrained COUNTRY/FINANCIAL_CENTER's `code` to
        `CountryCode` (strict 2-letter ISO), which contradicted this
        document's OWN round-14 decision (see `CalendarCode`'s description)
        that a COUNTRY calendar identifier is NOT confirmed to always equal
        the 2-letter country code -- `GET /countries/{code}` can legally
        return `defaultCountryCalendarCode: "AE_FEDERAL"`, which the
        round-15 `oneOf` would then have wrongly rejected if a caller fed
        that exact value back into a `CalendarReference`. Re-tightening
        `CalendarReference.code` to `CountryCode` re-introduced the very
        assumption `CalendarCode` was created to avoid deciding. Fixed by
        using `CalendarCode` (not `CountryCode`) for COUNTRY and
        FINANCIAL_CENTER here too -- and, since `CalendarCode`'s permissive
        pattern (`^[A-Z0-9._-]+$`) already accepts settlement-system
        identifiers like `USD_FEDWIRE`/`EUR_TARGET2` without modification,
        CURRENCY_CLEARING now shares the same branch instead of being left
        with no format constraint at all. Only INSTITUTION keeps its own,
        genuinely different branch: a BIC has an internationally
        standardized structure (`BicCode`) that a generic identifier
        component should not be loosened to match.
      oneOf:
        - properties:
            calendarType: { enum: [COUNTRY, FINANCIAL_CENTER, CURRENCY_CLEARING] }
            code: { $ref: '#/components/schemas/CalendarCode' }
        - properties:
            calendarType: { enum: [INSTITUTION] }
            code: { $ref: '#/components/schemas/BicCode' }
      properties:
        calendarType: { $ref: '#/components/schemas/CalendarType' }
        code:
          type: string
          description: >
            Country/financial-center calendar identifier, settlement-system
            identifier, or institution BIC, depending on calendarType.
            Round-16 fix: the actual format is enforced by the `oneOf`
            block above -- `CalendarCode` (a permissive generic identifier,
            NOT assumed to equal a 2-letter ISO country code) for COUNTRY/
            FINANCIAL_CENTER/CURRENCY_CLEARING, `BicCode` for INSTITUTION.
            This property-level `type: string` is just the structural
            fallback; the real format constraint lives in the sibling
            `oneOf`, following the same layering style used elsewhere in
            this spec (e.g. `defaultCountryCalendarCode`'s `allOf`-wrapped
            `CalendarCode` reference -- which this now stays consistent
            with, by design).
        role: { $ref: '#/components/schemas/CalendarRole' }
        required:
          type: boolean
          default: true
          description: >
            Whether this calendar must independently be open for the date to
            be considered viable under ALL_REQUIRED_OPEN. Ignored when
            pathGroup is set on this entry.
        pathGroup:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z0-9._-]+$'
          description: >
            Groups this calendar with others into an alternative payment
            path for ANY_ELIGIBLE_OPEN evaluation. All calendars sharing the
            same pathGroup value must ALL be open for that path to count as
            viable; the date is viable if at least one pathGroup is fully
            open. A calendar without pathGroup is evaluated individually
            under ALL_REQUIRED_OPEN semantics regardless of the request's
            combinationRule -- i.e. mandatory legs (e.g. the paying bank)
            should be left ungrouped, and only genuine alternate routes
            (e.g. two eligible correspondent banks) should share a
            pathGroup.
            Round-13 fix: minLength:1/maxLength:50/pattern added -- an
            empty or whitespace-only pathGroup ("") was previously
            schema-legal and could be mistaken by a naive "field is
            present" server check for a real alternate path. This only
            catches the SHAPE of the value; whether a given pathGroup
            value actually resolves to a complete, policy-approved
            alternate path, and whether the same calendar repeats within
            one pathGroup, remain SERVER-ENFORCED -- see CombinationRule.

    CombinationRule:
      type: string
      enum: [ALL_REQUIRED_OPEN, ANY_ELIGIBLE_OPEN]
      description: >
        ALL_REQUIRED_OPEN: every calendar marked required=true (and every
        calendar in every pathGroup, per-group) must be open for the date to
        be viable -- this is the default/safe choice, and the one to use
        whenever there is a single mandatory settlement path (e.g. a single
        paying bank plus the currency's clearing system).
        ANY_ELIGIBLE_OPEN: the date is viable if at least one COMPLETE,
        product-policy-approved alternate path (a full pathGroup, all of
        whose calendars are open) exists, on top of any ungrouped
        required=true calendars which must always be open regardless.
        ANY_ELIGIBLE_OPEN must never be satisfied merely because "some
        institution somewhere is open" -- only a fully viable, policy-
        approved settlement path counts.
        SERVER-ENFORCED, NOT SCHEMA-ENFORCED: when combinationRule =
        ANY_ELIGIBLE_OPEN, the request MUST contain at least one calendar
        entry with `pathGroup` set, and every pathGroup value used must
        resolve to a complete, policy-approved alternate path (>= 1
        calendar); OpenAPI 3.0.3's Schema Object cannot express "at least
        one array item has property X" (that needs JSON Schema `contains`,
        draft-06+, which is outside the OAS 3.0.3 / Draft-4-compatible
        subset), so this is validated by the service itself, not by the
        published schema. A request that sets ANY_ELIGIBLE_OPEN with no
        pathGroup anywhere in `calendars[]` is rejected with
        `INCOMPLETE_PAYMENT_PATH_GROUP` (422). A request whose pathGroup
        values do not correspond to a product-policy-approved combination is
        rejected with `INVALID_PAYMENT_PATH_GROUP` (422). Round-13
        addition: the service must ALSO reject (as `INVALID_PAYMENT_PATH_
        GROUP`) a request where the same calendar (calendarType+code)
        appears more than once within the same pathGroup value -- this,
        like the "at least one complete group exists" rule above, needs an
        array-level existential/uniqueness check across sibling array
        items that OAS 3.0.3's Draft-4-compatible Schema Object cannot
        express, so it too is SERVER-ENFORCED, not schema-enforced. The
        `pathGroup` field's own `minLength`/`maxLength`/`pattern`
        (round 13) only rule out an empty or malformed VALUE, not a
        semantically invalid combination of values across array items.

    BusinessDayConvention:
      type: string
      enum: [FOLLOWING, PRECEDING, MODIFIED_FOLLOWING, MODIFIED_PRECEDING, NEAREST]
      description: >
        FOLLOWING/PRECEDING: roll forward/backward one day at a time until a
        viable business day is found under the request's calendars and
        combinationRule.
        MODIFIED_FOLLOWING: roll forward; if the resulting date crosses into
        the next calendar month, use MODIFIED_PRECEDING's rule (roll
        backward from the original date) instead. If that backward roll
        itself cannot find a viable date within the original month (e.g. an
        extended closure spans the whole tail of the month), the service
        rejects with CALENDAR_CONFLICT rather than silently crossing the
        month boundary -- this edge case must be resolved by policy
        exception, not a default.
        MODIFIED_PRECEDING: the mirror rule, rolling backward first and
        falling back to forward-rolling within the same month if needed,
        with the same reject-rather-than-guess behavior at the boundary.
        NEAREST: choose whichever of the nearest preceding/following viable
        business days is fewer calendar days away; on an exact tie, the
        service resolves to PRECEDING (documented, fixed tie-break --
        callers requiring the opposite tie-break should use PRECEDING or
        FOLLOWING explicitly instead of NEAREST).
        Whether a given convention is contractually permitted for a given
        product/tenor (e.g. whether PRECEDING may effectively shorten a
        tenor) is a Trade Finance product-policy decision, not something
        this service enforces -- the service will compute whatever
        convention it is asked for.

    ReasonCode:
      type: string
      enum:
        - PUBLIC_HOLIDAY
        - WEEKEND
        - AD_HOC_BANK_CLOSURE
        - CLEARING_SYSTEM_CLOSURE
        - PAYMENT_NETWORK_OUTAGE
        - FORCE_MAJEURE_EVENT
      description: >
        PUBLIC_HOLIDAY / WEEKEND: recurring, pre-approved annual calendar
        entries. AD_HOC_BANK_CLOSURE: an unplanned single-institution
        closure (e.g. a branch declares an unscheduled closure).
        CLEARING_SYSTEM_CLOSURE: an unplanned closure of a currency clearing
        system itself (distinct from the institution using it).
        PAYMENT_NETWORK_OUTAGE: a technical/network outage rather than a
        declared holiday -- typically short-notice and may later be
        reversed. FORCE_MAJEURE_EVENT: closures declared under
        extraordinary circumstances (natural disaster, civil unrest,
        government-declared emergency); these SHOULD also set
        `manualReviewRequired: true` on the corresponding
        CalendarAssessment, since automated straight-through processing of
        the resulting adjusted date may not be appropriate. (Superseded
        v2.1.0: the previous single `AD_HOC_CLOSURE` value is replaced by
        the four more specific values above so a consumer can distinguish
        "this bank happens to be shut" from "the whole clearing system/
        network is down" for its own escalation logic.)

    ClosureStatus:
      type: string
      enum: [ACTIVE, RESOLVED, CANCELLED]
      description: >
        Round-5 addition. ACTIVE: the closure is currently in effect and
        governs the date's business-day status. RESOLVED: the closure
        occurred and has ended (e.g. a force-majeure event that has since
        passed); the date's business-day status at the time is retained for
        audit even though the closure is no longer current. CANCELLED: the
        closure was declared but withdrawn before or without ever taking
        effect (e.g. an anticipated network outage that was averted).
        Absence of this field is equivalent to ACTIVE -- see the
        fail-closed behavior note wherever this appears.

    CalendarVersionRef:
      type: object
      required: [calendarType, code, version]
      description: >
        Round-16 addition (design doc 3.62, second half): `code`'s format is
        now enforced by the same `oneOf` used on `CalendarReference.code`
        (`CalendarCode` for COUNTRY/FINANCIAL_CENTER/CURRENCY_CLEARING,
        `BicCode` for INSTITUTION) -- this was left as a named follow-up as
        of v2.9.0 pending confirmation the fix wouldn't regress anything;
        this object has no other constraints to interfere with, so it is
        applied here unchanged.
      oneOf:
        - properties:
            calendarType: { enum: [COUNTRY, FINANCIAL_CENTER, CURRENCY_CLEARING] }
            code: { $ref: '#/components/schemas/CalendarCode' }
        - properties:
            calendarType: { enum: [INSTITUTION] }
            code: { $ref: '#/components/schemas/BicCode' }
      properties:
        calendarType: { $ref: '#/components/schemas/CalendarType' }
        code: { type: string }
        version: { type: string }

    CalendarAssessment:
      type: object
      required: [calendarType, code, date, businessDay, calendarVersion]
      description: >
        THREE INDEPENDENT `oneOf` constraint groups combined via `allOf`
        (round-6 restructure -- previously a single top-level `oneOf`, which
        left no room to add a second, orthogonal constraint group without
        the two interfering). Group 1 (businessDay consistency) has three
        branches, exactly one of which must match: (1) businessDay=true,
        which round-6 review tightened to ADDITIONALLY forbid reasonCode,
        closureStatus, resolvedAt, manualReviewRequired=true, and
        automaticAdjustmentAllowed=false all being present -- previously a
        businessDay=true entry could still carry
        reasonCode=FORCE_MAJEURE_EVENT, self-contradicting "this day was a
        business day" and "this day had a force-majeure closure" in the
        same object; (2) businessDay=false with any non-force-majeure
        reasonCode, which only needs reasonCode present; (3)
        businessDay=false with reasonCode=FORCE_MAJEURE_EVENT, which
        ADDITIONALLY schema-requires manualReviewRequired=true and
        automaticAdjustmentAllowed=false (v2.2.0 fix). Group 2
        (closureStatus consistency, round-6 addition) has two branches:
        resolvedAt present if and only if closureStatus is RESOLVED or
        CANCELLED, same rule as skippedDates[]. Group 3 (round-16 addition,
        design doc 3.62): the same calendarType/code `oneOf` used on
        `CalendarReference.code` and `CalendarVersionRef.code` -- added as
        a third, fully independent group rather than folded into Groups 1
        or 2, since it constrains different properties (calendarType/code
        vs. businessDay/reasonCode/closureStatus/resolvedAt) and adding it
        as its own `allOf` member cannot interfere with the other two.
      allOf:
        - oneOf:
            - properties:
                businessDay: { enum: [true] }
              not:
                anyOf:
                  - required: [reasonCode]
                  - required: [closureStatus]
                  - required: [resolvedAt]
                  - properties: { manualReviewRequired: { enum: [true] } }
                    required: [manualReviewRequired]
                  - properties: { automaticAdjustmentAllowed: { enum: [false] } }
                    required: [automaticAdjustmentAllowed]
            - properties:
                businessDay: { enum: [false] }
                reasonCode:
                  enum: [PUBLIC_HOLIDAY, WEEKEND, AD_HOC_BANK_CLOSURE, CLEARING_SYSTEM_CLOSURE, PAYMENT_NETWORK_OUTAGE]
              required: [reasonCode]
            - properties:
                businessDay: { enum: [false] }
                reasonCode: { enum: [FORCE_MAJEURE_EVENT] }
                manualReviewRequired: { enum: [true] }
                automaticAdjustmentAllowed: { enum: [false] }
              required: [reasonCode, manualReviewRequired, automaticAdjustmentAllowed]
        - oneOf:
            - anyOf:
                - not: { required: [closureStatus] }
                - properties: { closureStatus: { enum: [ACTIVE] } }
              not:
                required: [resolvedAt]
            - properties:
                closureStatus: { enum: [RESOLVED, CANCELLED] }
              required: [closureStatus, resolvedAt]
        - oneOf:
            - properties:
                calendarType: { enum: [COUNTRY, FINANCIAL_CENTER, CURRENCY_CLEARING] }
                code: { $ref: '#/components/schemas/CalendarCode' }
            - properties:
                calendarType: { enum: [INSTITUTION] }
                code: { $ref: '#/components/schemas/BicCode' }
      properties:
        calendarType: { $ref: '#/components/schemas/CalendarType' }
        code: { type: string }
        role: { $ref: '#/components/schemas/CalendarRole' }
        date: { type: string, format: date }
        businessDay: { type: boolean }
        reasonCode: { $ref: '#/components/schemas/ReasonCode' }
        reasonDescription: { type: string }
        calendarVersion: { type: string }
        manualReviewRequired:
          type: boolean
          default: false
          description: >
            true when reasonCode indicates a non-routine closure (typically
            FORCE_MAJEURE_EVENT, sometimes PAYMENT_NETWORK_OUTAGE) that a
            human should confirm before the adjusted date is relied upon
            operationally.
        automaticAdjustmentAllowed:
          type: boolean
          default: true
          description: >
            false if product policy requires manual sign-off before this
            particular closure may be used to justify a business-day
            adjustment (independent of manualReviewRequired, which flags
            the closure itself rather than the policy gate on using it).
        closureStatus:
          allOf: [{ $ref: '#/components/schemas/ClosureStatus' }]
          default: ACTIVE
          description: >
            Round-5 addition, for the same reason as skippedDates[].closureStatus.
            Does NOT relax the oneOf gating above: manualReviewRequired=true
            and automaticAdjustmentAllowed=false are still schema-required
            whenever reasonCode=FORCE_MAJEURE_EVENT regardless of
            closureStatus, since even a RESOLVED force-majeure entry
            represents a date that genuinely was non-business at the time.
        resolvedAt:
          type: string
          format: date-time
          description: When closureStatus=RESOLVED or CANCELLED, when that status change took effect.

    AdjustBusinessDayRequest:
      type: object
      required: [sourceDate, sourceDateType, calculationPurpose, calendars, combinationRule, convention]
      additionalProperties: false
      description: >
        NOTE on the `oneOf` and `not` constraints below: they enforce two
        rules that v2.0.0 only stated in prose. `oneOf` allows exactly one
        of the three legal (sourceDateType, calculationPurpose) pairings --
        CONTRACTUAL_MATURITY_DATE+OPERATIONAL_PAYMENT_DATE,
        EXAMINATION_PERIOD_START+EXAMINATION_DEADLINE, or OTHER+OTHER -- and
        rejects every other pairing (e.g. CONTRACTUAL_MATURITY_DATE with
        EXAMINATION_DEADLINE) as schema-invalid, returning
        `INVALID_DATE_PURPOSE_COMBINATION` (400). `not` makes
        calendarSnapshotId and asOfDateTime genuinely mutually exclusive:
        a request supplying both is schema-invalid, returning
        `MUTUALLY_EXCLUSIVE_CALENDAR_VERSION_INPUTS` (400). Round-13
        addition: `additionalProperties: false` -- an unknown top-level
        property (e.g. a caller typo like `sourceData` instead of
        `sourceDate`) is now schema-rejected instead of being silently
        ignored. This is declared alongside (not inside) the `oneOf`
        branches below, so it constrains the object against the full
        `properties` list beneath, independent of which `oneOf` branch
        matches.
      oneOf:
        - properties:
            sourceDateType: { enum: [CONTRACTUAL_MATURITY_DATE] }
            calculationPurpose: { enum: [OPERATIONAL_PAYMENT_DATE] }
        - properties:
            sourceDateType: { enum: [EXAMINATION_PERIOD_START] }
            calculationPurpose: { enum: [EXAMINATION_DEADLINE] }
        - properties:
            sourceDateType: { enum: [OTHER] }
            calculationPurpose: { enum: [OTHER] }
      not:
        required: [calendarSnapshotId, asOfDateTime]
      properties:
        sourceDate:
          type: string
          format: date
          description: The date to be adjusted (already derived by the caller from its own domain logic)
        sourceDateType:
          type: string
          enum: [CONTRACTUAL_MATURITY_DATE, EXAMINATION_PERIOD_START, OTHER]
          description: What sourceDate represents in the caller's domain. Echoed back for audit; drives no calculation behavior.
        calculationPurpose:
          type: string
          enum: [OPERATIONAL_PAYMENT_DATE, EXAMINATION_DEADLINE, OTHER]
          description: What the caller intends to do with adjustedDate. When sourceDateType=CONTRACTUAL_MATURITY_DATE this MUST be OPERATIONAL_PAYMENT_DATE -- this endpoint never returns a revised contractual date (see contractualDateChanged in the response).
        currency:
          type: string
          description: ISO 4217 currency code, for context/audit only
        calendars:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CalendarReference' }
        combinationRule: { $ref: '#/components/schemas/CombinationRule' }
        convention: { $ref: '#/components/schemas/BusinessDayConvention' }
        calendarSnapshotId:
          type: string
          description: Pin the calculation to a specific approved multi-calendar snapshot (for historical/audit re-calculation). Mutually exclusive with asOfDateTime. Omit both to use the latest approved snapshot.
        asOfDateTime:
          type: string
          format: date-time
          description: Alternative to calendarSnapshotId -- use the calendar state as approved as of this instant (timezone-qualified, e.g. "2026-12-20T15:00:00+04:00"), so that same-day approvals are disambiguated. Mutually exclusive with calendarSnapshotId.

    AdjustBusinessDayResponse:
      type: object
      required:
        - calculationId
        - sourceDate
        - sourceDateType
        - calculationPurpose
        - adjustedDate
        - wasAdjusted
        - adjustmentDays
        - contractualDateChanged
        - combinationRuleApplied
        - conventionApplied
        - calendarSnapshotId
        - calendarVersions
        - calendarAssessments
        - adjustedDateAssessments
        - skippedDates
        - calculationWindowStartDate
        - calculationWindowEndDate
        - warnings
      properties:
        calculationId:
          type: string
          description: Unique ID for this calculation, for audit trail and correlation with X-Correlation-ID
        sourceDate: { type: string, format: date }
        sourceDateType: { type: string }
        calculationPurpose: { type: string }
        adjustedDate: { type: string, format: date }
        wasAdjusted: { type: boolean }
        adjustmentDays:
          type: integer
          description: Signed number of calendar days moved (positive = forward)
        contractualDateChanged:
          type: boolean
          enum: [false]
          description: >
            Always false -- schema-enforced via `enum: [false]`, not just
            documented, so a response claiming otherwise is itself
            schema-invalid. Present explicitly so callers and auditors never
            need to infer that this endpoint cannot alter a Contractual
            Maturity Date.
        combinationRuleApplied: { $ref: '#/components/schemas/CombinationRule' }
        conventionApplied: { $ref: '#/components/schemas/BusinessDayConvention' }
        calendarSnapshotId:
          type: string
          description: The multi-calendar snapshot actually used for this calculation (always returned, even if the request used asOfDateTime instead)
        calendarVersions:
          type: array
          minItems: 1
          description: Every individual calendar version actually used, so a mixed-version calculation is never described by a single ambiguous version string. Never empty -- every request already requires calendars:{minItems:1}, so a successful calculation always used at least one calendar.
          items: { $ref: '#/components/schemas/CalendarVersionRef' }
        calendarAssessments:
          type: array
          minItems: 1
          description: Per-calendar business-day determination for sourceDate, so callers can distinguish e.g. "paying bank open, currency clearing closed". Never empty, for the same reason as calendarVersions.
          items: { $ref: '#/components/schemas/CalendarAssessment' }
        adjustedDateAssessments:
          type: array
          minItems: 1
          description: >
            Per-calendar business-day determination for adjustedDate (the
            actual landing date), always returned even when
            wasAdjusted=false (in which case it is identical in content to
            calendarAssessments, since sourceDate and adjustedDate are the
            same date). Lets a caller confirm the landing date is genuinely
            open under every calendar, not merely that it stopped rolling.
            Never empty, for the same reason as calendarVersions.
          items: { $ref: '#/components/schemas/CalendarAssessment' }
        skippedDates:
          type: array
          description: Every non-business date encountered while rolling from sourceDate to adjustedDate, with attribution
          items:
            type: object
            required: [date, reasonCode]
            description: >
              Round-6 addition: the `oneOf` below enforces that resolvedAt
              is present if and only if closureStatus is RESOLVED or
              CANCELLED -- an ACTIVE (or omitted, which defaults to ACTIVE)
              entry with a resolvedAt, or a RESOLVED/CANCELLED entry without
              one, is schema-invalid.
            oneOf:
              - anyOf:
                  - not: { required: [closureStatus] }
                  - properties: { closureStatus: { enum: [ACTIVE] } }
                not:
                  required: [resolvedAt]
              - properties:
                  closureStatus: { enum: [RESOLVED, CANCELLED] }
                required: [closureStatus, resolvedAt]
            properties:
              date: { type: string, format: date }
              reasonCode: { $ref: '#/components/schemas/ReasonCode' }
              reasonDescription: { type: string }
              closureStatus:
                allOf: [{ $ref: '#/components/schemas/ClosureStatus' }]
                default: ACTIVE
                description: >
                  Round-5 addition, closing the gap the round-4 review
                  flagged: without this field, a FORCE_MAJEURE_EVENT entry
                  here was ambiguous between "this closure is still in
                  effect" and "this closure has since been resolved and is
                  retained only for audit". Defaults to ACTIVE when omitted
                  -- an omitted closureStatus must be treated as ACTIVE, not
                  as "unknown, therefore safe". SERVICE-ENFORCED (not
                  schema-enforced, same limitation as CombinationRule /
                  ANY_ELIGIBLE_OPEN in section 3.16 -- a schema cannot
                  express "if any array item has reasonCode=X and
                  closureStatus=ACTIVE, the whole response must instead be a
                  422"): the fail-closed rule in this operation's
                  description triggers only for entries where
                  reasonCode=FORCE_MAJEURE_EVENT AND closureStatus=ACTIVE
                  (or closureStatus omitted, which defaults to ACTIVE);
                  RESOLVED/CANCELLED entries may legitimately appear in a
                  200 response as historical record.
              resolvedAt:
                type: string
                format: date-time
                description: When closureStatus=RESOLVED or CANCELLED, when that status change took effect. Absent for ACTIVE entries.
        calculationWindowStartDate:
          type: string
          format: date
          description: >
            The EARLIEST date actually evaluated by this calculation.
            Round-5 correction: this is NOT always min(sourceDate,
            adjustedDate) -- for FOLLOWING/PRECEDING it is, but
            MODIFIED_FOLLOWING/MODIFIED_PRECEDING/NEAREST can probe in a
            direction that is ultimately rejected before settling on
            adjustedDate (e.g. MODIFIED_FOLLOWING rolling forward across a
            month boundary, finding no viable date, then rolling backward
            from sourceDate instead -- the forward-probed dates were still
            evaluated even though adjustedDate ends up behind sourceDate).
            This field is always the minimum across sourceDate, adjustedDate,
            AND every date actually probed during that evaluation, so
            Impact Report window-overlap checks (see calculationWindowEndDate)
            don't miss a changed date that was only ever an intermediate
            probe. Added (round-4 review, corrected round-5) so a consumer
            generating an Impact Report after a calendar update can
            determine whether a historical calculation is affected by
            testing window overlap -- (calculationWindowStartDate,
            calculationWindowEndDate) intersects the changed date range --
            rather than only comparing against sourceDate. See section 4 of
            the design document for the full Impact Report query pattern,
            and UAT-50/UAT-51 for the MODIFIED_*/NEAREST worked examples.
        calculationWindowEndDate:
          type: string
          format: date
          description: The LATEST date actually evaluated during this calculation, over the same expanded set described in calculationWindowStartDate (sourceDate, adjustedDate, and every probed intermediate date) -- not simply max(sourceDate, adjustedDate).
        warnings:
          type: array
          items: { type: string }
          description: Non-blocking informational notices only (e.g. calendar data nearing its staleness threshold). Never used in place of a reject for missing/unapproved data -- see the fail-closed policy above.

    AddBusinessDaysRequest:
      type: object
      required: [startDate, businessDays, calendars, combinationRule]
      additionalProperties: false
      description: >
        Same mutual-exclusivity rule as AdjustBusinessDayRequest applies to
        calendarSnapshotId / asOfDateTime, and is enforced the same way (via
        `not`, not prose): supplying both is schema-invalid and rejected
        with `MUTUALLY_EXCLUSIVE_CALENDAR_VERSION_INPUTS` (400). Round-13
        addition: `additionalProperties: false`, same rationale and
        placement as AdjustBusinessDayRequest above.
      not:
        required: [calendarSnapshotId, asOfDateTime]
      properties:
        startDate: { type: string, format: date }
        businessDays:
          type: integer
          description: Number of business days to add (negative to subtract, 0 to just resolve startDate per nonBusinessStartDateConvention)
          example: 5
        includeStartDate:
          type: boolean
          default: false
          description: >
            Deliberately NOT phrased in terms of "day zero" (round-3 review
            flagged that framing as internally inconsistent -- if startDate
            were day zero under both settings, includeStartDate would not
            change the result at all). The actual rule: `false` (default) --
            startDate itself is excluded from the count; counting starts
            from the NEXT business day, which is business day #1. `true` --
            if startDate is itself already a business day, it counts as
            business day #1 of the count (one day "earlier" in the count
            than the false case).
            Worked examples with businessDays=5, startDate = a Tuesday that
            is already a business day: (1) includeStartDate=false (default):
            Wed=#1, Thu=#2, Fri=#3, Mon=#4, Tue=#5 -> resultDate = the
            FOLLOWING Tuesday (see UAT-47). (2) includeStartDate=true:
            startDate Tue=#1, Wed=#2, Thu=#3, Fri=#4, Mon=#5 -> resultDate =
            the following Monday, one business day earlier than case 1 (see
            UAT-48). (3) startDate falls on a non-business day (e.g.
            Saturday): includeStartDate is only meaningful for a startDate
            that IS a business day -- see nonBusinessStartDateConvention,
            which resolves this case first, before includeStartDate is
            considered at all (see UAT-49).
        nonBusinessStartDateConvention:
          allOf: [{ $ref: '#/components/schemas/BusinessDayConvention' }]
          default: FOLLOWING
          description: >
            How to resolve startDate first, if it falls on a non-business
            day, before counting (and before includeStartDate is evaluated)
            begins. Worked example: startDate is a Saturday,
            nonBusinessStartDateConvention=FOLLOWING (default) -> startDate
            is first rolled to the following Monday; counting per
            includeStartDate then proceeds from that Monday, not from the
            original Saturday.
        calendars:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CalendarReference' }
        combinationRule: { $ref: '#/components/schemas/CombinationRule' }
        calendarSnapshotId: { type: string }
        asOfDateTime: { type: string, format: date-time }

    AddBusinessDaysResponse:
      type: object
      required:
        - calculationId
        - startDate
        - businessDaysAdded
        - resultDate
        - calendarSnapshotId
        - calendarVersions
        - skippedDates
        - calculationWindowStartDate
        - calculationWindowEndDate
      properties:
        calculationId: { type: string }
        startDate: { type: string, format: date }
        businessDaysAdded: { type: integer }
        resultDate: { type: string, format: date }
        calculationWindowStartDate:
          type: string
          format: date
          description: The EARLIEST date actually evaluated, over startDate, resultDate, AND every intermediate date probed (not simply min(startDate, resultDate)) -- see AdjustBusinessDayResponse.calculationWindowStartDate for the full rationale and the round-5 correction.
        calculationWindowEndDate:
          type: string
          format: date
          description: The LATEST date actually evaluated, over the same expanded set (not simply max(startDate, resultDate)).
        calendarSnapshotId: { type: string }
        calendarVersions:
          type: array
          minItems: 1
          description: Never empty -- every request already requires calendars:{minItems:1}.
          items: { $ref: '#/components/schemas/CalendarVersionRef' }
        skippedDates:
          type: array
          items:
            type: object
            required: [date, reasonCode]
            description: >
              Round-6 addition: the `oneOf` below enforces that resolvedAt
              is present if and only if closureStatus is RESOLVED or
              CANCELLED -- an ACTIVE (or omitted, which defaults to ACTIVE)
              entry with a resolvedAt, or a RESOLVED/CANCELLED entry without
              one, is schema-invalid.
            oneOf:
              - anyOf:
                  - not: { required: [closureStatus] }
                  - properties: { closureStatus: { enum: [ACTIVE] } }
                not:
                  required: [resolvedAt]
              - properties:
                  closureStatus: { enum: [RESOLVED, CANCELLED] }
                required: [closureStatus, resolvedAt]
            properties:
              date: { type: string, format: date }
              reasonCode: { $ref: '#/components/schemas/ReasonCode' }
              reasonDescription: { type: string }
              closureStatus:
                allOf: [{ $ref: '#/components/schemas/ClosureStatus' }]
                default: ACTIVE
                description: >
                  Round-5 addition, closing the gap the round-4 review
                  flagged: without this field, a FORCE_MAJEURE_EVENT entry
                  here was ambiguous between "this closure is still in
                  effect" and "this closure has since been resolved and is
                  retained only for audit". Defaults to ACTIVE when omitted
                  -- an omitted closureStatus must be treated as ACTIVE, not
                  as "unknown, therefore safe". SERVICE-ENFORCED (not
                  schema-enforced, same limitation as CombinationRule /
                  ANY_ELIGIBLE_OPEN in section 3.16 -- a schema cannot
                  express "if any array item has reasonCode=X and
                  closureStatus=ACTIVE, the whole response must instead be a
                  422"): the fail-closed rule in this operation's
                  description triggers only for entries where
                  reasonCode=FORCE_MAJEURE_EVENT AND closureStatus=ACTIVE
                  (or closureStatus omitted, which defaults to ACTIVE);
                  RESOLVED/CANCELLED entries may legitimately appear in a
                  200 response as historical record.
              resolvedAt:
                type: string
                format: date-time
                description: When closureStatus=RESOLVED or CANCELLED, when that status change took effect. Absent for ACTIVE entries.

    Holiday:
      type: object
      properties:
        date: { type: string, format: date }
        name: { type: string, example: "Christmas Day" }
        calendarType: { $ref: '#/components/schemas/CalendarType' }
        calendarCode: { type: string, example: "USD_FEDWIRE" }
        type: { $ref: '#/components/schemas/ReasonCode' }

    ErrorResponse:
      type: object
      required: [errorCode, message, correlationId, retryable]
      properties:
        errorCode:
          type: string
          description: >
            Aligned with the Trade Finance Maturity Date document's Section
            16 error codes so both systems share one error vocabulary.
            Note on HTTP status consistency: the same errorCode is always
            returned with the same HTTP status regardless of which endpoint
            raised it (e.g. CALENDAR_CONFLICT is always 409,
            CALENDAR_DATA_STALE is always 503) -- see each operation's
            `responses` map for the specific codes it can raise; an
            operation not listing a given response status simply cannot
            raise the errorCodes mapped to it.
            Round-5 fix: CALENDAR_NOT_CONFIGURED and CALENDAR_NOT_FOUND used
            to be the same code returned at two different statuses (404 on
            the Calendars GET endpoints, 422 on the two calculation POST
            endpoints), which directly violated the "same code, same
            status" rule above. They are now two distinct codes instead:
            CALENDAR_NOT_FOUND (404, always) -- "this calendarType/code pair
            does not exist as a resource", raised only by the Calendars GET
            endpoints. CALENDAR_NOT_CONFIGURED (422, always) -- "a
            calculation needs a calendar that isn't set up", raised only by
            /business-days/adjust and /business-days/add. The two are never
            interchangeable and never share a status.
            Round-12 fix: GET /currencies/{code} and GET /countries/{code}
            each declared a 404 response using this shared ErrorResponse
            schema, but this enum had no errorCode a currency-not-found or
            country-not-found response could legally use other than
            CALENDAR_NOT_FOUND -- which is explicitly reserved for the three
            Calendars GET endpoints above and would misdescribe a missing
            currency/country as a missing calendar. CURRENCY_NOT_FOUND and
            COUNTRY_NOT_FOUND are added below for exactly this purpose, each
            raised only by its one respective endpoint. Unlike the other
            error codes in this enum, whose association to a single endpoint
            (or endpoint pair) is currently documented in prose only, these
            two 404 responses AND the three Calendars GET 404 responses are
            additionally schema-narrowed per-response (see each operation's
            404 response definition, which layers an `allOf` + `enum: [...]`
            restriction on top of this shared ErrorResponse component) so a
            response claiming e.g. CALENDAR_NOT_FOUND for GET
            /currencies/{code} is itself schema-invalid, not just
            undocumented.
            Round-13 fix: GET .../is-business-day's 422 response is now
            schema-narrowed to CALENDAR_YEAR_NOT_AVAILABLE only (reusing
            the code already reserved elsewhere in this document for "the
            calculation window reaches into a year/period the calendar has
            not been loaded for" -- the same condition this 422 describes),
            using the same allOf + enum narrowing technique. INVALID_
            DATE_RANGE is added below for GET .../holidays' new 400
            response (query range exceeds the documented maximum; see that
            operation's description).
          enum:
            - INVALID_DATE_FORMAT
            - INVALID_DATE_RANGE
            - INVALID_CALENDAR_REFERENCE
            - INVALID_COMBINATION_RULE
            - INVALID_DATE_PURPOSE_COMBINATION
            - MUTUALLY_EXCLUSIVE_CALENDAR_VERSION_INPUTS
            - AUTHENTICATION_REQUIRED
            - INSUFFICIENT_CALENDAR_SCOPE
            - INCOMPLETE_PAYMENT_PATH_GROUP
            - INVALID_PAYMENT_PATH_GROUP
            - CALENDAR_NOT_FOUND
            - CURRENCY_NOT_FOUND
            - COUNTRY_NOT_FOUND
            - CALENDAR_NOT_CONFIGURED
            - CALENDAR_YEAR_NOT_AVAILABLE
            - CALENDAR_CONFLICT
            - CALENDAR_VERSION_NOT_AVAILABLE
            - CALENDAR_VERSION_NOT_APPROVED
            - MANUAL_REVIEW_REQUIRED
            - CALENDAR_DATA_STALE
            - CALENDAR_SERVICE_TIMEOUT
        message: { type: string }
        calendarType: { $ref: '#/components/schemas/CalendarType' }
        calendarCode: { type: string }
        requiredDate:
          type: string
          format: date
          description: The date whose calendar coverage triggered this error, when applicable
        correlationId:
          type: string
          description: Echoes X-Correlation-ID (or the server-generated equivalent) for tracing
        retryable:
          type: boolean
          description: >
            true only for transient conditions (e.g. CALENDAR_SERVICE_TIMEOUT)
            where a caller-side retry with backoff is appropriate. false for
            data conditions (missing/unapproved calendar, invalid request)
            that will not resolve by retrying and require data correction or
            manual handling instead.
        details:
          type: object
          additionalProperties: true
