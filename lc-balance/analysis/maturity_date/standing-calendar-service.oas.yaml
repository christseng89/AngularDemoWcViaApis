      operationId: getCurrency
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: '#/components/schemas/CurrencyCode' }
          description: >
            ISO 4217 currency code. Round-13: this path parameter is
            UNAMBIGUOUSLY a currency code (unlike the polymorphic
            CalendarCodePath used elsewhere), so it now references the
            CurrencyCode component directly (`^[A-Z]{3}$`) instead of a
            bare, unconstrained string.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Currency reference data
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [code, name, minorUnitDecimals]
                properties:
                  code: { $ref: '#/components/schemas/CurrencyCode' }
                  name: { type: string, example: "US Dollar" }
                  minorUnitDecimals: { type: integer, example: 2 }
                  defaultClearingCalendarCode:
                    type: string
                    description: Default CURRENCY_CLEARING calendar code associated with this currency
                    example: "USD_FEDWIRE"
                  cutOffTimes:
                    type: array
                    items:
                      type: object
                      properties:
                        financialCenter: { type: string, example: "NY" }
                        timeZone: { type: string, example: "America/New_York" }
                        cutOffLocalTime: { type: string, example: "17:00" }
        '401':
          description: Missing or invalid access token (errorCode AUTHENTICATION_REQUIRED)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: >
            Currency not found -- the currency code itself is unknown
            (errorCode CURRENCY_NOT_FOUND, round-12 fix: previously this
            response only referenced (via $ref) the shared ErrorResponse schema with no
            enum member it could legally use other than CALENDAR_NOT_FOUND,
            which is reserved for the three Calendars GET endpoints and
            would misdescribe a missing currency as a missing calendar)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      errorCode:
                        enum: [CURRENCY_NOT_FOUND]
                    description: >
                      Round-12: schema-narrows errorCode for THIS response
