openapi: 3.0.3
info:
  title: Balance Component Service API
  description: >
    OpenAPI contract for the Balance Component microservice — the
    contingent / off-balance-sheet exposure ledger for LC-related trade
    finance instruments (LC Balance, Acceptance, Shipping Guarantee, Export
    Confirmation). Originally extracted from
    analysis/COMMON-BalanceComponent-Design-zh.md and
    analysis/COMMON-BalanceComponent-Cross-Reference.md; from v1.0.0 onward
    this file is re-grounded directly against the real, currently-running
    implementation under microservices/balance-component/src/ — where an
    earlier draft version of this file described an endpoint or field that
    was never actually built, it has been removed here rather than left as
    aspirational documentation. Where the design documents and the shipped
    implementation disagree, this file follows the implementation and notes
    the discrepancy inline.


    Explicitly OUT OF SCOPE: IBL/EBL and any actual funded/discounted
    exposure (Loan Component's domain, fronting the external eLoan system —
    see Design doc §1 and Cross-Reference Finding 3b), interest/accrual
    calculation (also Loan Component's domain), and GL account mapping
    (Balance Component only carries caller-supplied accountEntries through
    to a downstream accounting component — see §2/§3.3 "GL Ownership").


    Core model (Design doc §3): a `BalanceContract` is one immutable
    version-snapshot of a `logicalContractId` (the stable business identity
    of one LC, one Acceptance, one Shipping Guarantee, or one Export
    Confirmation). At most one version per logicalContractId is ever
    `ACTIVE`. A `BalanceMovement` is an append-only, never-deleted record
    of one exposure-amount change against one specific contract version.


    API design principle — a single-leg command uses the single-movement
    endpoints, while one approved multi-leg business event uses the
    `/balance-movements/compound*` endpoints. Compound create, release, and
    mixed release/acknowledge actions execute inside one SQLite transaction:
    every requested movement succeeds, or all writes and side effects are
    rolled back. Sibling create requests must carry one identical,
    caller-supplied `businessEventId`, which is both their audit correlation
    key and the identity checked at the compound transaction boundary.


    BUSINESS FLOW ROUTING (business-confirmed 2026-08-29):
      - Import: A3 (Document Arrival) or A3S (Document Arrival with Shipping
        Guarantee) creates the source `IPLC_LC`/`UTILIZE` earmark. The parent
        LC's tenor then determines the only valid continuation: `SIGHT` → A4
        (Sight Settlement), while `SELLERS_USANCE` or `BUYERS_USANCE` → A6
        (Acceptance). A4 Maker-Submits and finalizes that existing UTILIZE in
        place; A6 creates an `IPLC_ACCEPTANCE`/`CREATE` referencing it and the
        Checker command atomically releases the still-PENDING source plus the
        Acceptance.
      - Export: B3 (Present Docs) creates and independently releases the
        `EPLC_EXAMINATION`/`CREATE` source before B4 can select it. B4 always
        references and consumes that B3 record. The Confirmation tenor chooses
        the B4 shape: `SIGHT` → `EPLC_CONFIRMATION`/`HONOUR` plus Due From
        Issuing Bank; `SELLERS_USANCE` or `BUYERS_USANCE` →
        `EPLC_CONFIRMATION`/`ACCEPT` plus Acceptance and Reimbursement
        Receivable legs. B4's own newly-created legs are one atomic compound
        business event; the already-RELEASED B3 source is not released again.


    v1.37.0 (2026-08-30, documentation synchronization; no wire-shape
    change): records the completed SOLID refactor in which `BalanceService`
    remains the route-facing compatibility façade while query, snapshot,
    contract resolution, request validation, release policy/side effects and
    lifecycle responsibilities are delegated to focused services. Reaffirms
    that A3S/A6/B4/B5 multi-leg writes use the existing atomic
    `/balance-movements/compound*` endpoints. Also documents the retained
    Run-All prerequisites (A4-ready Sight A3, A6-ready Usance A3 and B4-ready
    released B3) and clarifies that Transaction Index columns such as SG/IB/EB
    Amount and Tight LC Balance are UI projections of existing contract,
    movement and `BalanceSnapshot` fields, not new API properties.


    v1.38.0 (2026-08-30, Remarks-only Fix Pending; no wire-shape change):
    A4, A6, A7, A9, B4 and B5 use the existing `REMARKS_ONLY` edit mode.
    The amount must remain identical and only Remarks is persisted; Balance,
    Account Entries and compound sibling movements remain untouched.


    v1.39.0 (2026-08-30, Transaction Index amount display; no wire-shape
    change): every A-series and B-series Transaction Index amount projection,
    including Tight LC Balance and SG/IB/EB Amount, is rendered with thousands
    separators and the selected currency's ISO minor-unit scale. API monetary
    values remain unformatted decimal strings.


    v1.40.0 (2026-08-30, Remarks-only Fix Pending validation): Remarks is
    mandatory and must contain at least one non-whitespace character for A4,
    A6, A7, A9, B4 and B5. The UI disables Save until Remarks differs from
    the stored value; the API independently rejects missing or blank Remarks.


    v1.41.0 (2026-08-31, Maker Result Delete Pending synchronization; no
    wire-shape change): all A1-A11/B1-B7 Transaction Processing flows may
    offer Delete Pending immediately after a successful Maker Submit. A1/B1
    return to a fresh natural-key input after cancellation; every other
    function returns to its Transaction Index. This is client navigation,
    not a new service endpoint. A4 calls the existing
    `/balance-movements/{movementId}/withdraw-maker-submit` operation so its
    A3/A3S source is preserved. Other functions call `/cancel`; A3S/B4/B5
    cancel their linked legs sibling-first and the primary leg last. Those
    calls remain independent and are not an atomic batch cancellation.
    Maker Queue/Fix Pending is a separate entry flow and is unchanged.


    v1.42.0 (2026-08-31, inquiry transport-error synchronization; no
    successful-response wire-shape change): the catalog reads used by Maker
    Queue, Inquire Events and Inquire Delete Pending now document their
    possible 500 Error response. The reference UI preserves the original HTTP
    status and presents transport/5xx failures as service unavailability;
    BAL-UI-UNEXPECTED remains reserved for unclassified client failures.


    CURRENCY CONSISTENCY (v1.0.0, business-requested 2026-08-16; validation
    scope narrowed 2026-08-24 — see note below): `currency` is a REQUIRED
    field on every request (see `BalanceMovementCreateRequest.required`),
    but the server now also validates it server-side rather than trusting
    the caller blindly:
      1. If the request resolves (via `balanceContractId`, or via
         `naturalKey` matching an existing ACTIVE `BalanceContract`) to an
         EXISTING contract, the supplied `currency` must match that
         contract's own stored `currency` exactly — a mismatch is rejected
         (`409 CURRENCY_MISMATCH`).
      2. Else, if the request is creating a brand-new child Logical
         Contract (a creating movementType — ISSUE/CREATE — with no
         existing resolution) AND `parentLogicalContractId` is supplied,
         the supplied `currency` must match the PARENT's own current
         `currency` exactly (same rejection rule). This covers every
         "carried from the parent LC/Confirmation" function — a new
         Acceptance, Shipping Guarantee, or Present Docs earmark must
         declare the same Currency as the LC/Confirmation it is created
         under.
      3. When creating a genuinely ROOT new Logical Contract — a creating
         movementType with no existing resolution AND no
         `parentLogicalContractId` (i.e. `IPLC_LC`/`EPLC_CONFIRMATION`
         `ISSUE`) — the supplied `currency` becomes this new Logical
         Contract's own authoritative Currency Code for every future
         movement against it or anything created under it; there is
         nothing to validate it against.
    This mirrors, at the data-model level, the channel-facing business
    rule ("A1/B1 Currency Code = User Input; every other function = Carried
    forward + Protected") without this service needing to know about named
    business-function codes at all — it only needs to know whether a
    request resolves to an existing contract, or a parent, or neither.

    Note (2026-08-24): an earlier design additionally made `currency`
    OPTIONAL for cases 1/2 above (server-derived when omitted, not just
    validated when supplied) — that broader change was reverted along with
    unrelated work and is not part of this contract. `currency` remains
    required on every request; only the consistency check described above
    is currently implemented.


    v0.1.0 (draft, 2026-08-14): initial extraction from the design
    documents.


    v0.2.0 (draft, 2026-08-14): added the off-balance-sheet exposure
    two-tier WARNING/ERROR check (Design doc §6.1), later hardened to a
    single ERROR tier — see v0.7.0/v1.0.0 below.


    v0.3.0 (draft, 2026-08-14): added Tolerance conversion for
    IPLC_LC/EPLC_LC face-amount movements (Design doc §6.2).
    `BalanceContract.tolerancePct` and `BalanceMovement.ceilingAmount` are
    new; for ISSUE/AMEND_INCREASE/AMEND_DECREASE, `amount` is the
    caller-typed face-level delta and `ceilingAmount = amount ×
    (1+tolerancePct/100)` is what the server actually applies against
    Confirmed Balance and checks AMEND_DECREASE sufficiency against.


    v0.4.0 (draft, 2026-08-14): SHGT's `REDEEM` movementType is replaced by
    `PARTIAL_REDEEM`/`FULL_REDEEM` (Design doc §5, v0.6) — a redemption may
    now release less than the SG's full outstanding balance. Redemption
    amount is NEVER auto-derived from a UTILIZE/Document-Arrival amount,
    even when they happen to match — the caller must submit the redemption
    explicitly.


    v0.5.0 / v0.6.0 (draft, 2026-08-14): SG `ISSUE` is hard-capped at its
    parent LC's current Tight Available Balance (Available Balance minus
    the LC's own other outstanding SG exposure), checked at Maker
    submission — `409 InsufficientBalanceError`, not merely a warning. The
    original LMTS-Available-Limit-based design is superseded for this
    check (the LMTS integration mechanism itself remains untraced and
    unused — represented only as an opaque `lmtsReservationId` passthrough
    field).


    v0.7.0 (draft, 2026-08-14): the §6.1 off-balance-sheet exposure check
    on a UTILIZE (Document Arrival) is a hard `409 InsufficientBalanceError`,
    same tier as exceeding plain Available Balance — no longer a
    non-blocking warning. A caller deliberately consuming a specific
    outstanding Shipping Guarantee's reserved capacity creates that SG's
    own `FULL_REDEEM`/`PARTIAL_REDEEM` (still PENDING) BEFORE calling
    `POST /balance-movements` for the UTILIZE — the exposure computation
    already counts a PENDING redemption the same as a RELEASED one, so its
    contribution is already netted out by the time the UTILIZE's own check
    runs. Purely a client-side call-ordering pattern (`businessEventId`
    links the two calls for audit/query only, not atomicity).


    v0.8.0 (2026-08-16): catches this contract up to the implemented Export
    Confirmation (保兌) side. `InstrumentType` gains `EPLC_EXAMINATION`
    (Present Docs — MEMO_ONLY, CREATE-only memo earmark that never moves
    the parent Confirmation's own balance, per cs-tf-balance-knowhow Design
    Principle D3), plus the three ON_BALANCE_ASSET instruments a
    Confirmation's own HONOUR/ACCEPT transforms into:
    `EPLC_DUE_FROM_ISSUING_BANK` (Sight), `EPLC_ACCEPTANCE_REIMB_RECEIVABLE`
    (Usance, paired with `EPLC_ACCEPTANCE`'s own DPU liability),
    `EPLC_EXPORT_BILLS_DISCOUNTED` (Nego'd Usance — reclass target only, no
    consuming endpoint). New `POST /balance-movements/{movementId}/acknowledge`
    and `BalanceMovement.acknowledgedBy`/`acknowledgedAt` — a Checker's
    acknowledgment of a still-PENDING `EPLC_EXAMINATION` CREATE, distinct
    from `/release`: sets acknowledgedBy/acknowledgedAt but deliberately
    never transitions `status`, so a later Honour/Accept step can still
    find and consume it. Backs `BalanceSnapshot.presentDocsEarmarkPending`/
    `presentDocsEarmarkApproved` (EPLC_CONFIRMATION only). Scope correction:
    `EPLC_DUE_FROM_ISSUING_BANK` (Sight) is a pure receivable with no
    paired liability and no settling endpoint in this contract — a
    deliberate, permanent scope boundary ("Balance Component 只負責
    Contingent Liability"), not a gap.


    v1.0.0 (2026-08-16) — re-grounded against the real implementation,
    correcting several points where this file had drifted from what was
    actually shipped, and adding the currency-derivation rule above:
      - REMOVED (never implemented, no route/service method exists):
        `GET /balance-contracts/{logicalContractId}/history`,
        `POST /balance-contracts/{logicalContractId}/versions` (contract
        supersession/amendment), `PATCH /balance-movements/{movementId}`
        (edit-in-place — the underlying status-transition table has an
        `EDIT` action defined for exactly this, but no route ever invokes
        it), and `POST /balance-movements/{movementId}/reversal`. All four
        remain legitimate future work per the design docs, but describing
        them here as live was inaccurate; they will be re-added to this
        contract if/when actually built.
      - CORRECTED: `DELETE /balance-movements/{movementId}?reasonCode=`
        never existed — the real, implemented cancel operation is
        `POST /balance-movements/{movementId}/cancel` with a JSON body
        (`cancelledBy` required), not a query-param DELETE.
      - ADDED (real, previously undocumented): `GET /balance-contracts/catalog`
        (paginated/searchable contract listing — backs every picker UI),
        `GET /balance-movements/{movementId}/balance-as-of` (the balance
        snapshot as of a specific movement's own event, distinct from
        the calendar-date `asOf` query param on the contract balance
        endpoint).
      - CORRECTED: `ExposureNature` is missing a real, in-use value —
        `MEMO` (a Present Docs / EPLC_EXAMINATION earmark is `MEMO`, never
        `CONTINGENT`/`ACTUAL`; the server forces `accountEntries: null`
        whenever `exposureNature` is `MEMO`).
      - REMOVED: the §6.1 off-balance-sheet exposure "soft WARNING" tier
        and the `BalanceMovement.warnings`/`MovementWarning` schema —
        superseded by v0.7.0's hardening to a single ERROR tier; nothing
        in the current implementation ever populates a warning, so
        documenting the field as live was misleading.
      - ADDED, movement-creation business rules previously undocumented:
        (a) `409 NATURAL_KEY_ALREADY_EXISTS` — a creating movementType
        (ISSUE/CREATE) against a natural key that already resolves to an
        ACTIVE contract is rejected outright, never silently versioned;
        (b) `400` if an Acceptance (`IPLC_ACCEPTANCE`/`EPLC_ACCEPTANCE`)
        CREATE is attempted under a Sight-tenor parent LC, or if the
        child's own `tenorType` does not match the parent's; (c) SHGT
        `ISSUE` and `EPLC_EXAMINATION` CREATE both require
        `parentLogicalContractId` (`400` if missing) and are checked for
        sufficiency against the parent's own Tight Available /
        earmark-adjusted Available Balance, not an unconstrained figure;
        (d) `sourceTransactionRef` must be unique per contract — reusing
        one against the same `balanceContractId` is `400`.
      - ADDED to `BalanceMovementCreateRequest`: `parentLogicalContractId`,
        `tenorType`, `tenorDays`, `maturityDate`, `exposureNature`,
        `tolerancePct` — all real, already-accepted fields this file had
        never documented.
      - REMOVED `GET /balance-contracts/{balanceContractId}/movements`'s
        query filters (`status`/`legRef`/`businessEventId`/`businessDate`)
        — the real endpoint takes none; every filter currently happens
        client-side on the full result set.


    v1.1.0 (2026-08-16, business-requested — "implement the related
    contingent liability account entries across A1-A9/B1-B5... persist the
    generated Dr/Cr account entries as part of that event/movement"): ADDED
    `BalanceMovement.contingentAccountEntry` (new `ContingentAccountEntry`
    schema) — a single, server-derived Dr/Cr contingent-liability account
    pair (`drAccount`/`crAccount`/`currency`/`amount`), computed once at
    movement creation from `(instrumentType, movementType, amount's own
    sign, the resolved contract's tenorType)` per
    analysis/contingent-liability-ledger.html, and persisted immutably with
    the movement — never recalculated from the current balance, including
    when the same movement is later fetched via the Event Timeline
    (`GET .../movements`). Null for the three ON_BALANCE_ASSET instruments
    (`EPLC_DUE_FROM_ISSUING_BANK`/`EPLC_ACCEPTANCE_REIMB_RECEIVABLE`/
    `EPLC_EXPORT_BILLS_DISCOUNTED`) and for any unrecognized movementType —
    on-balance-sheet liability stays out of scope for this field, same
    boundary as the rest of this contract. Deliberately a DIFFERENT concept
    from the pre-existing `accountEntries`/`AccountEntry` array (a
    caller-supplied, downstream-accounting-owned Dr/Cr leg list this
    service only stores/passes through, per §3.3 "GL Ownership") —
    `contingentAccountEntry` is server-derived, contingent-ledger-specific,
    and always exactly zero-or-one pair, never caller-supplied and never an
    array.


    v1.2.0 (2026-08-16, bug fixed, reviewer-reported — "A1 -> A8 -> A3S -> A4, the related SG entries
    was not shown"): ADDED `GET /balance-movements?businessEventId=`. Root cause: the reference Angular
    Transaction Builder client's own Checker Release for a linked-movement submission (A3S's SG
    redemption + LC UTILIZE, B5's Acceptance settle + Reimbursement Receivable REIMBURSE) used to
    resolve the linked leg's own movementId purely from the Maker's own in-memory client state —
    correct only when the SAME browser session that submitted also performs the release, never true
    for a genuinely separate Checker session (the whole point of Maker/Checker 4-eyes separation). This
    endpoint gives any caller a server-side way to resolve that correlation independently, via the
    businessEventId every linked-movement submission already shared but was never queryable by. No
    change to `POST /balance-movements` itself — `businessEventId` was already an accepted request
    field. At v1.2.0 it was correlation only; v1.36.0 later made a shared businessEventId mandatory for
    atomic compound create while retaining this query behavior.


    v1.3.0 (2026-08-16, bug fixed, reviewer-directed — "A6/B4 也修一下" i.e. "fix A6/B4 too", extending
    v1.2.0's fix to the two named business functions it explicitly left out of scope): ADDED
    `BalanceMovementCreateRequest.referencedTransactionId` / `BalanceMovement.referencedTransactionId`.
    v1.2.0's `businessEventId` lookup only resolves movements CREATED TOGETHER in one submission — A6
    (Acceptance, Usance) and B4 (Honour/Acceptance) instead convert a PRE-EXISTING record (A3's own
    Document Arrival, or B3's own Present Docs) picked at submission time from an EARLIER, separate
    submission, which never shares a businessEventId with the new one at all. `referencedTransactionId`
    is the direct, unambiguous correlation businessEventId can't provide for this shape — the new
    movement simply carries the source record's own movementId. Same passthrough posture as
    businessEventId/sourceTransactionRef: accepted and persisted, never validated to resolve to a real
    movement. `A6`/`B4`'s downstream legs CREATED alongside the new primary (B4's own Acceptance
    liability + Reimbursement Receivable, or the Due from Issuing Bank asset) still resolve via v1.2.0's
    `businessEventId` lookup — only the "source record predates this submission" correlation needed a
    new mechanism.


    v1.4.0 (2026-08-16, business-directed — "Add real Maker Submit, then have Checker to Release it.
    Exactly the same as A1."): ADDED `POST /balance-movements/{movementId}/maker-submit` and
    `BalanceMovement.makerSubmittedBy`/`makerSubmittedAt`. A4 (Sight Settlement) has no movement of its
    own to create at Submit time — it settles the PRE-EXISTING UTILIZE A3/A3S already earmarked (and
    already gave its own contingentAccountEntry at that earlier stage) — so there was no
    `createMovement()` call to stand in as "the Maker submitted," leaving A4 as the only function where
    a Checker could act before any Maker had done anything at all. This endpoint is that missing,
    genuinely backend-persisted Maker action: same shape as v0.8.0's own `/acknowledge` (IPLC_LC/UTILIZE
    only here rather than EPLC_EXAMINATION/CREATE; 400 otherwise), and — same posture as `/acknowledge`
    — deliberately does NOT transition status; the movement stays PENDING throughout (`/release` is
    still the real PENDING -> RELEASED transition). Deliberately NOT enforced as a precondition inside
    `/release` itself — the reference Business Case Runner client releases a UTILIZE directly with no
    separate maker-submit call (an already-working, separately-tested orchestrated flow this feature was
    never meant to constrain); the reference Angular Transaction Builder client enforces the gate itself,
    client-side, before ever calling `/release` for an unsubmitted A4 item.


    v1.5.0 (2026-08-17, Quality-report-balance.md BAL-123, reviewer-found): the v1.4.0 gate above is now
    ALSO enforced server-side, inside `POST /balance-movements/{id}/release` itself — see that
    endpoint's own updated description for the exact scoping (Sight-tenor IPLC_LC/UTILIZE only, checked
    via the movement's own parent contract `tenorType`, never just instrumentType/movementType) and why
    it cannot affect a Usance LC's own UTILIZE (A6's own compound release, which never calls
    `/maker-submit`). Closes the gap the v1.4.0 changelog entry above explicitly named as a deliberate,
    disclosed trade-off ("the reference Angular Transaction Builder client enforces the gate itself,
    client-side") — any caller can now be relied upon to hit this same 409 if it skips
    `/maker-submit`, not just the one reference UI.


    v1.6.0 (2026-08-17, business instruction, "建議把交易當時(PENDING XOR APPROVED) 交易時的Current
    Balance 存檔 VIEW EVENTS時 直接抓取為EVENT SNAPSHOT" / "只存PENDING 或 APPROVED 其中一個"): new
    `BalanceMovement.eventSnapshot` — the same `BalanceSnapshot` shape
    `GET /balance-movements/{id}/balance-as-of` computes on demand, now ALSO captured once at
    `POST /balance-movements` (PENDING) and overwritten at `POST /balance-movements/{id}/release`
    (RELEASED), so a caller already holding the movement (e.g. from the Event Timeline) can read it
    directly with no extra request. `balance-as-of` itself is unchanged and remains the correct source
    for movements predating this field (null `eventSnapshot`).


    v1.7.0 (2026-08-17, same day, business-reported gap then simplified — "REFER TO DB S01" showed a
    child-ledger movement's `eventSnapshot` (e.g. a Shipping Guarantee's own) has no way to surface the
    PARENT LC/Confirmation's own balance impact, which some callers also need; final instruction "不複雜
    就是交易處理時 Look Up Current Balance 的SNAPSHOT (PENDING OR APPROVED) SAVED TO DB == EVENT BALANCE
    SNAPSHOT"): new `BalanceMovement.rootEventSnapshot` — ADDITIONAL to `eventSnapshot` (never a
    replacement — `eventSnapshot` stays this movement's own contract's own balance, unchanged from
    v1.6.0), populated only for a child-ledger movement (SHGT, IPLC_ACCEPTANCE, EPLC_ACCEPTANCE,
    EPLC_EXAMINATION): the parent LC/Confirmation's own plain `BalanceSnapshot` at that same moment —
    exactly what `GET /balance-contracts/{id}/balance` would return for the parent if queried live right
    then, no before/after decoration. Null for a root-level movement (nothing to redirect to) and for
    movements predating this field.


    v1.8.0 (2026-08-17, same day, business-reported gap — live example, LC S02's 3rd event: a plain A3
    Document Arrival UTILIZE on the LC itself, no direct SG movement, with SG G01 already issued —
    "the CURRENT EVENT BALANCE SNAPSHOT should be [both LC Balance AND SG Balance]"; final instruction
    "就是交易當時LC所有的BALANCE的拍照存檔"): new `BalanceMovement.acceptanceEventSnapshot`/
    `sgEventSnapshot` — ADDITIONAL to `eventSnapshot`/`rootEventSnapshot` above, never a replacement.
    Populated whenever exactly ONE Acceptance/Shipping Guarantee contract exists under this movement's
    own root LC/Confirmation (two or more is ambiguous — left null), excluding when this movement's own
    contract already IS that type (`eventSnapshot` already covers it). Each is the sibling's own CURRENT
    plain balance, captured server-side at `POST /balance-movements`/`POST /balance-movements/{id}/release`
    time — a deliberate correction from an initial same-day implementation that fetched this live when
    later viewed; business-confirmed it must be captured/persisted AT TRANSACTION TIME instead, matching
    every other snapshot field in this contract. `sgEventSnapshot` is Import-side only (Shipping
    Guarantee has no Export equivalent). Null for movements predating this field.


    v1.9.0 (2026-08-18, business instruction, "做完A4 A3 的EVENT SNAPSHOT應該跟當初A3交易時一樣 不應改變"
    — after A4 finalizes a Sight Document Arrival, A3's own Event Snapshot must stay exactly as it was
    at A3's own transaction time, unchanged): new `BalanceMovement.finalizeEventSnapshot`. For every
    movement type EXCEPT one, `eventSnapshot` still behaves exactly as v1.6.0 described (captured PENDING
    at Create, OVERWRITTEN RELEASED at Release) — unchanged. The ONE exception: `POST
    /balance-movements/{id}/release` finalizing a Sight-tenor `IPLC_LC`/`UTILIZE` (the v1.4.0/v1.5.0 gate's
    own scoping — A4/Sight Settlement completing an EXISTING A3/A3S Document Arrival rather than creating
    a new movement) now leaves `eventSnapshot` UNTOUCHED — frozen at whatever the original `POST
    /balance-movements` call captured — and instead writes the release-time figures into this new
    `finalizeEventSnapshot` field. Null for every other movement (the vast majority) and for movements
    predating this field.


    v1.10.0 (2026-08-18, same day, business instruction "SNAP SHOT保留當時 LC, SG, ACCEPTANCE BALANCE
    不會因為後續交易而改變" then "SAME AS EXPORT CONFIRMED LC" — the snapshot preservation guarantee
    extended beyond just `eventSnapshot`/A4): new `BalanceMovement.finalizeAcceptanceEventSnapshot`/
    `finalizeSgEventSnapshot` — the v1.9.0-style release-time counterparts to `acceptanceEventSnapshot`/
    `sgEventSnapshot`, written ONLY for the same Sight-tenor `IPLC_LC`/`UTILIZE` finalize case (A4);
    `acceptanceEventSnapshot`/`sgEventSnapshot` themselves stay frozen at Create-time for that one case,
    exactly mirroring `eventSnapshot`/`finalizeEventSnapshot`'s own v1.9.0 split. Separately, `POST
    /balance-movements/{id}/release` finalizing an `EPLC_EXAMINATION`/`CREATE` movement (B3's own Present
    Docs earmark, always finalized for real by B4's own compound release — the Export-side counterpart to
    A4) now leaves that movement's `eventSnapshot`/`rootEventSnapshot`/`acceptanceEventSnapshot` entirely
    UNTOUCHED too — no new field needed for this case, since B4 always creates its own separate movement
    with its own correctly-timed figures, so B3's own row simply needs to stay frozen with no "finalize"
    counterpart to read.


