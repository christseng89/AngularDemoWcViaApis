    Balance. Would it be possible to have the same field for the Export Confirmed LC?"):
    `BalanceSnapshot.tightAvailableBalance` is now ALSO populated for `EPLC_CONFIRMATION`, not just
    `IPLC_LC`/`EPLC_LC`. NOT the same computation as the Import case (`EPLC_CONFIRMATION` has no sibling
    SHGT exposure to net out — SHGT is always a child of `IPLC_LC`) — it reuses the genuine Export-side
    analog instead: `availableBalance` minus the COMBINED `presentDocsEarmarkPending` +
    `presentDocsEarmarkApproved`, the exact figure `POST /balance-movements`' own B3 Present Docs
    sufficiency check already nets internally at creation time (`domain/offBalanceExposure.ts`'s
    `computePresentDocsEarmark`) — this only surfaces that same figure as a persisted/queryable
    `BalanceSnapshot` field, the same way it was already surfaced for Import. `offBalanceExposure`
    itself remains null for `EPLC_CONFIRMATION` (unchanged) — only `tightAvailableBalance` gains this
    second, differently-computed population case.


    v1.12.0 (2026-08-18, same day, business instruction "所有交易要RELEASE過後 才能根據流程走下一個交易" —
    every transaction must genuinely RELEASE before the next step in the flow can act on it) — REMOVES
    `POST /balance-movements/{movementId}/acknowledge` (added v0.8.0) and supersedes the design it
    implemented. B3's own Checker action on an `EPLC_EXAMINATION`/`CREATE` (Present Docs earmark) is now
    the standard `POST /balance-movements/{movementId}/release` — a genuine `PENDING` -> `RELEASED`
    transition, exactly like every other function's own Checker Release — not a separate acknowledgment
    that left `status` at `PENDING` forever. `BalanceMovement.acknowledgedBy`/`acknowledgedAt` remain on
    the schema for historical rows only (pre-2026-08-18 data); nothing writes them any more. New
    `BalanceMovement.presentDocsConsumedAt`/`presentDocsConsumedBy` — set as a SIDE EFFECT of `/release`
    on the Confirmation's own linked `HONOUR`/`ACCEPT` movement (identified via that movement's own
    `referencedTransactionId` pointing back at the `EPLC_EXAMINATION` `CREATE`), i.e. the moment B4
    actually consumes the presentation — replacing `acknowledgedAt` as the basis for
    `BalanceSnapshot.presentDocsEarmarkPending`/`presentDocsEarmarkApproved`: **Pending** = still-`PENDING`
    CREATEs; **Approved** = `RELEASED` CREATEs not yet consumed (`presentDocsConsumedAt` still null) — a
    presentation now continues to occupy Present Docs Earmark capacity through its own genuine Release,
    dropping out only once B4 truly consumes it, preserving the original v0.8.0 commitment-control intent
    (E01+E02+...+En must never exceed the Confirmation's real Available Balance) across this now-real
    `PENDING`->`RELEASED` transition. B4's own compound Release (client-orchestrated, per this file's own
    "one movement, one leg, one call" principle) correspondingly drops its former "release the B3 record
    first" leg — the B3 record is already `RELEASED` by the time B4 acts, and re-releasing it would now
    be a `409 ILLEGAL_STATE_TRANSITION` — B4 releases only its own linked `HONOUR`/`ACCEPT` and any
    secondary leg(s); the consume side effect above happens automatically as part of that same call.


    v1.13.0 (2026-08-20, business instructions — "Tight Available Balance 應該用 Confirmed LC Balance 減
    其他金額, 因為 APPROVED 才可以動用" / "A3 A3S 交易 Approve 過後 不要再顯示"): TWO changes. (1)
    `BalanceSnapshot.tightAvailableBalance` now derives from `confirmedBalance`, not `availableBalance` —
    a still-PENDING increase (ISSUE/AMEND_INCREASE/`EPLC_CONFIRMATION` `AMEND` with a positive amount) no
    longer raises it until genuinely Released, while a still-PENDING decrease still occupies it
    immediately (unchanged from before) — same rule now applied consistently inside the SG Issue and
    Present Docs sufficiency checks at `POST /balance-movements` too, not just the persisted snapshot
    field. Also closes a related gap: `EPLC_CONFIRMATION`'s own `AMEND` movementType (B2, direction riding
    the sign of `amount`) previously ran NO sufficiency check at all in its Decrease direction, unlike
    `IPLC_LC`'s own `AMEND_DECREASE` — now shares that same floor check. (2) RESTORES
    `POST /balance-movements/{movementId}/acknowledge` (removed v1.12.0 for B3) — re-purposed for A3/A3S's
    own `IPLC_LC`/`UTILIZE` instead: the Checker's "Approve" step on a Document Arrival is deliberately
    acknowledgment-only under the hood — it still never transitions `status` (A4/A6 remains the sole real
    finalization), but
    is now genuinely persisted again (`acknowledgedBy`/`acknowledgedAt`, no longer historical-only) so a
    Checker Queue listing can filter an already-approved item out instead of it reappearing as PENDING
    forever.


    v1.14.0 (2026-08-20, same day, business instruction "交易要有 SUBMIT DATETIME/USER, EC DATETIME/USER
    (optional) AND APPROVE DATETIME/USER"): new `BalanceMovement.cancelledBy`/`cancelledAt`. `POST
    /balance-movements/{movementId}/cancel` (Maker EC) previously wrote its actor/time into
    `releasedBy`/`releasedAt` — the same fields `/release` (Approve) writes — disambiguated only by
    `status === 'CANCELLED'` vs `'RELEASED'`. Now writes this dedicated pair instead, so a caller can
    read Submit (`createdBy`/`createdAt`), EC (`cancelledBy`/`cancelledAt`, populated only once
    `status === 'CANCELLED'`), and Approve (`releasedBy`/`releasedAt`, populated only once `status ===
    'RELEASED'`) as three independent facts with no status-based inference required. `/reject` is
    unaffected — a REJECTED movement still reuses `releasedBy`/`releasedAt`, no dedicated
    `rejectedBy`/`rejectedAt` pair was requested.


    v1.15.0 (2026-08-20, same day, two business-reported premature-release gaps, both closed by the
    same "increases counted late, decreases counted early" ("增加從嚴，占用從寬") principle already
    established for other checks in v1.13.0): (1) `BalanceSnapshot.offBalanceExposure`
    (`GET .../balance`, `BalanceMovement.eventSnapshot`, etc.) previously netted a
    `PARTIAL_REDEEM`/`FULL_REDEEM` the moment it was Maker-submitted (`PENDING`), the same as once
    genuinely `RELEASED` — a standalone SHGT redemption submitted but not yet Checker-approved could let
    a SECOND, unrelated submission (a new SG Issue, or a new Document Arrival) pass against capacity that
    was never really freed; if the Checker later rejected that redemption, the bank ended up over its
    real LC capacity. Now only nets a redemption once genuinely `RELEASED`, **except** a redemption
    sharing a still-PENDING `UTILIZE`'s own `businessEventId` on the SAME LC (Document Arrival w/
    Shipping Gtee's own matched compound pair — both legs are always released, or both auto-rolled-back,
    together, so there is no cross-transaction leakage risk in netting that ONE case from Submit). (2)
    The Export-side analog: `BalanceSnapshot.presentDocsEarmarkApproved` previously kept counting an
    already-`RELEASED` `EPLC_EXAMINATION`/`CREATE` in full even while a Confirmation's own `HONOUR`/
    `ACCEPT` that *references it* (`referencedTransactionId`) was already Maker-submitted, `PENDING` —
    that consumption is a foregone, self-balancing conclusion once Submitted (unlike a genuinely separate
    later Checker decision), so it now nets provisionally from that Submit onward too, purely for display
    (`presentDocsConsumedAt` itself is still only genuinely written at the referencing movement's own
    `/release`, unchanged). Both exceptions are scoped identically: they apply ONLY to the persisted/live
    balance display, never to a genuinely separate, independent transaction's own sufficiency check — a
    NEW SG Issue, a NEW Document Arrival, a NEW Present Docs presentation, or an AMEND_DECREASE (A2/B2's
    own Decrease direction) are all still checked against the un-netted, strict figure. Also corrects two
    property descriptions this document itself had left stale since v1.13.0: `tightAvailableBalance`
    (both the IPLC_LC/EPLC_LC and EPLC_CONFIRMATION cases) is derived from `confirmedBalance`, not
    `availableBalance`, as v1.13.0's own changelog entry above already stated but this schema's own field
    description never caught up to reflect; and `POST /balance-movements`' own AMEND_DECREASE sufficiency
    check (and the parallel `EPLC_CONFIRMATION` `AMEND`-Decrease check) compares against Tight Available
    Balance, not plain Available Balance, same correction.


    v1.16.0 (2026-08-21) — re-grounded against the real implementation again: catches this contract up to
    A10 (Import LC Close) / B6 (Export Confirmed LC Close), and two smaller previously-undocumented query
    parameters found in the same pass.
      - ADDED: `movementType: 'CLOSE'` on `IPLC_LC`/`EPLC_LC`/`EPLC_CONFIRMATION` only — writes off
        whatever Confirmed Balance remains and retires the Logical Contract (`ContractStatus.CLOSED`,
        reserved in this schema since the original design but never previously reachable through any
        endpoint — it is now, exclusively via this movementType). Modelled on cs-tf-balance-knowhow
        §3.9/§7.7's "cancellation before expiry" — same write-off entry as a natural expiry, but
        Maker/Checker-triggered rather than date-triggered. Same direction as AMEND_DECREASE/UTILIZE (`-1`).
      - ADDED business rules for CLOSE, checked identically at Maker Submit (`POST /balance-movements`)
        and again at Checker Release (`POST /balance-movements/{id}/release`, since eligibility can move in
        the window between the two): (a) only a root `IPLC_LC`/`EPLC_LC`/`EPLC_CONFIRMATION` is eligible —
        `400` for any other instrumentType; (b) eligibility requires the contract not already CLOSED, its
        own Shipping Guarantee AND Acceptance Confirmed Balance both exactly 0, and no open (PENDING, or a
        RELEASED-but-not-yet-consumed `EPLC_EXAMINATION`) Event anywhere in its whole event tree (root plus
        every SG/Acceptance/Examination child) — `409 INSUFFICIENT_AVAILABLE_BALANCE` at Submit if not met,
        `409 ILLEGAL_STATE_TRANSITION` at Release if it stopped holding since Submit; (c) `amount` must
        exactly equal the contract's own current Confirmed Balance at Submit time (may legitimately be
        zero for an already fully-utilized LC, but never negative) — re-verified byte-for-byte unchanged at
        Release, `409 ILLEGAL_STATE_TRANSITION` otherwise (the caller must cancel and resubmit with the
        current figure, never auto-recomputed server-side).
      - ADDED `GET /balance-contracts/close-eligible` — paginated Step-1 picker hint listing every ACTIVE
        root contract of one instrumentType currently eligible for Close (same eligibility rule as above,
        evaluated in memory over one batched fetch per instrumentType — a real N+1 query fix, not a
        behavioral change; see `analysis/Balance-Component-DB-Optimization-Analysis.md` P2).
      - ADDED query parameters, both previously live but undocumented: `GET /balance-contracts` gains
        `legSeq` (already a `NaturalKey` field, used for Mixed Tenor LC leg resolution — Design doc §7.1,
        also now added to the `NaturalKey` schema below) and `includeAnyStatus` (opt-in, default false;
        inquiry-only callers — Look Up Current Balance, Inquire Events — pass `true` so a CLOSED contract
        stays resolvable for inquiry even though it is no longer selectable to act on; every
        transaction-creating caller omits it, unchanged ACTIVE-only behavior). `GET /balance-contracts/catalog`
        gains `requireIssueReleased` (opt-in; excludes a candidate whose own root ISSUE is still PENDING —
        used by every Maker-ACTION picker, omitted by inquiry-only contexts and B4's own Present Docs search).

    v1.17.0 (2026-08-24, two same-day fixes found during a post-revert audit — see the top-level revert
    note this session's own decision log carries):
      - CHANGED: CURRENCY CONSISTENCY (formerly CURRENCY DERIVATION) — `currency` is now genuinely
        REQUIRED on every request again (added back to `BalanceMovementCreateRequest.required`), not
        optional/server-derived. A broader "omit it, the server derives it" design was proposed once and
        reverted along with unrelated work; only the missing consistency VALIDATION was re-added — a
        supplied `currency` that disagrees with the resolved contract's (or, for a new child contract,
        its parent's) own stored currency is still rejected (`409 CURRENCY_MISMATCH`), but omitting it
        is no longer accepted anywhere.
      - ADDED: `MAKER_CHECKER_CONFLICT` (409) — business-confirmed genuine 4-eyes separation. The same
        user who created a movement (`createdBy`) can no longer also Release (`POST
        /balance-movements/{id}/release`), Reject (`.../reject`), or acknowledge (`.../acknowledge`, A3/
        A3S's own Checker step) it. Checked before the legal-transition check, so a same-user attempt on
        an already-RELEASED movement still reports the conflict, not a misleading illegal-transition
        error. `POST /balance-movements/{id}/cancel` is deliberately UNCHANGED — a Maker's own Error
        Correction on their own still-PENDING entry is the expected, correct case (`createdBy ===
        cancelledBy` there is normal), not a Maker/Checker conflict.

    v1.18.0 (2026-08-24, same day — "A9 Full-Redeem-only 目前只在 Angular UI 層鎖定, API MAKER & CHECKER也要"):
      - CHANGED: A9 (standalone Shipping Guarantee Redemption, `SHGT` `PARTIAL_REDEEM` with no
        `businessEventId`) is now rejected server-side (`409 INSUFFICIENT_AVAILABLE_BALANCE`) at BOTH
        `POST /balance-movements` (Maker Submit) and `POST /balance-movements/{id}/release` (Checker
        Release, defense-in-depth for a movement that reached PENDING some other way) — BA-confirmed
        2026-08-21 (TF_Balance_Component_Mapping Rule #1, "SG discharge is instrument-based, not
