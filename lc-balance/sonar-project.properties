sonar.projectKey=lc-balance-wc
sonar.projectName=LC Balance Component Demo
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Three independent sub-projects analyzed as one SonarQube project (Angular app root, backend/,
# microservices/balance-component/) — see CLAUDE.md's own "High-level architecture" section.
sonar.sources=src,backend,microservices/balance-component/src
sonar.tests=src,backend/test,microservices/balance-component/test

# Co-located spec files (e.g. transaction-builder.component.ts / .spec.ts in the same folder) are
# classified as test code via this pattern rather than a separate directory tree.
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.js

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/*.min.js
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/test/**,**/environments/**,**/main.ts,**/polyfills.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info,backend/coverage/lcov.info,microservices/balance-component/coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info,backend/coverage/lcov.info,microservices/balance-component/coverage/lcov.info


# tsconfig.sonar.json is a scan-only config (not used by ng build/ng test) that overrides
# moduleResolution "bundler" -> "node" and broadens "include" to all of src/**/*.ts — tsconfig.app.json's
# own "bundler" mode isn't recognized by the scanner's bundled TypeScript-ESLint bridge, which failed
# program creation entirely for the Angular app on the first scan attempt (2026-08-17).
sonar.typescript.tsconfigPaths=tsconfig.sonar.json,microservices/balance-component/tsconfig.json
