<div class="tb-pagination" aria-label="Pagination">
  <button
    type="button"
    class="tb-btn tb-btn--tiny tb-btn--outline"
    [disabled]="loading || page <= 1"
    (click)="previousRequested.emit()"
  >
    ‹ Prev
  </button>
  <span class="tb-muted">Page {{ page }} / {{ totalPages }} ({{ total }} total)</span>
  <button
    type="button"
    class="tb-btn tb-btn--tiny tb-btn--outline"
    [disabled]="loading || page >= totalPages"
    (click)="nextRequested.emit()"
  >
    Next ›
  </button>
</div>
