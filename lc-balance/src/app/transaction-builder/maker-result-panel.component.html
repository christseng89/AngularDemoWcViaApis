<div class="tb-result" *ngIf="result || error" role="status" aria-live="polite" aria-atomic="true">
  <h3 class="tb-result__title">Maker Result</h3>
  <app-feedback-message *ngIf="errorFeedback as feedback" [message]="feedback"></app-feedback-message>
  <p class="tb-result__status" *ngIf="result?.status"><strong>Status:</strong> {{ statusLabel }}</p>

  <button
    type="button"
    class="tb-btn tb-btn--outline mt-2"
    *ngIf="compoundLegs?.arrivalSgRedeemMovement?.contingentAccountEntry && !result?.contingentAccountEntry"
    (click)="openEntries(compoundLegs!.arrivalSgRedeemMovement!, 'SHGT')"
  >
    Account Entries — SG Redemption
  </button>
  <button
    type="button"
    class="tb-btn tb-btn--outline mt-2"
    *ngIf="compoundLegs?.acceptanceMovement?.contingentAccountEntry && !result?.contingentAccountEntry"
    (click)="openEntries(compoundLegs!.acceptanceMovement!, 'EPLC_ACCEPTANCE')"
  >
    Account Entries — Acceptance
  </button>

  <p class="tb-hint" *ngIf="result?.status === 'PENDING'">
    Go to the Checker section below to Release or Reject this — or any other still-PENDING item on this same contract.
  </p>

  <div class="tb-maker-result-actions tb-maker-result-actions--emphasized mt-2" *ngIf="!deletePendingReviewMode">
    <button
      type="button"
      class="tb-btn tb-btn--outline"
      *ngIf="result?.contingentAccountEntry"
      (click)="openEntries(result!, instrumentType, resultPhase)"
    >
      Account Entries
    </button>
    <button
      type="button"
      class="tb-btn tb-btn--outline"
      *ngIf="fixPendingSupported && !fixPendingMode && (result?.status === 'PENDING' || result?.status === 'REJECTED')"
      (click)="fixPending.emit()"
      [disabled]="actionBusy"
    >
      Fix Pending
    </button>
  </div>
</div>
