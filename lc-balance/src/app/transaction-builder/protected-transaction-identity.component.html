<div class="tb-field tb-protected-natural-key mb-2" *ngIf="visible">
  <span class="tb-protected-natural-key__item" *ngFor="let item of items">
    <span class="tb-protected-natural-key__label">{{ item.label }}</span>
    <span class="tb-protected-natural-key__value tb-natural-key--emphasized">{{ item.value }}</span>
  </span>
</div>
